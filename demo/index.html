// Spoor regels op die elkaar (mogelijk) tegenspreken, zodat de coach weet waarom
// een schema soms niet doet wat hij verwacht.
// Waarschuwingen die met de speelvorm te maken hebben (gelden voor het hele schema).
function formConflicts(){
  const out=[];
  const rs=state.rules||[];
  const vorm=q=>formOfQ(q,rs);
  const heeft=(q,pid)=>positionsOfQ(q,rs).some(p=>p.id===pid);
  const nm=id=>{const p=byId(id);return p?p.name:'?';};
  // vaste positie die in een gekozen speelvorm niet bestaat
  rs.filter(r=>(r.type==='pos'||r.type==='condpos'||r.type==='rotate')&&r.pos).forEach(r=>{
    const mist=[0,1,2,3].filter(q=>!heeft(q,r.pos));
    if(mist.length&&mist.length<4){
      out.push(`${nm(r.p1)} heeft ${POSMAP[r.pos]?POSMAP[r.pos].name.toLowerCase():r.pos} als vaste plek, maar die bestaat niet in de speelvorm van ${mist.map(q=>'Q'+(q+1)).join(', ')} — daar krijgt hij de meest verwante plek.`);
    }
  });
  // Q3-spiegel met een andere speelvorm in Q3 dan in Q1
  if(rs.some(r=>r.type==='q3likeq1') && vorm(0)!==vorm(2))
    out.push(`Start Q3 kan niet gelijk zijn aan start Q1: Q1 speelt ${vorm(0)} en Q3 speelt ${vorm(2)}. Dezelfde spelers beginnen wel, maar op andere posities.`);
  return out;
}
// Controleert achteraf welke regels het schema niet heeft kunnen waarmaken.
// De planner probeert minimum- en maximumminuten te halen, maar als er geen
// geldige ruil is stopt hij stil — dan bleef een speler onder zijn ondergrens
// zonder dat iemand het merkte. Ook een 'sterkste slot' kan een maximum
// doorbreken. Zulke regels zijn soms wiskundig onhaalbaar (vijftien spelers die
// allemaal vijftig minuten moeten maken past niet in 700 minuten), dus melden is
// het enige juiste: garanderen kan niet.
function nietGehaaldeRegels(sch){
  if(!sch||!sch.minutes)return [];
  const uit=[];
  const naam=id=>pName(id);
  const rond=x=>fmtMin(Math.round(x*10)/10);
  for(const r of (state.rules||[])){
    if(r.type!=='minutes')continue;
    const p=byId(r.p1);
    if(!p||!p.present)continue;
    const echt=sch.minutes[r.p1];
    if(echt==null)continue;
    if(r.mm==='min' && echt < r.min-0.01)
      uit.push(`${naam(r.p1)} zou minimaal ${r.min} minuten spelen, maar komt op ${rond(echt)} min.`);
    if(r.mm==='max' && echt > r.min+0.01)
      uit.push(`${naam(r.p1)} zou hoogstens ${r.min} minuten spelen, maar komt op ${rond(echt)} min.`);
  }
  return uit;
}
function detectRuleConflicts(){
  const R=state.rules||[];
  const nm=id=>pName(id);
  const present=id=>{const p=byId(id);return p&&p.present;};
  const out=[];
  const byPlayer={};
  R.forEach(r=>{ if(r.p1){(byPlayer[r.p1]=byPlayer[r.p1]||[]).push(r);} });
  for(const pid in byPlayer){
    const rs=byPlayer[pid];
    const lineOf=pos=>POSMAP[pos]?POSMAP[pos].line:null;
    const fixedPos=rs.filter(r=>r.type==='pos').map(r=>r.pos);
    // vaste positie botst met de linies die bij de speler zijn aangevinkt
    const sp=byId(pid), toegestaan=linesOf(sp);
    fixedPos.forEach(pos=>{
      const l=lineOf(pos);
      if(l&&!toegestaan.includes(l))
        out.push(`${nm(pid)} moet altijd ${POSMAP[pos].name.toLowerCase()} spelen, maar bij zijn naam staat de ${LINES[l]} niet aangevinkt — die botsen.`);
    });
    // twee verschillende vaste posities
    if(new Set(fixedPos).size>1) out.push(`${nm(pid)} heeft meerdere vaste posities — alleen de eerste kan gelden.`);
    // keeper + veldregels
    const p=byId(pid);
    if(p&&p.prefs&&p.prefs[0]==='keeper'&&rs.some(r=>['pos','rotate','minutes','start'].includes(r.type)))
      out.push(`${nm(pid)} is keeper; veldregels (positie, minuten) hebben voor de keeper geen effect.`);
    // min > max minuten
    const mins=rs.filter(r=>r.type==='minutes'&&r.mm==='min').map(r=>r.min);
    const maxs=rs.filter(r=>r.type==='minutes'&&r.mm==='max').map(r=>r.min);
    if(mins.length&&maxs.length&&Math.max(...mins)>Math.min(...maxs))
      out.push(`${nm(pid)} heeft een minimum (${Math.max(...mins)} min) dat hoger ligt dan zijn maximum (${Math.min(...maxs)} min).`);
    const halfR=rs.find(r=>r.type==='half'); // alleen nog voor regels van een oudere versie
    // uitgesloten kwarten die samen (bijna) de hele wedstrijd beslaan
    const noqAlle=[...new Set(rs.filter(r=>r.type==='noq').flatMap(noqQs))];
    // twee kwarten uitgesloten (bijv. 'alleen de eerste helft') plus een laag maximum
    if(noqAlle.length>=2&&maxs.length&&Math.min(...maxs)<17)
      out.push(`${nm(pid)} speelt maar twee kwarten én heeft een laag maximum — mogelijk weinig speeltijd.`);
    if(noqAlle.length>=3)
      out.push(`${nm(pid)} is uitgesloten in ${noqAlle.sort().map(q=>'Q'+q).join(', ')} — hij speelt dan nog maar één kwart.`);
    if(halfR&&noqAlle.length){
      const eigen=halfR.half===1?[1,2]:[3,4];
      if(eigen.every(q=>noqAlle.includes(q)))
        out.push(`${nm(pid)} speelt alleen de ${halfR.half===1?'eerste':'tweede'} helft, maar is in beide kwarten daarvan uitgesloten — hij komt zo niet in het veld.`);
    }
    // 'speelt zeker het einde' botst met regels die het einde juist uitsluiten
    const endR=rs.find(r=>r.type==='endstrong');
    if(endR){
      if(rs.some(r=>r.type==='noq'&&noqQs(r).includes(4))) out.push(`${nm(pid)} moet zeker het einde spelen, maar mag ook niet in Q4 — die regels botsen.`);
      if(halfR&&halfR.half===1) out.push(`${nm(pid)} moet zeker het einde spelen, maar speelt alleen de eerste helft — die regels botsen.`);
      if(rs.some(r=>r.type==='start'&&r.start==='bench')&&endR.amt!=='min10'){/* start-bank en eind-spelen kunnen prima samen */}
    }
    // vervangkeeper die ook veldregels heeft: die gelden alleen in zijn niet-keeper-kwarten
    if(rs.some(r=>r.type==='gk')&&rs.some(r=>['pos','rotate'].includes(r.type)))
      out.push(`${nm(pid)} keept een deel van de wedstrijd; positie- of linieregels gelden alleen in de kwarten dat hij níét keept.`);
  }
  // rotate: een speler in twee verschillende rotatieparen
  const inRot={};
  R.filter(r=>r.type==='rotate').forEach(r=>{[r.p1,r.p2].forEach(id=>{inRot[id]=(inRot[id]||0)+1;});});
  for(const id in inRot){ if(inRot[id]>1) out.push(`${nm(id)} zit in meerdere afwissel-paren — dat kan niet tegelijk.`); }
  // afwezige spelers met regels
  R.forEach(r=>{ if(r.p1&&!present(r.p1)&&byId(r.p1)) { /* stille regel: afwezig telt toch niet mee */ } });
  return out.filter((x,i)=>out.indexOf(x)===i);
}
// Bepaalt wie er op doel staat: vaste keeper, aanwezige gastkeeper, of per kwart via 'gk'-regels.
// Zet state.keeperId en geeft true terug als alles klopt; anders false met een melding.
function resolveKeeperOrWarn(){
  const present=state.players.filter(p=>p.present);
  // Keeper = de speler met 'Keeper' als eerste voorkeur. Precies één, en aanwezig.
  const keepers=state.players.filter(p=>p.prefs&&p.prefs[0]==='keeper');
  const vasteKeeperAanwezig=keepers.length===1&&keepers[0].present;
  // Vervangkeepers per kwart (regels van type 'gk')
  const gkRules=(state.rules||[]).filter(r=>r.type==='gk');
  const gkDekking={}; gkRules.forEach(r=>(r.qs||[]).forEach(q=>{if(!gkDekking[q])gkDekking[q]=r.p1;}));
  const gastKeeper=keepers.find(k=>k.guest&&k.present);

  if(vasteKeeperAanwezig){
    // Normale situatie: de vaste keeper doet de hele wedstrijd
    if(keepers.length>1){toast('Er zijn meerdere keepers — er mag er maar één zijn');activeTab='spelers';render();return false;}
    state.keeperId=keepers[0].id;
  } else if(gastKeeper){
    // Een aanwezige gastspeler is als keeper aangewezen: die doet het
    state.keeperId=gastKeeper.id;
  } else {
    // Vaste keeper afwezig én geen gastkeeper -> dwing af dat álle 4 kwarten via 'gk'-regels gedekt zijn
    const ontbreekt=[1,2,3,4].filter(q=>!gkDekking[q]);
    if(ontbreekt.length){
      toast('Geen keeper voor '+ontbreekt.map(q=>'Q'+q).join(', ')+' — wijs via Regels een keeper aan voor elk kwart');
      activeTab='regels';render();return false;
    }
    // check dat de aangewezen keepers ook bestaan en aanwezig zijn
    const afwezig=Object.values(gkDekking).some(id=>{const p=byId(id);return !p||!p.present;});
    if(afwezig){toast('Een aangewezen keeper is afwezig — pas de keeper-regels aan');activeTab='regels';render();return false;}
    state.keeperId=null; // geen vaste keeper; per kwart geregeld via gkDekking
  }
  // 10 veldspelers + keeper = 11 aanwezigen minimaal
  if(present.length<11){toast('Minimaal 11 aanwezige spelers nodig (incl. keeper)');return false;}
  return true;
}
function regenerate(){
  if(cloudViewerBlocked())return;
  if(!resolveKeeperOrWarn())return;
  snapshot('genereren');
  wisUitStatus(); wisGebeurtenissen(); // nieuw schema: blessures en gebeurtenissen vervallen
  state.schedule=buildSchedule(state);
  state.genHash=inputHash(state);
  const stuk=state.schedule?schemaKlopt(state.schedule):'geen schema';
  if(stuk){onthoudFout('genereren',new Error(stuk));}
  const conflicts=detectRuleConflicts().concat(formConflicts()).concat(nietGehaaldeRegels(state.schedule));
  save();render();
  sendSwapTimesToTimer();
  demoTel('schema_gemaakt');
  if(conflicts.length){
    swapWarnings=conflicts;
    toast('Let op: sommige regels botsen — zie de melding');
  }else{
    const _pq=state.schedule.perQ, _bl=Math.round(17.5/_pq*10)/10;
    toast(_pq===2?'Schema gemaakt — 1 wissel halverwege elk kwart'
                :`Schema gemaakt — ${_pq-1} wisselmomenten per kwart (blokken van ${fmtMin(_bl)} min)`);
  }
}
// Keuzevenster bij een tik op een speler tijdens de wedstrijd.
function spelerActies(pid,q){
  const p=byId(pid); if(!p)return;
  const sch=state.schedule, b=q*sch.perQ+huidigBlok(q);
  const asg=sch.assignments[b]||{};
  const inVeld=Object.values(asg).includes(pid);
  const isKeeper=pid===((sch.keeperByQ&&sch.keeperByQ[q])||sch.keeperId);
  const knoppen=[];
  if(p.kaart){
    const k=KAARTEN[p.kaart.soort], rest=kaartResterend(p);
    knoppen.push(['kaartterug',ico('vink')+(rest>0?'Nu al terug op het veld':'Terug op het veld')]);
    knoppen.push(['weg',ico('verboden')+'Vandaag niet meer',true]);
  }else if(p.uit){
    knoppen.push(['terug',ico('vink')+'Weer beschikbaar &mdash; op de bank']);
    knoppen.push(['weg',ico('verboden')+'Vandaag niet meer',true]);
  }else{
    if(!isKeeper){
      knoppen.push(['ruil',ico('wissel')+'Wissel met een andere speler']);
      knoppen.push(['blessure',ico('blessure')+'Blessure &mdash; even niet beschikbaar']);
    }
    knoppen.push(['weg',ico('verboden')+'Vandaag niet meer beschikbaar',true]);
    if(!isKeeper){
      knoppen.push(['groen','<span class="kaartvlak groen"></span>Groene kaart &mdash; 2 minuten eruit']);
      knoppen.push(['geel','<span class="kaartvlak geel"></span>Gele kaart &mdash; 5 minuten eruit']);
    }
  }
  const waar=p.uit?'niet beschikbaar':(isKeeper?'op doel':(inVeld?'in het veld':'op de bank'));
  const html=`<div class="modal-back" id="mback"><div class="modal">
    <h3>${esc(p.name)} <span class="sub">${waar}</span></h3>
    ${knoppen.map(([k,t,gevaar])=>`<button class="btn ${gevaar?'gevaar':'ghost'} full" data-act2="${k}" style="margin-top:8px;text-align:left">${t}</button>`).join('')}
    <button class="btn ghost full" id="mcancel" style="margin-top:14px">Annuleren</button>
  </div></div>`;
  document.getElementById('modalHost').innerHTML=html;
  const back=document.getElementById('mback');
  back.onclick=e=>{if(e.target===back)closeModal();};
  document.getElementById('mcancel').onclick=closeModal;
  document.querySelectorAll('[data-act2]').forEach(el=>el.onclick=()=>{
    const act=el.dataset.act2; closeModal();
    if(act==='ruil'){ selChip=pid; render(); toast('Tik nu de speler aan om mee te ruilen'); return; }
    if(act==='blessure'){
      snapshot('blessure '+p.name);
      p.uit=true;
      if(!herplanVanafNu(p.name+' even niet inzetbaar',false,{type:'blessure',pid:p.id})){delete p.uit;render();}
      return;
    }
    if(act==='weg'){
      snapshot(p.name+' afgemeld');
      const wasUit=!!p.uit;
      delete p.uit; p.present=false;
      const gelukt = wedstrijdBezig()
        ? herplanVanafNu(p.name+' vandaag niet meer',false,{type:'weg',pid:p.id})
        : herplanHeleWedstrijd(p.name+' afgemeld');
      if(!gelukt){p.present=true;if(wasUit)p.uit=true;render();}
      return;
    }
    if(act==='groen'||act==='geel'){
      const k=KAARTEN[act];
      snapshot(p.name+' '+k.naam);
      // Geen herplanning: het team speelt de straftijd met een man minder en daarna
      // staat hij weer op zijn eigen plek. Het wisselschema blijft dus ongemoeid.
      p.kaart={soort:act,terug:totaalSec()+k.min*60};
      demoTel('kaart');
      noteerGebeurtenis(q, p.name+' krijgt een '+k.naam+' en staat '+k.min
        +' minuten buiten het veld; het team speelt zolang met een man minder.');
      save(); render();
      toast(p.name+' \u2014 '+k.naam+', '+k.min+' minuten eruit');
      return;
    }
    if(act==='kaartterug'){
      snapshot(p.name+' terug na kaart');
      const soort=p.kaart?KAARTEN[p.kaart.soort].naam:'kaart';
      delete p.kaart;
      // Hij stond nog gewoon in het schema, dus er valt niets te herplannen.
      // Stond het wisselmoment tijdens zijn straftijd, dan is hij inmiddels gewisseld
      // en komt hij op de bank terug in plaats van op zijn oude plek.
      const a=state.schedule.assignments[q*state.schedule.perQ+huidigBlok(q)]||{};
      const pos=Object.keys(a).find(k=>a[k]===p.id);
      noteerGebeurtenis(q, pos&&POSMAP[pos]
        ? p.name+' komt na zijn '+soort+' terug op '+POSMAP[pos].name.toLowerCase()+'.'
        : p.name+' mag na zijn '+soort+' weer meedoen en volgt verder het wisselschema.');
      save(); render();
      toast(pos?p.name+' staat weer op het veld':p.name+' doet weer mee volgens het schema');
      return;
    }
    if(act==='terug'){
      snapshot(p.name+' weer beschikbaar');
      delete p.uit; delete p.kaart;
      // Altijd eerst op de bank: hij valt pas bij het eerstvolgende wisselmoment in.
      // Stond hij nog in het blok dat in beeld staat (dat gebeurt als de klok is
      // gereset), dan halen we hem daar eerst uit.
      haalUitHuidigBlok(p.id);
      if(!herplanVanafNu(p.name+' weer beschikbaar \u2014 op de bank',true,{type:'terug',pid:p.id})){p.uit=true;render();}
      return;
    }
  });
}
// Haal een speler uit het blok dat nu in beeld staat en zet er iemand van de bank
// voor in de plaats. Nodig bij een terugkeer met een stilstaande klok: dat blok wordt
// als 'verleden' bevroren, en als de speler daar nog in stond zou hij meteen weer in
// het veld verschijnen in plaats van op de bank.
function haalUitHuidigBlok(pid){
  const sch=state.schedule; if(!sch)return;
  const q=huidigQ();
  const b=q*sch.perQ+huidigBlok(q);
  const asg=sch.assignments[b]; if(!asg)return;
  const pos=Object.keys(asg).find(k=>asg[k]===pid); if(!pos)return;
  const opVeld=new Set(Object.values(asg));
  const keeper=(sch.keeperByQ&&sch.keeperByQ[q])||sch.keeperId;
  const bank=state.players.filter(p=>p.present&&!p.uit&&p.id!==keeper&&p.id!==pid&&!opVeld.has(p.id));
  // liefst iemand die in deze linie uit de voeten kan
  const linie=POSMAP[pos]&&POSMAP[pos].line;
  const kandidaat=bank.find(p=>!linie||magInLinie(p,linie))||bank[0];
  if(kandidaat)asg[pos]=kandidaat.id;
}
// Staat de klok stil, dan is er geen 'nu' om vanaf te herplannen: dan rekenen we
// de hele wedstrijd gewoon opnieuw uit. Zonder dit kon een herstelde speler pas
// terugkomen nadat je de timer had gestart.
function herplanHeleWedstrijd(label){
  if(!resolveKeeperOrWarn())return false;
  const vers=buildSchedule(state);
  if(!vers){toast('Herplannen lukt niet met deze spelers');return false;}
  state.schedule=vers; state.genHash=inputHash(state);
  planInfo=[label+' \u2014 de klok staat op nul, dus het hele wisselschema is opnieuw gemaakt.'];
  save();render();sendSwapTimesToTimer();
  toast(label);
  return true;
}
// Herplan vanaf het blok dat nu bezig is. Alles daarvóór ligt vast, inclusief de
// al gespeelde blokken per speler, zodat de resterende minuten eerlijk verdeeld worden.
// Vergelijkt het oude en het nieuwe schema en vertelt in gewone taal wat er
// veranderd is: eerst wat er nú op het veld gebeurt, daarna wat er verderop schuift.
// Eén zin voor in het wisselschema: wie ging eruit, wie kwam ervoor in de plaats.
function tekstVanGebeurtenis(g,oud,nieuw,vanaf){
  const naam=pKort(g.pid);
  if(g.type==='kaart'){
    const k=KAARTEN[g.soort]||{min:0,naam:'kaart'};
    const pos2=Object.keys(oud[vanaf]||{}).find(x=>(oud[vanaf]||{})[x]===g.pid);
    const verv=pos2?(nieuw[vanaf]||{})[pos2]:null;
    const plek2=pos2&&POSMAP[pos2]?POSMAP[pos2].name.toLowerCase():'';
    return naam+' krijgt een '+k.naam+' en staat '+k.min+' minuten buiten het veld'
      +(verv?', vervangen door '+pKort(verv)+(plek2?' die op '+plek2+' gaat spelen':''):'')+'.';
  }
  if(g.type==='terug')return naam+' is weer inzetbaar en zit op de bank.';
  if(g.type==='weg')return naam+' is afgemeld voor de rest van de wedstrijd.';
  const a=oud[vanaf]||{}, b=nieuw[vanaf]||{};
  // Wie neemt zijn plek over? Dat is de speler die nu op zijn oude positie staat.
  // Het herplannen verschuift vaak meer, maar dát is niet wat je hier wilt lezen.
  const pos=Object.keys(a).find(k=>a[k]===g.pid);
  const vervanger=pos?b[pos]:null;
  if(!vervanger)return naam+' raakt geblesseerd en gaat eruit.';
  const plek=POSMAP[pos]?POSMAP[pos].name.toLowerCase():'';
  return naam+' raakt geblesseerd en wordt vervangen door '+pKort(vervanger)
    +(plek?' die op '+plek+' gaat spelen':'')+'.';
}
function beschrijfHerplan(oud,nieuw,vanaf,perQ,later){
  const posNaam=(asg,pid)=>{for(const k in asg)if(asg[k]===pid)return POSMAP[k]?POSMAP[k].name.toLowerCase():k;return null;};
  const a=oud[vanaf]||{}, b=nieuw[vanaf]||{};
  const inA=[...new Set(Object.values(a))], inB=[...new Set(Object.values(b))];
  const eruit=inA.filter(p=>!inB.includes(p));
  const erin =inB.filter(p=>!inA.includes(p));
  const schuif=inB.filter(p=>inA.includes(p)&&posNaam(a,p)!==posNaam(b,p));
  const zinnen=[];
  if(erin.length||eruit.length){
    const delen=[];
    if(erin.length) delen.push(erin.map(p=>pKort(p)+' erin op '+posNaam(b,p)).join(', '));
    if(eruit.length)delen.push(eruit.map(p=>pKort(p)+' eruit').join(', '));
    zinnen.push((later?'Bij de volgende wissel: ':'Nu meteen: ')+delen.join('; ')+'.');
  }
  if(schuif.length)
    zinnen.push('Doorschuiven: '+schuif.map(p=>pKort(p)+' naar '+posNaam(b,p)).join(', ')+'.');
  if(!zinnen.length)zinnen.push(later?'Bij de volgende wissel verandert er niets.':'Op het veld verandert er nu niets.');
  // wat er verderop nog verandert
  const anders=[];
  for(let i=vanaf+1;i<nieuw.length;i++)
    if(JSON.stringify(oud[i]||{})!==JSON.stringify(nieuw[i]||{}))anders.push(i);
  if(anders.length){
    const kw=[...new Set(anders.map(i=>Math.floor(i/perQ)+1))].map(n=>'Q'+n);
    const lijst=kw.length>1?kw.slice(0,-1).join(', ')+' en '+kw[kw.length-1]:kw[0];
    zinnen.push('Daarna zijn '+anders.length+' wisselmoment'+(anders.length>1?'en':'')+' opnieuw verdeeld, in '+lijst+'.');
  }else{
    zinnen.push('De rest van de wedstrijd blijft ongewijzigd.');
  }
  return zinnen.join(' ');
}
// vanafVolgende=true: het lopende blok blijft ook vast, er wordt pas vanaf het
// volgende wisselmoment opnieuw gepland. Zo komt een herstelde speler eerst op
// de bank en pas bij de eerstvolgende wissel weer in het veld.
// Wat er tijdens de wedstrijd tussendoor gebeurt — een blessure, een herstel — hoort
// in het wisselschema te staan. Zonder dit zag je alleen de geplande momenten op 6 en
// 12 minuten, en niet dat er op 8 minuten iemand van het veld ging.
function gebeurtenissen(){ if(!Array.isArray(state.gebeurtenissen))state.gebeurtenissen=[]; return state.gebeurtenissen; }
function noteerGebeurtenis(q,tekst){
  const sec=(klok.q===q+1)?klok.sec:0;
  gebeurtenissen().push({q,sec,min:Math.round(sec/60),tekst});
}
function wisGebeurtenissen(){ state.gebeurtenissen=[]; }
function herplanVanafNu(label,vanafVolgende,gebeurtenis){
  if(!state.schedule){toast('Genereer eerst een opstelling');return false;}
  const sch=state.schedule, perQ=sch.perQ, B=perQ*4;
  const q=huidigQ();
  let vanaf=q*perQ+huidigBlok(q);
  if(vanafVolgende)vanaf++;
  if(vanaf>=B){                       // laatste blok loopt al: niets meer te plannen
    planInfo=[label+' \u2014 het laatste blok van de wedstrijd loopt al, dus het schema verandert niet meer. Hij staat op de bank.'];
    save();render();
    toast(label);
    return true;
  }
  const fixedBlocks={}, playedSoFar={};
  const pool=state.players.filter(p=>p.present && p.id!==state.keeperId);
  pool.forEach(p=>playedSoFar[p.id]=0);
  for(let b=0;b<vanaf;b++){
    const set=new Set(Object.values(sch.assignments[b]||{}));
    fixedBlocks[b]=set;
    set.forEach(pid=>{ if(playedSoFar[pid]!=null)playedSoFar[pid]++; });
  }
  const oudAssign=JSON.parse(JSON.stringify(sch.assignments));
  const fresh=buildSchedule(state,{forcePerQ:perQ,fromBlock:vanaf,fixedBlocks,playedSoFar,
    vastAssignments:sch.assignments});
  if(!fresh){toast('Herplannen lukt niet met deze spelers');return false;}
  state.schedule=fresh; state.genHash=inputHash(state);
  const blokLen=17.5/perQ;
  const blokIndex=vanaf-q*perQ;
  const min=Math.round(blokIndex*blokLen);
  const wanneer=(blokIndex>=perQ)
    ? 'Q'+(Math.floor(vanaf/perQ)+1)+' vanaf de start'
    : 'Q'+(q+1)+(min?' na '+min+' min':' vanaf de start');
  planInfo=[label+' \u2014 schema aangepast vanaf '+wanneer+'. '
    +beschrijfHerplan(oudAssign,fresh.assignments,vanaf,perQ,!!vanafVolgende)];
  if(gebeurtenis)noteerGebeurtenis(q,tekstVanGebeurtenis(gebeurtenis,oudAssign,fresh.assignments,vanaf));
  save();render();sendSwapTimesToTimer();
  toast(label);
  return true;
}
// Speler raakt geblesseerd op een bepaald moment; herplan de rest mét de al gespeelde minuten.
// momentBlock = blokindex vanaf waar opnieuw wordt verdeeld (de geblesseerde speelt tot dan mee).
// Herplan vanaf een bepaald kwart met de spelers die nú aanwezig zijn.
// De kwarten vóór 'fromQ' blijven exact staan; alleen 'fromQ' t/m Q4 worden opnieuw verdeeld.
function replanFromQuarter(fromQ){
  if(!state.schedule){regenerate();return;}
  if(!resolveKeeperOrWarn())return;
  snapshot('herplannen vanaf Q'+(fromQ+1));
  const oldSched=state.schedule;
  const oldPerQ=oldSched.perQ;
  const fresh=buildSchedule(state);
  // bewaar de al gespeelde kwarten uit het oude schema, neem de rest uit het nieuwe
  const perQ=fresh.perQ;
  if(perQ===oldPerQ){
    // zelfde blokindeling: plak per blok
    for(let q=0;q<fromQ;q++){
      for(let m=0;m<perQ;m++){ fresh.assignments[q*perQ+m]=oldSched.assignments[q*perQ+m]; }
    }
  } // bij andere blokindeling nemen we het verse schema in zijn geheel (kan niet netjes plakken)
  state.schedule=fresh;
  state.genHash=inputHash(state);
  const conflicts=detectRuleConflicts().concat(formConflicts()).concat(nietGehaaldeRegels(state.schedule));
  save();render();sendSwapTimesToTimer();
  if(conflicts.length){swapWarnings=conflicts;toast('Herplan klaar — let op botsende regels');}
  else toast('Vanaf Q'+(fromQ+1)+' opnieuw gepland met de huidige spelers');
}
// Vertel de timer welk kwart de coach in de app bekijkt.
// De timer negeert dit terwijl de klok loopt, zodat vooruitkijken de tijd niet stopt.
// Stuurt de gedeelde klok naar de timer: wie hem bedient en wat de stand is.
// Is de klokbaas nog in leven? Hij stuurt elke 30 seconden een teken van leven.
// Blijft dat ruim uit, dan is zijn app weggeveegd of zijn batterij leeg en mag
// iedereen de klok weer bedienen. Niemand wordt automatisch de nieuwe baas;
// de eerste die iets doet, claimt hem.
const KLOK_HARTSLAG=30000, KLOK_VERLATEN=100000;
function klokVerlaten(){
  if(!CLOUD.klok||!CLOUD.klokBaas)return false;
  if(CLOUD.klokBaas.id===DEVICE_ID)return false;
  const ts=CLOUD.klok.ts||0;
  return (Date.now()-ts)>KLOK_VERLATEN;
}
let _hartslagT=null;
function hartslagBijwerken(){
  clearInterval(_hartslagT); _hartslagT=null;
  if(!CLOUD.on||!CLOUD.ref||CLOUD.role!=='editor')return;
  if(!CLOUD.klokBaas||CLOUD.klokBaas.id!==DEVICE_ID)return;
  _hartslagT=setInterval(()=>{
    if(document.visibilityState!=='visible')return;
    if(!CLOUD.ref||!CLOUD.klokBaas||CLOUD.klokBaas.id!==DEVICE_ID){clearInterval(_hartslagT);return;}
    CLOUD.ref.set({klok:{...(CLOUD.klok||{}),baas:CLOUD.klokBaas,ts:Date.now()}},{merge:true}).catch(()=>{});
  },KLOK_HARTSLAG);
}
function klokNaarTimer(stand){
  try{
    const th=document.getElementById('timerHost');
    const ifr=th&&th.querySelector('iframe');
    if(!ifr||!ifr.contentWindow)return;
    ifr.contentWindow.postMessage({ghcKlokInfo:{
      aan:!!(CLOUD.on&&CLOUD.status==='verbonden'),
      mijnId:DEVICE_ID,
      baas:CLOUD.klokBaas||null,
      verlaten:klokVerlaten(),
      stand:stand||null
    }},location.origin);
  }catch(e){}
}
// Schrijft het ankerpunt van de klok weg. Alleen bij een actie, niet elke seconde.
// Bedient een ander toestel de klok en heb je zelf de timer nog niet geopend, dan
// komen er geen tijdmeldingen binnen en staat je veldklok stil. Dit laat hem toch
// meelopen op het ankerpunt uit de cloud. Zodra je eigen timer draait, neemt die het over.
let _volgT=null;
function volgKlokVanAnder(){
  clearInterval(_volgT);
  const tik=()=>{
    const k=CLOUD.klok;
    if(!k||!CLOUD.klokBaas||CLOUD.klokBaas.id===DEVICE_ID){clearInterval(_volgT);return;}
    const th=document.getElementById('timerHost');
    if(th&&th.querySelector('iframe')){clearInterval(_volgT);return;}  // eigen timer is leidend
    let sec=k.basis||0, loopt=!!k.loopt;
    if(k.loopt&&k.sinds)sec+=Math.max(0,(Date.now()-k.sinds)/1000);
    if(sec>17.5*60+600){ sec=Math.min(k.basis||0,17.5*60+600); loopt=false; }  // achtergelaten ankerpunt
    klok={q:k.q,sec:Math.floor(sec),loopt:loopt};
    veldKlokBijwerken(); beeldBijwerken();
  };
  tik();
  if(CLOUD.klok&&CLOUD.klok.loopt)_volgT=setInterval(tik,1000);
}
function klokPush(k){
  if(!CLOUD.on||!CLOUD.ref||CLOUD.role!=='editor')return;
  // Iemand anders bedient de klok — tenzij die al ruim een minuut niets meer van
  // zich laat horen; dan is het slot vervallen en claimt de eerste die iets doet.
  if(CLOUD.klokBaas&&CLOUD.klokBaas.id!==DEVICE_ID&&!klokVerlaten())return;
  clearTimeout(CLOUD.klokT);
  CLOUD.klokT=setTimeout(()=>{
    // Wie als eerste de klok bedient, is de klokbaas en blijft dat ook na pauze.
    const baas={id:DEVICE_ID,naam:CLOUD.name||'coach'};
    CLOUD.klokBaas=baas; CLOUD.klok={...k,baas,ts:Date.now()}; hartslagBijwerken();
    CLOUD.ref.set({klok:{...k,baas,ts:Date.now()}},{merge:true})
      .catch(e=>toast('Klok delen mislukt: '+(e.message||e)));
  },150);
}
// Klok overnemen van een ander toestel: bewuste actie via de Samenwerken-kaart.
// Tik op een geblokkeerde knop in de timer: leg uit wie de klok heeft en bied aan
// hem over te nemen. Zonder dit gebeurt er bij een tik niets en snapt niemand waarom.
function vraagKlokOvernemen(){
  if(!CLOUD.klokBaas||CLOUD.klokBaas.id===DEVICE_ID)return;
  if(document.querySelector('#modalHost .modal'))return;
  const verlaten=klokVerlaten();
  confirmDialog({
    title:'Klok overnemen?',
    body: verlaten
      ? `De klok van ${CLOUD.klokBaas.naam} reageert al ruim een minuut niet meer. Waarschijnlijk is die app afgesloten. Wil jij de klok overnemen?`
      : `${CLOUD.klokBaas.naam} bedient nu de klok. Neem je hem over, dan kun jij starten, pauzeren en de tijd bijstellen; bij ${CLOUD.klokBaas.naam} worden die knoppen geblokkeerd.`,
    okLabel:'Overnemen',
    cancelLabel:'Laat maar',
    onOk:klokOvernemen
  });
}
function klokOvernemen(){
  if(!CLOUD.on||!CLOUD.ref||CLOUD.role!=='editor'){toast('Alleen een verbonden coach kan de klok overnemen');return;}
  const baas={id:DEVICE_ID,naam:CLOUD.name||'coach'};
  CLOUD.klokBaas=baas;
  CLOUD.ref.set({klok:{...(CLOUD.klok||{q:1,basis:0,sinds:null,loopt:false}),baas,ts:Date.now()}},{merge:true})
    .then(()=>{toast('Je bedient nu de klok');hartslagBijwerken();klokNaarTimer(null);render();})
    .catch(e=>toast('Overnemen mislukt: '+(e.message||e)));

function sendQuarterToTimer(q){
  try{
    const th=document.getElementById('timerHost');
    const ifr=th&&th.querySelector('iframe');
    if(!ifr||!ifr.contentWindow)return;
    ifr.contentWindow.postMessage({ghcSetQuarter:q},location.origin);
  }catch(e){}
}
function sendSwapTimesToTimer(){
  try{
    const th=document.getElementById('timerHost');
    const ifr=th&&th.querySelector('iframe');
    if(!ifr||!ifr.contentWindow||!state.schedule)return;
    const perQ=state.schedule.perQ, blockLen=17.5/perQ; // minuten per blok
    const times={1:[],2:[],3:[],4:[]};
    for(let q=0;q<4;q++){
      for(let m=1;m<perQ;m++){ times[q+1].push(Math.round(m*blockLen*60)); }
    }
    ifr.contentWindow.postMessage({ghcSwapTimes:times},location.origin);
  }catch(e){}
}

function renderQuarter(q){
  let html='';
  const stale=state.schedule&&state.genHash!==inputHash(state);
  const presentNow=state.players.filter(p=>p.present).length;
  if(presentNow<11){
    html+=`<div class="card" style="text-align:center;padding:34px 18px">
      <div style="margin-bottom:10px;color:var(--dim)">${ico("personen",34)}</div>
      <p style="font-size:15px;font-weight:700;margin-bottom:6px">Nog ${11-presentNow} speler${11-presentNow===1?'':'s'} nodig</p>
      <p class="hint" style="margin-bottom:16px">Er zijn minimaal 11 aanwezige spelers nodig voor een opstelling. Zet op het tabblad <b>Spelers</b> meer spelers op aanwezig${state.players.filter(p=>p.guest).length<2?' of voeg een gastspeler toe':''}.</p>
      <button class="btn ghost" data-goplayers>Naar Spelers</button></div>`;
    return html;
  }
  if(!state.schedule){
    html+=`<div class="card" style="text-align:center;padding:34px 18px">
      <div style="margin-bottom:10px;color:var(--dim)">${ico("bal",34)}</div>
      <p style="font-size:15px;font-weight:700;margin-bottom:6px">Klaar om te genereren</p>
      <p class="hint" style="margin-bottom:16px">${presentNow} spelers aanwezig. Maak het wisselschema met eerlijke speelminuten voor alle vier de kwarten.</p>
      <button class="btn" data-regen>Opstelling genereren</button></div>`;
    return html;
  }
  if(stale&&!(CLOUD.on&&CLOUD.role==='viewer')){
    html+= wedstrijdBezig()
      // Tijdens de wedstrijd nooit het hele schema opnieuw: wat gespeeld is blijft staan
      // en het lopende blok ook, anders verdwijnen spelers halverwege van het veld.
      ? `<div class="banner">${ico("waarschuwing")}Spelers of regels zijn gewijzigd. Verwerken kan vanaf het volgende wisselmoment.<button class="btn small" id="verwerkNuBtn">Verwerken</button></div>`
      : `<div class="banner">${ico("waarschuwing")}Spelers of regels zijn gewijzigd.<button class="btn small" data-regen>Opnieuw genereren</button></div>`;
  }
  html+=warnBoxesHTML();
  const sch=state.schedule, perQ=sch.perQ, blockLen=17.5/perQ;
  // Loopt de klok in dit kwart, dan tonen we het blok dat nú bezig is.
  const qStart=q*perQ;                 // eerste blok van dit kwart: basis voor de wisseltekst
  const lb=levendBlok(q), toonBlok=lb==null?0:lb, b0=qStart+toonBlok;
  _getoond={q:q,blok:toonBlok};        // wat er nú op het scherm staat
  const asg0=sch.assignments[b0];
  const keeper=byId((sch.keeperByQ&&sch.keeperByQ[q])||sch.keeperId);
  const benchIds=benchOfBlock(sch,b0);
  const capt=captainId();
  // Veld: eigen helft onderin, bank als lijstje op de helft van de tegenstander
  const kopTitel = toonBlok===0 ? `Start Q${q+1}, speelvorm ${formOfQ(q)}`
                                : `Actuele opstelling Q${q+1}, speelvorm ${formOfQ(q)}`;
  const kopSub = toonBlok===0 ? `${q<2?'eerste':'tweede'} helft`
                              : `na ${Math.round(toonBlok*blockLen)} min`;
  // De kop staat op het wedstrijdtabblad in de titelbalk bovenaan, niet meer boven
  // het veld: dat scheelt een regel en het veld heeft alle ruimte nodig. 'eerste' of
  // 'tweede helft' is weggelaten, want dat staat al bij de kwartbolletjes.
  const inTitel = isQTab(activeTab) && !isWide();
  if(inTitel)zetAppbarKop(kopTitel + (toonBlok===0?'':` \u00b7 ${kopSub}`));
  let veld=`<div class="card tight">${inTitel?'':`<h2>${kopTitel} <span class="sub">${kopSub}</span></h2>`}`
    +(isWide()?`<div class="veldrij">`:'')
    +`<div class="fieldwrap" id="field">${fieldSVG()}<div class="benchlabel">Wissels</div>${isWide()?'':veldKlokHTML()}`;
  // Geblesseerden staan gewoon in de banklijst, alleen rood. Ze hadden een eigen
  // vak rechtsboven, maar dat kwam op de tablet onder de klok terecht en liep op de
  // telefoon over de opstelling heen zodra het er een paar werden.
  const uitIds=uitLijst().map(p=>p.id);
  const kaartIds=kaartLijst().map(p=>p.id);
  const bankIds=benchIds.concat(uitIds,kaartIds);
  if(bankIds.length){
    // Geblesseerden mogen nooit wegvallen achter de teller: zij zijn juist de
    // uitzondering die je wilt zien. Zij krijgen hun plek eerst, de wisselspelers
    // vullen aan tot de lijst vol is.
    // Bij een grote selectie liep de banklijst over de veldspelers heen. Twee kolommen
    // van hoogstens vier passen altijd; de rest wordt geteld in plaats van getoond.
    // Naast de klok passen twee kolommen van drie; bij een heel grote bank wordt dat
    // twee van twee plus een teller, anders loopt de onderste rij tegen de klok aan.
    // Boven vier rijen loopt de lijst op een telefoon over de voorste linie heen;
    // op de bredere stand is er meer ruimte naast de klok.
    // Drie soorten ruimte: naast de grote klok (liggende tablet) is het krap, op een
    // telefoon loopt de lijst boven zes rijen over de voorste linie, en een staande
    // tablet heeft ruimte zat. De teller '+n' vangt de rest op, en geblesseerden gaan
    // voor omdat zij de uitzondering zijn die je wilt zien.
    const telefoon=window.innerWidth<600;
    // Vier rijen per kolom is de grens: daarboven loopt de lijst over de voorste
    // linie. Met twee kolommen zijn dat er acht, min één voor de teller.
    // Op een telefoon hoogstens zes rijen inclusief de teller: de rechterkolom begint
    // lager (onder de klok) en zou anders over de voorste linie vallen.
    // Alle wisselspelers zijn altijd zichtbaar; er wordt niets meer weggelaten.
    // De rijen zijn daarvoor compacter gemaakt en de lijst staat volledig links
    // van de klok, in twee kolommen.
    const MAX_BANK = bankIds.length;
    const bijzonder=uitIds.concat(kaartIds);
    const ruimteVoorBank=Math.max(1,MAX_BANK-bijzonder.length);
    const bankDeel=benchIds.slice(0,ruimteVoorBank);
    // Ook de bijzondere gevallen worden afgekapt als het er zoveel zijn dat de lijst
    // over de opstelling zou vallen; de teller '+n' telt ze dan mee.
    const uitDeel=bijzonder.slice(0,Math.max(1,MAX_BANK-bankDeel.length));
    const zichtbaar=bankDeel.concat(uitDeel);
    const rest=bankIds.length-zichtbaar.length;
    // Op een telefoon één kolom: twee kolommen liepen onder de klok rechtsboven door,
    // en met de aftelling erbij werden de namen dan afgekapt. De linkerhelft boven de
    // middenlijn is leeg, dus in de hoogte is er ruimte zat.
    const perKol = zichtbaar.length<=3 ? zichtbaar.length : Math.ceil(zichtbaar.length/2);
    const cols=[];
    for(let i=0;i<zichtbaar.length;i+=perKol)cols.push(zichtbaar.slice(i,i+perKol));
    // De teller '+3' kreeg een eigen kolom en schoof daarmee onder de klok;
    // hij hoort onderaan de laatste bestaande kolom.
    const tellerIn=cols.length-1;
    veld+=`<div class="benchlist${cols.length>2?' breed':''}">`+cols.map((col,i)=>`<div class="benchcol">`+col.map(id=>{
        const sp=byId(id), kaart=sp&&sp.kaart?sp.kaart.soort:null;
        const rest=kaart?kaartResterend(sp):null;
        const kl = kaart ? ('kaart '+kaart) : (uitIds.includes(id)?'uit':'');
        const titel = kaart ? KAARTEN[kaart].naam : (uitIds.includes(id)?'Niet inzetbaar':'');
        // Bij een kaart staat de resterende tijd in het bolletje in plaats van het
        // rugnummer. Achter de naam paste hij niet: in de smalle kolom naast de grote
        // klok drong hij namen als 'Boudewijn' weg.
        // Bij een kaart geen rugnummerbolletje: dat maakt de rij te breed. Naam plus
        // de resterende straftijd is wat je op dat moment wilt zien.
        if(kaart){
          return `<div class="brow ${kl} ${selChip===id?'selected':''}" data-chip="${id}" title="${titel}">`
            +`<span>${esc(pKort(id))}</span>`
            +`<b class="ktel${rest===0?' klaar':''}" id="kt-${id}">${rest===0?'nu terug':kaartTijd(rest)}</b></div>`;
        }
        return `<div class="brow ${kl} ${selChip===id?'selected':''}" data-chip="${id}"${titel?' title="'+titel+'"':''}><div class="bball${id===capt?' capt':''}">${pNum(id)}${id===capt?'<span class="cbadge">C</span>':''}</div><span>${esc(pKort(id))}</span></div>`;
      }).join('')+((rest>0&&i===tellerIn)?`<div class="brow meer">+${rest}</div>`:'')+`</div>`).join('')
      +`</div>`;
  }
  for(const pos of positionsOfQ(q)){
    let pid=asg0[pos.id];
    // Speler met een kaart staat buiten het veld; zijn plek blijft open.
    if(pid&&heeftKaart(pid)){
      // Op het veld de straftijd zelf, niet de aftelling: de open plek wordt niet elke
      // seconde opnieuw getekend, dus daar liep de teller achter. De aftelling die wél
      // meeloopt staat in de banklijst.
      const p=byId(pid), k=KAARTEN[p.kaart.soort];
      veld+=`<div class="chip kaartleeg ${p.kaart.soort}" style="left:${pos.x}%;top:${pos.y}%">
        <div class="ball">${pos.kort}</div><div class="tag">${k.min} min</div></div>`;
      continue;
    }
    if(pid){
      const isC=pid===capt;
      veld+=`<div class="chip ${selChip===pid?'selected':''}" data-chip="${pid}" style="left:${pos.x}%;top:${pos.y}%">
        <div class="ball${isC?' capt':''}"><span class="bk${pos.kort.length>=4?' long':''}">${pos.kort}</span>${isC?'<span class="cbadge">C</span>':''}</div><div class="tag">${esc(pKort(pid))}</div></div>`;
    }else{
      veld+=`<div class="chip" style="left:${pos.x}%;top:${pos.y}%;opacity:.45"><div class="ball" style="border-style:dashed;background:none">·</div><div class="pos">${pos.kort}</div></div>`;
    }
  }
  if(keeper)veld+=`<div class="chip kpc" style="left:50%;top:93%"><div class="ball keeperball${keeper.id===capt?' capt':''}">${KEEPER_HELM}${keeper.id===capt?'<span class="cbadge">C</span>':''}</div><div class="tag">${esc(keeper.name)}</div></div>`;
  veld+=`</div>`                                      // einde fieldwrap
    +(isWide()?groteKlokHTML(benchIds.length)+`</div>`:'')   // klok over het veld, einde veldrij
    +`${(CLOUD.on&&CLOUD.role==='viewer')?'':`<p class="hint" style="margin-top:10px">Tik twee spelers aan om te ruilen — ook met de bank. Geldt voor ${toonBlok===0?'de start van dit kwart':'dit moment in het kwart'}.</p>`}</div>`;
  // Alles wat naast het veld komt te staan in de brede stand
  let tekst='';
  // Wissel bij start van kwart (t.o.v. vorige kwart)
  if(q>0){
    const d=wisselChains(sch.assignments[qStart-1],sch.assignments[qStart]);
    const prevK=keeperOfQ(sch,q-1), curK=keeperOfQ(sch,q);
    let kLine='';
    if(prevK&&curK&&prevK!==curK){
      kLine=`<div class="wline"><span class="arr in">&#8645;</span><span><b class="pl-in">${esc(pKort(curK))}</b> op doel &middot; <b class="pl-out">${esc(pKort(prevK))}</b> uit het doel</span></div>`;
    }
    tekst+=`<div class="card"><h2>Bij start van Q${q+1}</h2>${kLine}${chainsEmpty(d)?(kLine?'':'<p class="empty">Geen wissels — zelfde elf als eind Q'+q+'.</p>'):wisselLines(d)}</div>`;
  }
  // Wisselmomenten binnen het kwart
  tekst+=`<div class="card"><h2>Wissels in Q${q+1} <span class="sub">${perQ-1}&times; per kwart</span></h2>`;
  // Geplande wisselmomenten en wat er tussendoor gebeurde, op volgorde van de klok.
  const regels=kwartMomenten(q,sch).map(mo=>({minuut:mo.minuut,soort:'wissel',mo}))
    .concat(gebeurtenissen().filter(g=>g.q===q).map(g=>({minuut:g.min,soort:'gebeurtenis',g})))
    .sort((a,b)=>a.minuut-b.minuut || (a.soort==='wissel'?-1:1));
  for(const r of regels){
    if(r.soort==='gebeurtenis'){
      tekst+=`<div class="wmoment gebeurtenis"><div class="wtime">Na ${r.minuut} min</div>`
        +`<p class="wgeb">${ico('blessure',16)}${esc(r.g.tekst)}</p></div>`;
      continue;
    }
    const mo=r.mo;
    const kop=(q===1||q===3)?`Na ${mo.minuut} min in Q${q+1}, dus bij ${fmtMin(mo.minuut+17.5)} min`:`Na ${mo.minuut} min`;
    tekst+=`<div class="wmoment"><div class="wtime">${kop}</div>`;
    tekst+=chainsEmpty(mo.wissels)?'<p class="empty">Geen wissels op dit moment.</p>':wisselLines(mo.wissels);
    tekst+=`<div class="wbench"><b>Wissels daarna:</b> ${mo.bankNa.map(pKort).map(esc).join(', ')||'—'}</div></div>`;
  }
  tekst+=`</div>`;
  if(!(CLOUD.on&&CLOUD.role==='viewer')){
    if(canUndo())tekst+=`<button class="btn ghost full" id="undoBtn" style="margin-bottom:8px">&#8634; Ongedaan maken (${esc(undoLabel())})${_undoStack.length>1?' &middot; '+_undoStack.length+' stappen':''}</button>`;
    if(wedstrijdBezig()){
      // De wedstrijd loopt: geen herplanknoppen. Wat er onderweg misgaat regel je door
      // een speler aan te tikken; het schema zelf laat je met rust.
      tekst+=`<p class="hint" style="margin:0 0 10px">De wedstrijd loopt. Tik een speler aan om te wisselen of een blessure door te geven; opnieuw genereren kan pas als de klok op nul staat.</p>`;
    }else{
      tekst+=`<button class="btn gevaar full" data-regen style="margin-bottom:8px">&#8635; Opstelling opnieuw genereren</button>`;
      if(q>0)tekst+=`<button class="btn ghost full" id="replanBtn" data-q="${q}" style="margin-bottom:8px">&#9654; Herplan vanaf Q${q+1} met huidige spelers</button>`;
    }
  }
  // Liggende tablet: veld links, wisselteksten rechts. Anders gewoon onder elkaar.
  html+=isWide()?`<div class="twocol"><div class="col-field">${veld}</div><div>${tekst}</div></div>`:veld+tekst;

  return html;
}
function wisselLines(d){
  let s='';
  for(const ch of d.chains){
    let line=`<b class="pl-in">${esc(pKort(ch.inP))}</b> erin op <span class="posname">${POSMAP[ch.pos].name}</span>`;
    if(ch.outP)line+=` &middot; <b class="pl-out">${esc(pKort(ch.outP))}</b> eruit`;
    if(ch.moves.length)line+=`; daardoor schuift `+ch.moves.map(m=>`<b class="pl-mv">${esc(pKort(m.pid))}</b> van ${POSMAP[m.from].name} naar ${POSMAP[m.to].name}`).join(' en ');
    s+=`<div class="wline"><span class="arr in">&#8645;</span><span>${line}</span></div>`;
  }
  for(const o of d.looseOuts){
    s+=`<div class="wline"><span class="arr out">&#9660;</span><span><b class="pl-out">${esc(pKort(o.pid))}</b> eruit <span class="posname">— ${POSMAP[o.pos].name}</span></span></div>`;
  }
  for(const m of d.looseMoves){
    s+=`<div class="wline"><span class="arr mv">&#8594;</span><span><b class="pl-mv">${esc(pKort(m.pid))}</b> schuift van ${POSMAP[m.from].name} naar ${POSMAP[m.to].name}</span></div>`;
  }
  return s;
}

let _lastTab=null;
let zelftestModus=false;
function render(){
  if(zelftestModus)return;   // de uitslag mag niet worden overschreven door een late hertekening
  // Knoppen dimmen wanneer er niets te wijzigen valt: in de kijkstand, en bij een
  // demo waarvan de termijn voorbij is. Stond eerder alleen in de cloudverbinding
  // en werd dus nooit gezet bij een verlopen demo zonder samenwerken.
  document.body.classList.toggle('viewer',(CLOUD.on&&CLOUD.role==='viewer')||(DEMO&&demoVerlopen()));
  if(DEMO)setTimeout(demoTips,0);
  controleerSchema();
  if(CLOUD.on&&CLOUD.role==='viewer'&&['timer','spelers','regels'].includes(activeTab)){activeTab='wedstrijd';}
  wakeLockBijwerken();
  const _sc=document.getElementById('view');
  const _keepY=(_lastTab===activeTab&&_sc)?_sc.scrollTop:null;
  // richting van de tabwissel bepalen voor de schuif-animatie
  const _order=['timer','spelers','regels','wedstrijd','uitleg'];
  let _slide='';
  if(_lastTab!==activeTab){
    const a=_order.indexOf(_lastTab), b=_order.indexOf(activeTab);
    if(a>=0&&b>=0)_slide=b>a?'slideR':'slideL';
  }
  if(_lastTab!==activeTab){swapWarnings=[];planInfo=[];_lastTab=activeTab;}
  document.body.classList.toggle('timermode',activeTab==='timer');
  if(!(isQTab(activeTab)&&!isWide()))herstelAppbarKop();
  const stb=document.getElementById('shareTopBtn');
  if(stb)stb.hidden=!activeTab.startsWith('q')||!state.schedule;
  renderTabbar();
  const v=document.getElementById('view');
  const th=document.getElementById('timerHost');
  if(activeTab==='timer'){
    v.innerHTML='';
    if(!th.dataset.loaded){
      const ifr=th.querySelector('iframe');
      // Eerste keer laden: timer meet zijn ruimte soms te vroeg.
      // Na het laden enkele resize-seintjes sturen zodat hij zich opnieuw uitlijnt.
      ifr.addEventListener('load',()=>{
        const kick=()=>{try{ifr.contentWindow.dispatchEvent(new Event('resize'));}catch(e){}};
        requestAnimationFrame(kick);
        setTimeout(kick,300);
        setTimeout(kick,1200);
        setTimeout(sendSwapTimesToTimer,400);
      setTimeout(()=>klokNaarTimer(CLOUD.klok&&CLOUD.klokBaas&&CLOUD.klokBaas.id!==DEVICE_ID?CLOUD.klok:null),450);
      });
      // Versienummer in de URL: zo kan een oude kopie nooit uit de cache komen.
      ifr.src='timer.html?v='+APP_VERSION;
      th.dataset.loaded='1';
    }
    th.classList.add('show');
    requestAnimationFrame(updateScrollUI);
    return;
  }
  th.classList.remove('show'); // iframe blijft bestaan: timer loopt door
  // Vangnet: gaat het opbouwen van de inhoud mis, dan werd innerHTML nooit toegewezen
  // en bleef de vórige inhoud staan. Het tabblad zag er dan normaal uit maar reageerde
  // nergens meer op — erger dan een leeg scherm, want je merkt het niet.
  const alarm=globaleBanners();
  try{
    if(activeTab==='spelers')v.innerHTML=alarm+renderSpelers();
    else if(activeTab==='regels')v.innerHTML=alarm+renderRegels();
    else if(activeTab==='uitleg')v.innerHTML=renderUitleg();
    else v.innerHTML=alarm+renderWedstrijd();
  }catch(err){
    onthoudFout('tekenen '+activeTab,err);
    v.innerHTML=alarm+`<div class="card"><h2>${ico("waarschuwing")}Er ging iets mis bij het tekenen</h2>
      <p class="hint">De rest van de app werkt gewoon; dit tabblad kon niet worden opgebouwd.</p>
      <p class="hint" style="opacity:.7;word-break:break-word">${esc(String(err&&err.message||err))}</p>
      <button class="btn ghost full" id="retryBtn" style="margin-top:10px">&#8635; Opnieuw proberen</button>
      <button class="btn ghost full" data-regen style="margin-top:8px">&#8635; Schema opnieuw genereren</button></div>`;
  }
  bind(v);
  if(_slide){ v.classList.remove('slideL','slideR'); void v.offsetWidth; v.classList.add(_slide); }
  // Bij her-renderen op hetzelfde tabblad: scrollpositie behouden
  // (iOS springt anders naar boven zodra de inhoud even inklapt).
  if(_keepY!==null&&_sc&&Math.abs(_sc.scrollTop-_keepY)>2)_sc.scrollTop=_keepY;
  requestAnimationFrame(()=>{updateScrollUI();fitNames();zwevendeKlokBijwerken();});
}

// Tik op een speler: tijdens de wedstrijd een keuzevenster, daarvoor gewoon ruilen.
function chipTap(pid){
  if(cloudViewerBlocked())return;
  if(!isQTab(activeTab)||!state.schedule)return;
  const q=huidigQ();
  const sp=byId(pid);
  // Een speler op de blessurelijst moet je altijd kunnen aantikken om hem weer
  // beschikbaar te maken — ook als de klok stilstaat of net gereset is. Anders zit
  // hij vast tot je de timer weer aanzet.
  if(selChip===null && sp && sp.uit){ spelerActies(pid,q); return; }
  // Loopt de wedstrijd, dan eerst vragen wat je wilt — behalve als je midden in een ruil zit.
  if(selChip===null && wedstrijdBezig()){ spelerActies(pid,q); return; }
  if(selChip===null){selChip=pid;render();return;}
  if(selChip===pid){selChip=null;render();return;}
  const lb=levendBlok(q);                       // ruil het blok dat je vóór je ziet
  const b=q*state.schedule.perQ+(lb==null?0:lb);
  const asg=state.schedule.assignments[b];
  const posOf=id=>Object.keys(asg).find(k=>asg[k]===id);
  const pa=posOf(selChip),pb=posOf(pid);
  if(pa&&pb){snapshot('ruil');asg[pa]=pid;asg[pb]=selChip;}
  else if(pa&&!pb){snapshot('ruil');asg[pa]=pid;}
  else if(!pa&&pb){snapshot('ruil');asg[pb]=selChip;}
  else{toast('Kies minstens één veldspeler');selChip=null;render();return;}
  // waarschuwing bij hardere regels — blijft staan tot weggeklikt
  const half=q<2?1:2;
  const found=[];
  for(const r of state.rules){
    for(const id of [pid,selChip]){
      if(r.type==='half'&&r.p1===id&&r.half!==half)found.push(`${pName(id)} hoort volgens de regels alleen de ${r.half===1?'eerste':'tweede'} helft te spelen.`);
      if(r.type==='noq'&&r.p1===id&&noqQs(r).includes(q+1))found.push(`Een regel zegt dat ${pName(id)} niet in Q${q+1} speelt.`);
      if(r.type==='pos'&&r.p1===id){const np=Object.keys(asg).find(k=>asg[k]===id);if(np&&np!==r.pos)found.push(`${pName(id)} staat normaal vast op ${POSMAP[r.pos]?POSMAP[r.pos].name:r.pos}.`);}
    }
  }
  swapWarnings=found.filter((x,i)=>found.indexOf(x)===i);
  selChip=null;save();render();
}

/* ============ Print ============ */
function printFieldSVG(asg,keeperId,POSLIST){
  POSLIST=POSLIST||positionsOf(DEFAULT_FORM);
  const my=y=>((y-35)/65)*78+8;   // eigen helft -> 0..100
  const capt=captainId();
  // aanvoerder in zwart-wit: extra ring om het bolletje plus een klein A-schildje
  const captMark=(x,y)=>`<circle cx="${x}" cy="${y}" r="6.1" fill="none" stroke="#000" stroke-width=".45"/>`
    +`<circle cx="${x+4.6}" cy="${y-4.6}" r="2.1" fill="#fff" stroke="#000" stroke-width=".45"/>`
    +`<text x="${x+4.6}" y="${y-3.75}" text-anchor="middle" font-size="2.7" font-weight="700" fill="#000">C</text>`;
  let s=`<svg class="pf" viewBox="0 0 100 104" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="98" height="102" fill="#fff" stroke="#000" stroke-width=".7"/>
  <line x1="1" y1="1.4" x2="99" y2="1.4" stroke="#000" stroke-width="1"/>
  <path d="M27,103 Q50,73 73,103" fill="none" stroke="#000" stroke-width=".4"/>
  <rect x="44" y="100.8" width="12" height="2.2" fill="none" stroke="#000" stroke-width=".5"/>`;
  for(const pos of POSLIST){
    const pid=asg[pos.id];if(!pid)continue;
    const x=pos.x,y=my(pos.y);
    s+=`<circle cx="${x}" cy="${y}" r="4.4" fill="#fff" stroke="#000" stroke-width="1"/><text x="${x}" y="${y+1.5}" text-anchor="middle" font-size="4.2" font-weight="700" fill="#000">${pNum(pid)}</text>
    <text x="${x}" y="${y+8.4}" text-anchor="middle" font-size="3.6" font-weight="700" fill="#000">${POSMAP[pos.id].kort}&#160;${esc(pKort(pid))}</text>`;
    if(pid===capt)s+=captMark(x,y);
  }
  const k=byId(keeperId);
  if(k){
    const x=50,y=my(93);
    s+=`<circle cx="${x}" cy="${y}" r="4.4" fill="#fff" stroke="#000" stroke-width="1.8"/><text x="${x}" y="${y+1.5}" text-anchor="middle" font-size="4.2" font-weight="700" fill="#000">${pNum(k.id)}</text>
    <text x="${x}" y="${y+8.4}" text-anchor="middle" font-size="3.6" font-weight="700" fill="#000">K&#160;${esc(k.name)}</text>`;
    if(k.id===capt)s+=captMark(x,y);
  }
  return s+'</svg>';
}
function printChainText(d){
  const parts=[];
  for(const ch of d.chains){
    let t=`<b>${esc(pKort(ch.inP))}</b> erin op ${POSMAP[ch.pos].kort}${ch.outP?` &middot; <b>${esc(pKort(ch.outP))}</b> eruit`:''}`;
    if(ch.moves.length)t+=`; daardoor ${ch.moves.map(m=>`${esc(pKort(m.pid))} ${POSMAP[m.from].kort}&#8594;${POSMAP[m.to].kort}`).join(', ')}`;
    parts.push(t);
  }
  for(const o of d.looseOuts)parts.push(`<b>${esc(pKort(o.pid))}</b> eruit (${POSMAP[o.pos].kort})`);
  for(const m of d.looseMoves)parts.push(`${esc(pKort(m.pid))} ${POSMAP[m.from].kort}&#8594;${POSMAP[m.to].kort}`);
  return parts.join('<br>');
}
function renderPrint(){
  const area=document.getElementById('printArea');
  if(!state.schedule){area.innerHTML='<p>Genereer eerst een opstelling.</p>';return;}
  const sch=state.schedule,perQ=sch.perQ,blockLen=17.5/perQ;
  const d=new Date(),ds=d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let cells='';
  for(let q=0;q<4;q++){
    const b0=q*perQ,asg0=sch.assignments[b0];
    const bench=benchOfBlock(sch,b0).map(pKort).map(esc).join(', ')||'—';
    let w='';
    const pRegels=kwartMomenten(q,sch).map(mo=>({minuut:mo.minuut,mo}))
      .concat(gebeurtenissen().filter(g=>g.q===q).map(g=>({minuut:g.min,g})))
      .sort((a,b)=>a.minuut-b.minuut || (a.mo?-1:1));
    for(const r of pRegels){
      w+= r.g
        ? `<div class="pw"><b>Na ${r.minuut} min:</b><br>${esc(r.g.tekst)}</div>`
        : `<div class="pw"><b>Na ${r.minuut} min:</b><br>${chainsEmpty(r.mo.wissels)?'geen wissels':printChainText(r.mo.wissels)}</div>`;
    }
    const pk=q>0?keeperOfQ(sch,q-1):null, ck=keeperOfQ(sch,q);
    const kw=(pk&&ck&&pk!==ck)?`<div class="pw"><b>Keeper:</b> ${esc(pKort(ck))} (was ${esc(pKort(pk))})</div>`:'';
    cells+=`<div class="pcell"><div class="ph">Q${q+1} <span>${q<2?'eerste':'tweede'} helft &middot; ${formOfQ(q)}</span></div>${printFieldSVG(asg0,ck,positionsOfQ(q))}${kw}<div class="pw"><b>Wissels bij start:</b> ${bench}</div>${w}</div>`;
  }
  area.innerHTML=`<div class="phead"><b>Wisselschema ${DEMO?'demoteam':'HC Gooische'}</b> &nbsp;·&nbsp; ${ds}</div><div class="pgrid${perQ>=4?' dense':''}${perQ>=5?' dense5':''}">${cells}</div>`;
}

function fitNames(){

    const tags=document.querySelectorAll('#field .chip .tag');
    tags.forEach(t=>{
      t.style.fontSize='';           // terug naar basis (15px) voor korte namen
      let px=15;

      let guard=0;
      while(t.scrollWidth>t.clientWidth && px>11 && guard<10){
        px-=0.7; t.style.fontSize=px.toFixed(1)+'px'; guard++;
      }
      // past het op de kleinste maat nóg niet, dan kapt de ellipsis netjes af

    });

let _thumbTm=null;
function updateScrollUI(){
  try{
    const v=document.getElementById('view');
    const th=document.getElementById('scrollThumb');
    const hint=document.getElementById('scrollHint');
    if(!v||!th||!hint)return;
    const zichtbaarTab=!document.body.classList.contains('timermode');
    const scrollbaar=zichtbaarTab && v.scrollHeight>v.clientHeight+12;
    const r=v.getBoundingClientRect();
    // het scrollgebied loopt door tot ONDER de menubalk; begrens de aanwijzers
    // daarom op de bovenkant van de balk, anders verdwijnen ze erachter
    const tb=document.querySelector('.tabbar');
    const balkTop=tb?tb.getBoundingClientRect().top:innerHeight;
    if(scrollbaar){
      const trackTop=r.top+6, trackH=Math.max(40,(Math.min(r.bottom,balkTop)-6)-trackTop);
      const duimH=Math.max(28, trackH*(v.clientHeight/v.scrollHeight));
      const maxScroll=v.scrollHeight-v.clientHeight;
      const y=trackTop+(trackH-duimH)*(maxScroll?v.scrollTop/maxScroll:0);
      th.style.top=Math.round(y)+'px';
      th.style.height=Math.round(duimH)+'px';
      th.classList.add('show');
    }else th.classList.remove('show');
    // pijl-hint: alleen bovenaan een scrollbare pagina, nét boven de menubalk
    if(scrollbaar && v.scrollTop<24){
      hint.style.bottom=Math.round(innerHeight-balkTop+10)+'px';
      hint.classList.add('show');
    }else hint.classList.remove('show');
  }catch(e){}
}

/* ============ Nieuwe-versie-melding ============ */
// Twee nummers met elk hun eigen taak:
//  APP_VERSION  — een oplopende teller, alleen voor de app zelf: hij bepaalt of er een
//                 nieuwe versie klaarstaat en of timer.html gelijk loopt. Moet blijven
//                 stijgen, want er wordt op groter-dan vergeleken.
//  VERSIE_LABEL — wat de gebruiker ziet: jaar.maand.volgnummer, bijvoorbeeld 26.8.1.
const APP_VERSION=174;
const VERSIE_LABEL='26.9.14';
let _updDismissed=false;
// Eenmalige bevestiging na een geslaagde update
try{
  const _seen=Number(localStorage.getItem(SLEUTEL('wisselplanner_lastver'))||0);
  if(_seen&&_seen<APP_VERSION)setTimeout(()=>toast('Bijgewerkt naar versie '+VERSIE_LABEL),900);
  localStorage.setItem(SLEUTEL('wisselplanner_lastver'),String(APP_VERSION));
}catch(e){}
// Elke minuut werd index.html opgehaald om er één versienummer uit te lezen — een
// kwart megabyte per keer, en door de unieke ?upd= elke keer een nieuwe cache-kopie.
// Over een wedstrijd liep dat op tot tientallen megabytes. Nu staat het nummer in
// version.json, een bestandje van een paar tientallen bytes.
let _versieTerugval=0;   // wanneer we voor het laatst op de oude manier keken
let versieJsonMist=false;
async function checkForUpdate(){
  if(_updDismissed||document.getElementById('updBar'))return;
  try{
    const r=await fetch('version.json?u='+Date.now(),{cache:'no-store'});
    if(r.ok){
      const d=await r.json();
      const nr=Number(d.version||0);
      if(nr>=APP_VERSION)versieJsonMist=false;   // weer gelijk of nieuwer: opnieuw melden mag
      if(nr>APP_VERSION)showUpdateBar(d.label||String(nr));
      // Staat version.json op een lager nummer dan de draaiende app, dan is dat
      // bestand vergeten bij het uploaden. Zonder deze controle merk je dat nooit:
      // er komt dan simpelweg nooit meer een updatemelding.
      else if(nr<APP_VERSION && !versieJsonMist){
        versieJsonMist=true;
        onthoudFout('version.json',new Error('staat op '+nr+', app draait op '+APP_VERSION));
      }
      return;
    }
  }catch(e){/* offline, of version.json bestaat nog niet */}
  // Terugval voor het geval version.json ontbreekt: dan toch de oude weg, maar
  // hooguit eens per half uur in plaats van elke minuut.
  if(Date.now()-_versieTerugval < 30*60*1000)return;
  _versieTerugval=Date.now();
  try{
    const r=await fetch('index.html?upd='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const t=await r.text();
    const m=t.match(/const APP_VERSION=(\d+)/);
    const lab=t.match(/const VERSIE_LABEL='([^']+)'/);
    if(m&&Number(m[1])>APP_VERSION)showUpdateBar(lab?lab[1]:String(m[1]));
  }catch(e){/* offline of file:// — stil overslaan */}
}
function showUpdateBar(v){
  const d=document.createElement('div');
  d.id='updBar';
  d.innerHTML=`<div class="txt"><b>Nieuwe versie beschikbaar (${esc(String(v))})</b>Tik op vernieuwen om de update te laden.</div>
    <button class="upd">Vernieuwen</button><button class="dis" aria-label="Sluiten">&#10005;</button>`;
  d.querySelector('.upd').onclick=applyUpdate;
  d.querySelector('.dis').onclick=()=>{_updDismissed=true;d.remove();};
  document.body.appendChild(d);
}
async function applyUpdate(){
  // Alleen de eigen caches wissen. Deze herkomst wordt gedeeld met andere
  // GitHub Pages-projecten; alles wissen zou hun offline-gegevens meenemen.
  try{
    const ks=await caches.keys();
    // Alleen de eigen reeks: 'wisselplanner-main' of 'wisselplanner-demo'. Met een
    // filter op 'wisselplanner' zou de echte app ook de cache van de demo wissen,
    // want die naam begint er ook mee.
    const eigen='wisselplanner-'+(DEMO?'demo':'main');
    await Promise.all(ks.filter(k=>k===eigen||k.startsWith(eigen+'-')||(!DEMO&&k==='wisselplanner')).map(k=>caches.delete(k)));
  }catch(e){onthoudFout('cache legen',e);}
  // Alleen de eigen service worker vernieuwen. robmun.github.io is één herkomst voor
  // al je GitHub Pages-projecten; zonder filter werk je ook die van andere apps bij.
  try{
    const regs=await navigator.serviceWorker.getRegistrations();
    const eigen=regs.filter(r=>{
      const sc=r.scope||'';
      return sc.startsWith(location.origin+location.pathname.replace(/[^/]*$/,''));
    });
    await Promise.all(eigen.map(r=>r.update()));
  }catch(e){onthoudFout('sw vernieuwen',e);}
  location.reload();
}
setTimeout(checkForUpdate,2500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkForUpdate();});
// iOS hervat de app soms zonder visibilitychange; vang ook deze signalen op,
// en check daarnaast periodiek zolang de app open staat.
window.addEventListener('pageshow',()=>checkForUpdate());
window.addEventListener('focus',()=>checkForUpdate());
setInterval(()=>{if(document.visibilityState==='visible')checkForUpdate();},60000);

/* ============ Zelftest ============
   Open index.html?zelftest=1 en de app rekent de planner honderden keren door met
   wisselende selecties en regels, en controleert of de uitkomst klopt. Bedoeld om
   na een upload in tien seconden te zien of er iets stuk is — pickBlocks is te lang
   om met het oog te overzien.
   De test draait op wegwerpteams; de eigen gegevens worden niet aangeraakt. */
function ztTeam(n,extra){
  const namen='Aad Bas Cas Dax Eef Fem Gijs Hans Ids Jan Kees Lars Mees Nout Olaf Pim Quin Ruben'.split(' ');
  const posities=['lv','sp','rv','lm','mm','rm','la','lman','vs','ra'];
  const sp=[{id:'k',name:'Keep',num:1,prefs:['keeper','',''],present:true,guest:false}];
  for(let i=0;i<n;i++)sp.push({id:'p'+i,name:namen[i%namen.length]+i,num:i+2,
    prefs:[posities[i%posities.length],posities[(i+3)%posities.length],posities[(i+6)%posities.length]],present:true,guest:false});
  return Object.assign({v:STATE_V,players:sp,keeperId:'k',rules:[],schedule:null,genHash:null},extra||{});
}
function ztControleer(st,sch,naam,fout){
  if(!sch){fout(naam+': geen schema');return;}
  const perQ=sch.perQ,B=perQ*4;
  const keeperVanQ=q=>(sch.keeperByQ&&sch.keeperByQ[q])||sch.keeperId;
  for(let b=0;b<B;b++){
    const a=sch.assignments[b]||{};
    const ids=Object.values(a), q=Math.floor(b/perQ);
    const posLijst=positionsOfQ(q,st.rules);
    if(ids.length!==new Set(ids).size)fout(naam+': speler staat twee keer op het veld in blok '+b);
    if(Object.keys(a).length!==posLijst.length)fout(naam+': blok '+b+' heeft '+Object.keys(a).length+' plekken in plaats van '+posLijst.length);
    if(ids.includes(keeperVanQ(q)))fout(naam+': de keeper staat als veldspeler in blok '+b);
    for(const pos in a){
      const p=st.players.find(x=>x.id===a[pos]);
      if(!p){fout(naam+': onbekende speler in blok '+b);continue;}
      if(!p.present)fout(naam+': afwezige speler '+p.name+' staat opgesteld');
      const lijn=POSMAP[pos]&&POSMAP[pos].line;
      if(lijn&&!linesOf(p).includes(lijn))fout(naam+': '+p.name+' staat in de '+lijn+' maar mag dat niet');
    }
  }
  // Eerlijkheid meten heeft alleen zin zonder regels die iemands speeltijd inperken:
  // een speler die Q2 en Q4 mist hoort juist minder te spelen.
  const beperkend=(st.rules||[]).some(r=>['noq','minutes','gk','rotate','endstrong'].includes(r.type));
  const m=Object.values(sch.minutes||{});
  if(!beperkend&&m.length){
    const spreiding=Math.max(...m)-Math.min(...m), blokMin=17.5/perQ;
    if(spreiding>blokMin+0.01)fout(naam+': speeltijd loopt '+spreiding.toFixed(1)+' min uiteen (max '+blokMin.toFixed(1)+')');
  }
}

  });
  test('Herplannen met regels laat het verleden staan',()=>{
    // De hoofdronde sloeg gespeelde blokken al over, maar de correctierondes voor
    // minimumminuten en 'liever niet samen' deden dat niet. Die konden een blok van
    // tien minuten geleden alsnog omgooien. Deze test dekt precies die twee.
    // Een krap minimum is nodig om de correctieronde echt aan het werk te zetten;
    // met 40 minuten is er zoveel speelruimte dat hij het verleden niet aanraakt.
    const gevallen=[
      ['minimumminuten', st=>{ st.rules.push({id:'m',type:'minutes',p1:'p3',mm:'min',min:50}); }],
      ['liever niet samen', st=>{ st.rules.push({id:'a',type:'apart',p1:'p0',p2:'p1'}); }],
      ['allebei tegelijk', st=>{ st.rules.push({id:'m',type:'minutes',p1:'p3',mm:'min',min:50},
                                               {id:'a',type:'apart',p1:'p0',p2:'p1'}); }],
      ['sterkste slot', st=>{ st.rules.push({id:'e',type:'endstrong',p1:'p2',amt:'min10'}); }]
    ];
    for(const [naam,regels] of gevallen)
    for(const aantal of [13,15,17]){
      const st=ztTeam(aantal); regels(st);
      const sch=buildSchedule(st); if(!sch){fout(naam+': geen schema');continue;}
      st.schedule=sch;
      // Herplan midden in Q3, zoals bij een blessure in de tweede helft.
      const perQ=sch.perQ, vanaf=2*perQ+1;
      const fixedBlocks={}, playedSoFar={};
      st.players.filter(p=>p.id!=='k').forEach(p=>playedSoFar[p.id]=0);
      for(let b=0;b<vanaf;b++){
        const set=new Set(Object.values(sch.assignments[b]));
        fixedBlocks[b]=set; set.forEach(id=>{if(playedSoFar[id]!=null)playedSoFar[id]++;});
      }
      const fresh=buildSchedule(st,{forcePerQ:perQ,fromBlock:vanaf,fixedBlocks,playedSoFar,
        vastAssignments:sch.assignments});
      if(!fresh){fout(naam+': herplannen leverde niets op');continue;}
      for(let b=0;b<vanaf;b++){
        if(JSON.stringify(fresh.assignments[b])!==JSON.stringify(sch.assignments[b]))
          fout(naam+': blok '+(b+1)+' is achteraf gewijzigd');
      }
      // De opstelling van gespeelde blokken wordt letterlijk overgenomen, dus daar
      // zie je een verstoorde blokverdeling niet aan. De minutentelling komt wél uit
      // die verdeling: klopt hij niet met wat er werkelijk op het veld stond, dan is
      // er in het verleden gerommeld.
      const blokMin=17.5/perQ;
      st.players.filter(p=>p.id!=='k').forEach(p=>{
        let echt=0;
        for(let b=0;b<perQ*4;b++)if(Object.values(fresh.assignments[b]).includes(p.id))echt++;
        const geteld=Math.round((fresh.minutes[p.id]||0)/blokMin);

      });
      ztControleer(st,fresh,naam+' ('+(aantal+1)+' spelers)',fout);
    }
  });
  test('Minuten worden niet naar beneden afgerond',()=>{

    for(const perQ of [2,3,4,5]){

}

/* ============ Kwart delen als afbeelding ============ */
function plainChainText(d){
  const parts=[];
  for(const ch of d.chains){
    let t=`${pKort(ch.inP)} erin op ${POSMAP[ch.pos].kort}${ch.outP?` · ${pKort(ch.outP)} eruit`:''}`;
    if(ch.moves.length)t+=`; ${ch.moves.map(m=>`${pKort(m.pid)} ${POSMAP[m.from].kort}→${POSMAP[m.to].kort}`).join(', ')}`;
    parts.push(t);
  }
  return parts;
}
function wrapText(t,max){
  const words=t.split(' '),lines=[];let cur='';
  for(const w of words){ if((cur+' '+w).trim().length>max){lines.push(cur.trim());cur=w;} else cur+=' '+w; }
  if(cur.trim())lines.push(cur.trim());
  return lines;
}
async function shareQuarterImage(q){

  const perQ=sch.perQ,b0=q*perQ,blockLen=17.5/perQ;

  const dRegels=kwartMomenten(q,sch).map(mo=>({minuut:mo.minuut,mo}))
    .concat(gebeurtenissen().filter(g=>g.q===q).map(g=>({minuut:g.min,g})))
    .sort((a,b)=>a.minuut-b.minuut || (a.mo?-1:1));
  for(const r of dRegels){

    const lines = r.g ? wrapText('• '+r.g.tekst,58)

  <text x="${W/2}" y="158" text-anchor="middle" font-size="24" fill="#7f9bc6">${esc2(new Date().toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'}))}</text>
  <rect x="${pitchX}" y="${pitchY}" width="${pitchW}" height="${pitchH}" rx="18" fill="#2f8f4e"/>
  <rect x="${pitchX+14}" y="${pitchY+14}" width="${pitchW-28}" height="${pitchH-28}" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="3"/>
  <line x1="${pitchX+14}" y1="${pitchY+pitchH*0.35}" x2="${pitchX+pitchW-14}" y2="${pitchY+pitchH*0.35}" stroke="#ffffff" stroke-opacity=".85" stroke-width="3"/>
  <path d="M ${pitchX+pitchW*0.28} ${pitchY+pitchH-14} A ${pitchW*0.22} ${pitchW*0.22} 0 0 1 ${pitchX+pitchW*0.72} ${pitchY+pitchH-14}" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="3" stroke-dasharray="10 8"/>

  for(const pos of positionsOfQ(q)){

    <rect x="${cx-92}" y="${cy+50}" width="184" height="42" rx="21" fill="#ffffff"/>

    if(pid===capt)svg+=captMarkImg(cx,cy);

      toast('Afbeelding opgeslagen als download');
    }
  }catch(e){ if(e&&e.name==='AbortError')return; toast('Afbeelding maken lukte niet'); }
}

let _tx=null,_ty=null,_tmulti=false;
document.addEventListener('touchstart',e=>{

  _tx=null;

  const order=TABS.map(t=>t.id);
  let i=order.indexOf(activeTab)+(dx<0?1:-1);

},{passive:true});

  if(e.origin!==location.origin)return;
  const _ifr=document.querySelector('#timerHost iframe');
  if(e.source!==window && (!_ifr || e.source!==_ifr.contentWindow))return;
  if(!e.data)return;
  // De timer meldt op welk kwart hij staat.
  if(e.data.ghcQuarter){
    const q=Number(e.data.ghcQuarter);
    if(q<1||q>4)return;
    const tab='q'+(q-1);
    if(isQTab(activeTab)){
      // Coach kijkt naar een opstelling: meteen meelopen.
      if(activeTab!==tab){activeTab=tab;selChip=null;render();document.getElementById('view').scrollTop=0;}
    }else{
      // Coach kijkt naar de timer of een ander tabblad: onthouden en
      // toepassen zodra hij naar een opstelling swipet. Een eigen tik op
      // Q1–Q4 gaat altijd voor.
      pendingQTab=tab;
    }
    return;
  }
  if(e.data.ghcTimerOpslagFout){
    // De timer kan zijn wedstrijdstand niet bewaren. Dezelfde melding als bij de
    // opslag van de app zelf: je verliest niets nu, maar wel bij het afsluiten.
    onthoudFout('timeropslag',new Error(e.data.ghcTimerOpslagFout));
    if(!opslagFout){ opslagFout='geblokkeerd'; render(); }
    return;
  }
  if(e.data.ghcTimerVersie!=null){
    // timer.html is een apart bestand en kan bij het uploaden vergeten worden.
    const tv=Number(e.data.ghcTimerVersie);
    timerMismatch = (tv===APP_VERSION) ? null : tv;
    render();
    return;
  }
  if(e.data.ghcKlokVraagOver){ vraagKlokOvernemen(); return; }
  if(e.data.ghcKlok){ klokPush(e.data.ghcKlok); return; }
  if(e.data.ghcStand){
    const st=e.data.ghcStand;
    // Springt de klok naar een ander kwart, dan volgt het wedstrijdtabblad weer
    // vanzelf. Een eigen keuze is bedoeld om even vooruit te kijken, niet om het
    // beeld voorgoed vast te zetten — anders sta je in Q4 nog naar Q1 te kijken.
    if(klok.q!==st.q)toonQ=null;
    klok={q:st.q,sec:st.sec,loopt:st.loopt};
    veldKlokBijwerken();
    // Niet elke seconde hertekenen, maar wel zodra het beeld niet meer klopt met de klok.
    // We vergelijken met wat er echt getekend is, niet met de vorige klokstand — zo
    // herstelt de app zichzelf ook als hij een blokwissel gemist heeft.
    beeldBijwerken();
    // De tips hangen aan de klok en niet aan het hertekenen: tijdens een wedstrijd
    // wordt er lang niet opnieuw getekend, en dan zou de uitleg nooit verschijnen.
    if(DEMO)demoTips();
    if(DEMO&&st.loopt)demoTel('timer_gestart');
    return;
  }
  if(!e.data.ghcSwipe)return;
  const order=TABS.map(t=>t.id);
  let i=order.indexOf(activeTab)+e.data.ghcSwipe;
  if(i<0||i>=order.length)return;
  let next=order[i];
  if(isQTab(next)&&pendingQTab){next=pendingQTab;pendingQTab=null;}
  activeTab=next;selChip=null;render();document.getElementById('view').scrollTop=0;
});

// ── Schudden om ongedaan te maken ──
// Zoals in Mail: even schudden en je krijgt de vraag of je de laatste actie terug wilt.
// iOS vraagt sinds versie 13 eerst toestemming voor de bewegingssensor, en dat mag
// alleen vanuit een aanraking — daarom haken we aan op de eerste tik in de app.
// Drempel: doorgerekend met echte schudwaarden. Een stevige beweging levert rond de
// 800 op, een normale hanteling van de telefoon blijft ruim onder de 300. 550 vraagt
// een duidelijk gebaar zonder dat je moet zwaaien.
const SCHUD_DREMPEL=450;
let _schudActief=false, _schudLaatst=0, _schudTeller=0, _schudVorige=null, _schudStatus='uit';
function schudGebeurtenis(e){
  const a=e.accelerationIncludingGravity||e.acceleration;
  if(!a||a.x==null)return;
  const nu=Date.now();
  if(_schudVorige){
    const dt=nu-_schudVorige.t;
    if(dt>90){
      const verschil=Math.abs(a.x-_schudVorige.x)+Math.abs(a.y-_schudVorige.y)+Math.abs(a.z-_schudVorige.z);
      const kracht=verschil/dt*1000;
      if(kracht>SCHUD_DREMPEL){
        _schudTeller++;
        if(_schudTeller>=2&&nu-_schudLaatst>2500){
          _schudLaatst=nu; _schudTeller=0;
          schudVraag();
        }
      }
      if(nu-_schudLaatst>3000&&_schudTeller>0&&dt>600)_schudTeller=0;
      _schudVorige={x:a.x,y:a.y,z:a.z,t:nu};
    }
  }else _schudVorige={x:a.x,y:a.y,z:a.z,t:nu};
}
function schudVraag(){
  if(document.querySelector('#modalHost .modal'))return;   // er staat al een venster open
  if(CLOUD.on&&CLOUD.role==='viewer')return;
  if(!canUndo()){return;}                                   // niets om terug te draaien: niet storen
  if('vibrate' in navigator)navigator.vibrate(30);
  confirmDialog({
    title:'Ongedaan maken?',
    body:'Laatste actie: '+undoLabel()+(_undoStack.length>1?' (daarna nog '+(_undoStack.length-1)+' stap'+(_undoStack.length>2?'pen':'')+' terug mogelijk)':''),
    okLabel:'Ongedaan maken',
    cancelLabel:'Laat maar',
    onOk:doUndo
  });
}
function schuddenAanzetten(vanKnop){
  if(_schudActief){ if(vanKnop)toast('Schudden staat al aan'); return; }
  const zet=()=>{ _schudActief=true; _schudStatus='aan'; window.addEventListener('devicemotion',schudGebeurtenis);
    if(vanKnop){toast('Schudden staat aan');render();} };
  try{
    if(typeof DeviceMotionEvent==='undefined'){ _schudStatus='kan niet'; if(vanKnop)toast('Dit toestel heeft geen bewegingssensor'); return; }
    if(typeof DeviceMotionEvent.requestPermission==='function'){
      // iOS vraagt toestemming, en dat mag alleen direct na een aanraking.
      DeviceMotionEvent.requestPermission()
        .then(r=>{ if(r==='granted')zet(); else {_schudStatus='geweigerd'; if(vanKnop){toast('Toestemming geweigerd');render();}} })
        .catch(e=>{ _schudStatus='geweigerd'; onthoudFout('bewegingssensor',e); if(vanKnop)render(); });
    }else zet();
  }catch(e){ _schudStatus='kan niet'; onthoudFout('bewegingssensor',e); }
}
document.addEventListener('pointerdown',function eerste(){
  document.removeEventListener('pointerdown',eerste);
  schuddenAanzetten(false);
},{once:true});

// ── Zonstand ──
function zetZon(aan){
  document.body.classList.toggle('sun',!!aan);
  try{localStorage.setItem(SLEUTEL('gw_zon'),aan?'1':'0');}catch(e){}
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',aan?'#eef2f7':'#091e48');
  // de timer heeft zijn eigen zonstand; die laten we meeschakelen
  try{
    const ifr=document.querySelector('#timerHost iframe');
    if(ifr&&ifr.contentWindow)ifr.contentWindow.postMessage({ghcZon:!!aan},location.origin);
  }catch(e){}
}
try{ if(localStorage.getItem(SLEUTEL('gw_zon'))==='1')zetZon(true); }catch(e){}
document.getElementById('sunBtn').onclick=()=>{
  const aan=!document.body.classList.contains('sun');
  zetZon(aan);
  toast(aan?'Zonstand aan — hoog contrast':'Zonstand uit');
};
