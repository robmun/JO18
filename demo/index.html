<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JO18-5">
<meta name="theme-color" content="#0a1b36">
<link rel="apple-touch-icon" sizes="180x180" href="icon-ghc-navy.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="icon-ghc-navy.png">
<link rel="icon" href="icon-ghc-navy.png">
<!-- Een echt manifest, geen tijdelijke blob-URL. Android geeft alleen een
     installatieprompt bij een volwaardig manifest met een gewone start_url. Elke
     map heeft zijn eigen bestand, zodat de demo een neutrale naam en icoon krijgt. -->
<link rel="manifest" href="manifest.webmanifest">
<title>opstelling &amp; wissels</title>
<meta name="app-version" content="174">
<style>
:root{
  --navy:#0a1b36; --navy2:#142c52; --ink:#0f2347;
  --txt:#f3f7ff; --dim:rgba(235,242,255,.62);
  --accent:#8ec2ff; --accent2:#4d8de0;
  --glass:rgba(255,255,255,.085);
  --glass-strong:rgba(255,255,255,.14);
  --stroke:rgba(255,255,255,.17);
  --green1:#2f9e5e; --green2:#26824d;
  --warn:#ffd27a; --kp:#d6512f;
  --danger:#d6512f; --danger-soft:rgba(214,81,47,.18); --danger-txt:#ffb39e;
  /* Semantische kleuren: rood=urgentie/eruit, groen=erin/aanwezig, blauw=doorschuiven/navigatie */
  --sem-in:#7be09a;        /* erin, aanwezig */
  --sem-out:#ff9d86;       /* eruit */
  --sem-move:var(--accent);/* doorschuiven binnen het veld */
  --num:#ffffff;           /* rugnummer/keeper-teken op het token (wit, niet rood) */
  --capt:#f2c94c;          /* aanvoerder: goud randje om het token */
  /* Hoekrondingen */
  --r-xs:8px; --r-sm:10px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-pill:99px;
  /* Schaduwen: één lichtbron (recht van boven), vaste sterkteladder */
  --shadow-sm:0 2px 6px rgba(4,14,32,.32);
  --shadow-md:0 6px 16px rgba(4,14,32,.38);
  --shadow-lg:0 12px 32px rgba(4,14,32,.46);
  --shadow-xl:0 20px 56px rgba(4,14,32,.55);
  --edge-light:inset 0 1px 0 rgba(255,255,255,.09);
  /* Lettergroottes */
  /* Schaal met echte stappen. Stond eerder op 11/12/13/14/16/19/15 — vier van die
     maten lagen binnen vier pixels, waardoor een kaarttitel nauwelijks boven de
     gewone tekst uitkwam en je alles moest lezen om iets te vinden. */
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-base:15px; --fs-lg:17px; --fs-xl:19px; --fs-h:18px;
  /* Afstanden */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
/* Stadion-achtergrond: vaste schermvullende laag, identiek aan de timer */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(ellipse 50% 80% at -8% 5%, rgba(255,255,255,0.22) 0%, transparent 55%),
    radial-gradient(ellipse 50% 80% at 108% 5%, rgba(255,255,255,0.18) 0%, transparent 55%),
    radial-gradient(ellipse 85% 45% at 50% -2%, rgba(140,200,255,0.50) 0%, transparent 58%),
    linear-gradient(175deg, #1a4a8e 0%, #0e2f6a 22%, #091e48 52%, #050d22 100%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 100% 45% at 50% 110%, rgba(0,0,0,0.50) 0%, transparent 65%),
    linear-gradient(rgba(255,255,255,0.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.06) 1px,transparent 1px);
  background-size:auto,40px 40px,40px 40px;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  background:#091e48;
  color:var(--txt);
  height:100vh;
  overflow:hidden;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
/* ---------- App bar ---------- */
/* De titel groeit mee, zodat de drie knoppen altijd tegen de rechterkant staan.
   Zonder dit verdeelt space-between ze over de hele breedte van een tablet. */
.appbar>div:first-child{flex:1 1 auto;min-width:0}
.appbar{
  position:sticky;top:0;z-index:40;
  padding:calc(10px + env(safe-area-inset-top)) 10px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:7px;
  background:rgba(10,27,54,.55);
  backdrop-filter:blur(22px) saturate(170%);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.appbar .logoBox{width:clamp(32px,7.5vw,50px);height:clamp(32px,7.5vw,50px);flex-shrink:0;display:grid;place-items:center}
.appbar .logoBox img{width:100%;height:100%;object-fit:contain}
/* Titel altijd op één regel: hij krimpt mee met de schermbreedte in plaats van af te breken. */
.appbar h1{font-size:clamp(13px,4.1vw,20px);font-weight:800;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.appbar h1 small{display:block;font-size:var(--fs-xs);font-weight:600;color:var(--dim);
  letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  /* krimpt mee op een smalle telefoon, zodat de titel op één regel blijft */
  width:clamp(34px,10.5vw,40px);height:clamp(34px,10.5vw,40px);flex-shrink:0;
  border-radius:var(--r-md);border:1px solid var(--stroke);
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--txt);display:flex;align-items:center;justify-content:center;font-size:17px;
}
.iconbtn:active{background:var(--glass-strong)}
.iconbtn[hidden]{display:none}
/* Scroll-aanwijzers: dun duimpje rechts + pijl-hint onderaan */
#scrollThumb{position:fixed;right:3px;width:4px;border-radius:2px;z-index:45;
  background:rgba(255,255,255,.26);opacity:0;transition:opacity .35s;pointer-events:none}
#scrollThumb.show{opacity:1}
#scrollThumb.actief{background:rgba(255,255,255,.55)}
#scrollHint{position:fixed;left:50%;transform:translateX(-50%);z-index:45;pointer-events:none;
  width:34px;height:22px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;
  background:rgba(16,42,84,.72);border:1px solid rgba(150,190,255,.35);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;transition:opacity .4s}
#scrollHint.show{opacity:1;animation:hintBob 1.6s ease-in-out infinite}
#scrollHint svg{width:14px;height:14px;stroke:rgba(214,228,255,.9)}
@keyframes hintBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(4px)}}
/* ---------- Layout ---------- */
main{
  flex:1 1 auto;min-height:0;width:100%;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior-y:none;
  padding:12px 5px calc(96px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;
}
/* ══ Tablet in liggende stand: twee kolommen naast elkaar ══
   pointer:coarse houdt desktopbrowsers erbuiten, min-height:600px houdt
   telefoons in liggende stand erbuiten (die zijn hoogstens ~430px hoog). */
@media (orientation:landscape) and (min-width:820px) and (min-height:600px) and (pointer:coarse){
  :root{ --fs-xs:12px; --fs-sm:13.5px; --fs-md:14.5px; --fs-base:15.5px; --fs-lg:17.5px; --fs-xl:21px; --fs-h:17px; }
  main{max-width:1200px;padding-left:14px;padding-right:14px}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
  .twocol>div{min-width:0}
  /* Het veld blijft in beeld terwijl je de wisselteksten ernaast doorleest.
     Het wordt zo breed als past zonder hoger te worden dan het scherm. */
  /* De klok steekt bewust buiten het veld; de kolom mag hem dus niet afkappen.
     De ruimte tussen de kolommen is 16px, dus tot zo'n 60px oversteek blijft het
     binnen de kolomruimte. */
  .twocol .col-field{position:sticky;top:0;overflow:visible}
  /* De klok ligt deels óver het veld, rechtsboven. Zo blijft het veld op volle
     breedte en dekt de klok alleen het lege stuk naast de bank af: de twee
     kolommen wisselspelers links blijven zichtbaar. */
  /* De rij is precies zo breed als het veld, anders wordt de klok uitgelijnd op de
     kolom en hangt hij ver naast het gras in plaats van net over de rand. */
  .twocol .col-field .veldrij{position:relative;width:fit-content;margin:0 auto}
  /* Breedte volgt uit de hoogte en de verhouding 100:150. Met alleen 'width:auto'
     klapte het veld in zodra de rij zich naar de inhoud voegde. */
  .twocol .col-field .fieldwrap{--veldh:min(calc(100dvh - 250px), calc((100% - 0px) * 999));
    height:calc(100dvh - 250px);width:calc((100dvh - 250px) * 100 / 150);
    max-width:100%;margin:0 auto}
  /* Maat als deel van het veld, niet van het venster: anders dekt de klok bij een
     smal veld de bank af en zweeft hij bij een breed veld in het niets. */
  /* Oversteek in procenten, maar begrensd op 44px: de ruimte tussen de kolommen is
     smal, en op een grote iPad zou 12% van het veld de wisseltekst raken. */
  .grklok{position:absolute;right:max(-12%,-44px);top:2%;z-index:4;
    width:46%;max-width:240px;min-width:104px;aspect-ratio:1;
    filter:drop-shadow(0 6px 18px rgba(4,14,32,.5))}
  /* Veel wisselspelers: de bank groeit naar een derde rij en komt dan tegen de klok
     aan. Vandaar dat hij dan meekrimpt. */
  .grklok.krap{width:34%;max-width:210px}
  .grklok .gk-schijf{fill:rgba(6,16,34,.72)}
  /* In de zonstand valt de schijf deels buiten het groen; doorschijnend donker
     wordt daar vuilgrijs op wit. Dus dekkend donkerblauw. */
  body.sun .grklok .gk-schijf{fill:#0b2148}
  body.sun .gk-baan{stroke:rgba(255,255,255,.20)}
  body.sun .gk-boog{stroke:#8ab6ff}
  .gk-baan{fill:none;stroke:rgba(255,255,255,.13);stroke-width:13}
  .gk-boog{fill:none;stroke:#7fb4ff;stroke-width:13;stroke-linecap:round;
    transition:stroke-dashoffset .4s linear,stroke .3s}
  .gk-boog.laat{stroke:#ff5a45}
  /* Rood, zodat de tijd van een afstand opvalt. De ring blijft blauw als voortgang
     en kleurt mee rood in de laatste twee minuten — alles rood betekent: bijna klaar. */
  .gk-tijd{fill:#ff6a52;font-size:44px;font-weight:800;text-anchor:middle;
    font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .gk-sub{fill:rgba(255,255,255,.72);font-size:17px;font-weight:800;text-anchor:middle;letter-spacing:1.5px}
  .gk-tot{fill:rgba(255,255,255,.62);font-size:12px;font-weight:700;text-anchor:middle}
  body.sun .gk-baan{stroke:rgba(15,32,64,.16)}
  body.sun .gk-boog{stroke:#12408f}
}
.card{
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:var(--r-xl);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:var(--shadow-lg), var(--edge-light);
  padding:16px;margin-bottom:14px;
}
.card.tight{padding:5px}
.card.tight h2{padding:6px 9px 6px;margin-bottom:2px}
.card.tight .hint{padding:2px 9px 6px}
.card h2{font-size:var(--fs-h);font-weight:800;letter-spacing:-.2px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .sub{font-weight:600;font-size:var(--fs-sm);color:var(--dim);margin-left:auto}
.hint{font-size:var(--fs-sm);color:var(--dim);line-height:1.45}
.banner.err{background:linear-gradient(135deg,rgba(255,120,100,.22),rgba(255,120,100,.09));
  border-color:rgba(255,140,120,.55);color:#ffd8cf}
body.sun .banner.err{background:#fdeae6;border-color:#b3241a;color:#7a1811}
.banner{
  background:linear-gradient(135deg,rgba(255,205,110,.16),rgba(255,205,110,.07));
  border:1px solid rgba(255,210,122,.4);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:14px;
  font-size:var(--fs-md);color:#ffe5b3;display:flex;align-items:center;gap:10px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.banner button{margin-left:auto;flex-shrink:0}
/* Iconen in knoppen en koppen: op de basislijn, met vaste tussenruimte */
.ico{flex-shrink:0;vertical-align:-3px;margin-right:7px}
.btn .ico{margin-right:8px}
h2 .ico{vertical-align:-3px;margin-right:7px}
.btn{
  border:none;border-radius:var(--r-md);padding:11px 16px;font-size:var(--fs-base);font-weight:700;
  background:linear-gradient(135deg,#5b95e6,#3b6fc4);color:#fff;
  box-shadow:0 4px 14px rgba(60,110,200,.4);
}
.btn{transition:transform .13s cubic-bezier(.34,1.56,.64,1), filter .13s ease}
.btn:active{transform:scale(.96)}
.iconbtn{transition:transform .13s cubic-bezier(.34,1.56,.64,1)}
.iconbtn:active{transform:scale(.90)}
.tab{transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.tab:active{transform:scale(.93)}
/* Drie soorten knoppen. Ze zagen er alle drie hetzelfde uit, terwijl de een een
   vangnet is, de ander je hele wedstrijd weggooit en de derde een wedstrijdactie is.
   Gevuld = de meest waarschijnlijke actie, doorzichtig = de rest,
   rood omlijnd = alles wat iets weggooit. */
.btn.ghost{background:var(--glass);border:1px solid var(--stroke);box-shadow:none;color:var(--txt)}
.btn.gevaar{background:transparent;border:1.5px solid rgba(255,140,120,.55);color:#ffb3a3;box-shadow:none}
.btn.gevaar:active{background:rgba(255,120,100,.14)}
body.sun .btn.gevaar{border-color:#b3241a;color:#a01a10;background:#fff}
.btn.small{padding:8px 12px;font-size:var(--fs-md);border-radius:var(--r-md)}
.btn.full{width:100%}
.btn.danger{background:rgba(214,81,47,.18);border:1px solid rgba(214,81,47,.5);color:#ffb39e;box-shadow:none}
/* ---------- Tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:space-around;align-items:stretch;
  padding:4px 8px calc(4px + env(safe-area-inset-bottom));
  background:rgba(12,26,50,.62);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.10);
}
.tab{
  flex:1;border:none;background:none;color:var(--dim);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:var(--fs-xs);font-weight:700;padding:3px 2px;border-radius:var(--r-md);
}
.tab .q{width:38px;height:38px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:var(--fs-h);font-weight:800;border:1.5px solid rgba(255,255,255,.25)}
.tab svg{width:22px;height:22px;margin:1px 0}
.tab.active{color:#fff}
.tab.active .q{background:linear-gradient(135deg,#5b95e6,#3b6fc4);border-color:transparent;box-shadow:0 3px 10px rgba(70,120,210,.5)}
/* ── Accordeon op het uitlegtabblad ── */
.acc{display:flex;flex-direction:column;gap:8px}
.accitem{border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);overflow:hidden}
.accitem.open{background:rgba(255,255,255,.08)}
.acchead{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px;background:none;border:0;color:var(--txt);font-size:15px;font-weight:700;text-align:left}
.acchead i{font-style:normal;font-size:20px;font-weight:400;color:var(--dim);line-height:1}
.accbody{padding:0 16px 14px;color:var(--dim);font-size:14px;line-height:1.55}
.accbody b{color:var(--txt)}
body.sun .accitem{background:#f4f7fc;border-color:#c9d6ea}
body.sun .accitem.open{background:#eaf1fb}

/* ── Kwartbolletjes in het wedstrijdtabblad ──
   Blijven bovenin staan bij het schuiven: tijdens een wedstrijd wil je van kwart
   kunnen wisselen zonder eerst helemaal naar boven te scrollen. 'sticky' plakt aan
   de bovenkant van het schuifgebied, net onder de kopbalk. */
.qbar{position:sticky;top:-13px;z-index:30;display:flex;gap:8px;
  margin:-12px -5px 10px;padding:8px 5px 7px;
  background:rgba(10,27,54,.72);backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border-bottom:1px solid rgba(255,255,255,.08)}
body.sun .qbar{background:rgba(238,243,251,.88);border-bottom-color:#c9d6ea}
.qgroep{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:5px 6px;border-radius:12px;background:var(--card);border:1px solid var(--stroke)}
.qduo{display:flex;gap:7px}
.qpill{width:34px;height:34px;border-radius:50%;border:1px solid var(--stroke);
  background:rgba(255,255,255,.06);color:var(--dim);font-size:12.5px;font-weight:800;
  letter-spacing:.3px;display:grid;place-items:center;transition:transform .12s ease}
.qpill:active{transform:scale(.94)}
.qpill.active{background:#fff;color:#12408f;border-color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.qpill.loopt::after{content:'';position:absolute;margin:22px 0 0 22px;width:7px;height:7px;
  border-radius:50%;background:#3ddc7f;box-shadow:0 0 6px #3ddc7f}
.qbar .qlbl{font-size:8px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  color:var(--dim);line-height:1.2;white-space:normal;text-align:left;flex:0 1 auto}
.qpill{position:relative}
body.sun .qgroep{background:#fff;border-color:#c9d6ea}
body.sun .qpill{background:#eef3fb;color:#4a5568;border-color:#c9d6ea}
body.sun .qpill.active{background:#12408f;color:#fff;border-color:#12408f}
.qhalf{flex:2;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;position:relative;min-width:0}
.qhalf::before{content:'';position:absolute;inset:2px 3px;border:1px solid rgba(150,190,255,.20);border-radius:var(--r-md);pointer-events:none}
.qhalf.hasactive::before{border-color:rgba(150,190,255,.42)}
.qpair{display:flex;gap:10px}
.tab.qtab{flex:0 0 auto;padding:0;gap:0}
.qlbl{font-size:9px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.qhalf.hasactive .qlbl{color:#fff}
/* ══ ZONSTAND: maximaal contrast in fel zonlicht ══
   Alleen kleuren en contrast veranderen; de indeling blijft precies gelijk. */
body.sun{--txt:#0b1626;--dim:#33507e;
  --glass:#ffffff;--glass-strong:#ffffff;--stroke:rgba(15,32,64,.28);
  --accent:#12408f;--accent2:#0d306e;
  background:#eef2f7;color:#0b1626}
body.sun::before,body.sun::after{display:none !important}
body.sun .appbar{background:#ffffff;border-bottom:1px solid rgba(15,32,64,.18);box-shadow:0 2px 10px rgba(15,32,64,.10)}
body.sun .appbar h1{color:#0b1626}
body.sun .appbar h1 small{color:#33507e}
body.sun .iconbtn{background:#10203c;color:#fff;border:1px solid #10203c}
body.sun .card{background:#ffffff;border:1px solid rgba(15,32,64,.20);box-shadow:0 2px 10px rgba(15,32,64,.10);backdrop-filter:none}
body.sun .card h2{color:#0b1626}
body.sun .card h2 .sub{color:#33507e}
body.sun .hint,body.sun .empty{color:#33507e}
body.sun .btn{background:#12408f;color:#fff;box-shadow:none}
body.sun .btn.ghost{background:#ffffff;border:1px solid rgba(15,32,64,.35);color:#10203c}
body.sun .sel,body.sun .idrow input{background:#ffffff;color:#0b1626;border-color:rgba(15,32,64,.35)}
body.sun .rule{background:#ffffff;border-color:rgba(15,32,64,.22);color:#0b1626}
body.sun .pname b{color:#0b1626}
body.sun .num{background:#ffffff;border:1px solid rgba(15,32,64,.30);color:#0b1626}
body.sun .brow{background:rgba(15,32,64,.06)}
body.sun .wmoment .wtime{color:#0b1626}
/* Wisseltekst: 'erin' donkergroen, 'eruit' donkerrood, doorschuiven donkerblauw.
   Wit-op-wit is in de zon onleesbaar, dus alle witte tekst wordt hier donker. */
body.sun{--sem-in:#0a7a3c;--sem-out:#b3241a}
body.sun .wline .arr.mv,body.sun .wline .pl-mv{color:#0d306e}
body.sun .wline .posname{color:#22344f}
body.sun .wbench{color:#33507e}
body.sun .wmoment + .wmoment{border-top-color:rgba(15,32,64,.16)}
body.sun .warnbox{background:#fff6e0;border-color:#c98a00;color:#5c3d00}
body.sun .banner{background:#fff6e0;border-color:#c98a00;color:#5c3d00}
body.sun .modal{background:#ffffff;color:#0b1626;border:1px solid rgba(15,32,64,.25)}
body.sun .modal-back{background:rgba(10,20,40,.45)}
body.sun #toast{background:#10203c;color:#fff}
/* Zonstand: aanwezig moet zichtbaar blijven maar rustig, afwezig springt eruit.
   Zonder de eerste regel werd het schuifje wit-op-wit en verdween het helemaal. */
body.sun .sw i{background:#e7ecf5;border-color:rgba(15,32,64,.32)}
body.sun .sw i:after{color:rgba(15,32,64,.75)}
body.sun .sw input:checked + i{background:#e7ecf5;border-color:rgba(15,32,64,.32)}
body.sun .sw input:checked + i:after{color:rgba(15,32,64,.75)}
body.sun .sw input:not(:checked) + i{background:linear-gradient(135deg,#e5a63a,#c17f12);border-color:#a06a0e}
body.sun .sw input:not(:checked) + i:after{color:#fff}
body.sun .dim-row .pname b{text-decoration-color:#b3781a}
body.sun .rule .del{background:#fdeae6;color:#a01a10;border:1px solid rgba(179,36,26,.45)}
body.sun .chip .tag .k{color:#b3241a}
/* De tabbalk is het belangrijkst: hoog contrast, geen glas */
body.sun .tabbar{background:#10203c;border-top:1px solid #10203c;backdrop-filter:none;-webkit-backdrop-filter:none}
body.sun .tab{color:rgba(255,255,255,.72)}
body.sun .tab.active{color:#fff}
body.sun .tab .q{border-color:rgba(255,255,255,.55);color:#fff}
body.sun .tab.active .q{background:#ffffff;color:#0b1626;border-color:#ffffff;box-shadow:none}
body.sun .qhalf::before{border-color:rgba(255,255,255,.30)}
body.sun .qhalf.hasactive::before{border-color:rgba(255,255,255,.70)}
body.sun .qlbl{color:rgba(255,255,255,.72)}
body.sun .qhalf.hasactive .qlbl{color:#fff}
/* Veld: verzadigder groen en dikkere witte lijnen */
body.sun .fieldwrap{border-color:rgba(15,32,64,.45);--green1:#1f8046;--green2:#176437}
body.sun .fieldwrap svg [stroke]{stroke-opacity:1}
body.sun .brow{background:rgba(6,20,12,.55)}
body.sun .tag{background:#ffffff;color:#0b1626;box-shadow:0 2px 6px rgba(15,32,64,.35)}
body.sun .ball{box-shadow:0 3px 8px rgba(15,32,64,.45)}
body.sun .veldklok{border-color:#fff}
/* ---------- Spelers ---------- */
/* Speler-blok: omrandt ingeklapte rij + paneel als één geheel wanneer open */
.pcard{border:1px solid transparent;border-radius:var(--r-md);transition:border-color .18s ease, background .18s ease;margin:0 -4px}
.pcard.open{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.04);padding:0 6px;box-shadow:var(--shadow-sm)}
.prow{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid rgba(255,255,255,.08)}
.pcard.open .prow{border-bottom:1px solid rgba(255,255,255,.14)}
.prow:last-child{border-bottom:none}
.sw{position:relative;width:76px;height:28px;flex-shrink:0}
.sw input{opacity:0;width:100%;height:100%;position:absolute;z-index:2}
.sw i{position:absolute;inset:0;border-radius:var(--r-pill);background:rgba(255,255,255,.16);transition:.18s;border:1px solid rgba(255,255,255,.14)}
.sw i:before{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.18s;box-shadow:var(--shadow-sm)}
/* Aanwezig was fel groen: zestien schreeuwende pillen voor de nórmale toestand.
   Nu rustig; afwezig krijgt amber, want dat is wat je zoekt. */
.sw input:checked + i{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.30)}
.sw input:not(:checked) + i{background:linear-gradient(135deg,#d2952f,#9c6a16);border-color:rgba(255,225,170,.5)}
.sw input:checked + i:before{left:calc(100% - 24px)}
/* Woordje in het schuifje, aan de kant waar de knop niet staat */
.sw i:after{position:absolute;top:0;line-height:28px;font-size:8.5px;font-weight:700;
  letter-spacing:0;white-space:nowrap;pointer-events:none;transition:.18s;
  content:attr(data-off);right:8px;color:rgba(255,255,255,.62)}
.sw input:checked + i:after{content:attr(data-on);right:auto;left:8px;color:#fff}
.sw.wide{width:86px}
/* .editpane label heeft flex:1; het schuifje mag niet meerekken */
.captrow .sw{flex:0 0 auto}
.num{
  width:42px;height:40px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-weight:800;font-size:var(--fs-h);flex-shrink:0;
  background:rgba(255,255,255,.07);border:1px solid var(--stroke);border-radius:var(--r-sm);
  color:var(--txt);
}
.num.leeg{color:var(--dim);font-weight:600}
.num.dupe{border-color:#e8a24a;color:#ffcf94}
/* Bewerkvelden in het uitklappaneel */
.editpane .idrow{display:flex;gap:8px;margin-top:2px;margin-bottom:2px}
.editpane .idrow label.numlbl{flex:0 0 74px}
.editpane .idrow input{width:100%;background:rgba(255,255,255,.10);border:1px solid var(--stroke);
  border-radius:var(--r-sm);color:var(--txt);font-size:var(--fs-base);font-weight:700;padding:8px 9px;margin-top:3px}
.editpane .idrow input.dupe{border-color:#e8a24a}
.pname{flex:1;min-width:0}
.pname b{font-size:var(--fs-h);display:block}
/* De voorkeursposities stonden op 11px in gedempt grijs, alsof het een voetnoot was —
   terwijl je er juist naar kijkt als je de opstelling controleert. */
.pname span{font-size:var(--fs-md);color:var(--dim);display:block;margin-top:3px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname input{width:100%;background:rgba(255,255,255,.10);border:1px solid var(--stroke);border-radius:var(--r-sm);color:var(--txt);font-size:var(--fs-h);font-weight:700;padding:7px 9px}
.chev{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.28);color:var(--txt);
  width:46px;height:46px;border-radius:var(--r-sm);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;line-height:1;
  transition:transform .13s cubic-bezier(.34,1.56,.64,1), background .15s ease}
.chev:active{transform:scale(.90)}
.chev svg{width:20px;height:20px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pcard.open .chev[data-act="expand"]{background:var(--accent);border-color:var(--accent);color:#fff}
.editpane{padding:4px 2px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
.editpane .frow{display:flex;gap:8px;margin-top:8px}
.editpane label{flex:1;font-size:var(--fs-xs);color:var(--dim);font-weight:700}
select,option{font-size:var(--fs-base)}
.sel{
  width:100%;margin-top:4px;appearance:none;-webkit-appearance:none;
  background:rgba(255,255,255,.10) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M1 1l4 4 4-4" stroke="white" stroke-opacity=".6" fill="none" stroke-width="1.5"/></svg>') no-repeat right 10px center;
  border:1px solid var(--stroke);border-radius:var(--r-sm);color:var(--txt);padding:9px 26px 9px 10px;font-weight:600;
}
/* Aanwezig is de normale toestand en hoort niet te schreeuwen; afwezig is de
   uitzondering waar je zaterdagochtend naar zoekt. Vandaar deze omkering:
   het schuifje was fel groen bij aanwezig, nu is het rustig, en afwezig valt op. */
.dim-row{opacity:.55}
.dim-row .pname b{text-decoration:line-through;text-decoration-thickness:1.5px;
  text-decoration-color:rgba(255,190,120,.85)}
.sel.lockedalt,.sel:disabled{opacity:.4;cursor:not-allowed}
.num.dupe{border-color:rgba(255,140,90,.85);background:rgba(255,120,70,.16)}
/* ---------- Regels ---------- */
.frow{display:grid;grid-template-columns:minmax(72px,max-content) 1fr;align-items:center;column-gap:10px;margin-bottom:7px}
.frow>.hint{margin:0;line-height:1.25}
.frow>.sel{margin-top:0;margin-bottom:0;min-width:0}
.rule{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-sm);padding:5px 6px 5px 11px;margin-bottom:5px;font-size:var(--fs-base);line-height:1.3}
.rule .del{margin-left:auto;flex-shrink:0;width:32px;height:30px;border-radius:var(--r-sm);border:none;background:rgba(214,81,47,.18);color:#ffb39e;font-size:var(--fs-base);font-weight:700;padding:0;display:flex;align-items:center;justify-content:center}
/* ---------- Veld ---------- */
.fieldwrap{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid rgba(255,255,255,.2);
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 9.5%, rgba(0,0,0,.02) 9.5% 19%),
    linear-gradient(180deg,var(--green1),var(--green2));
  box-shadow:inset 0 0 40px rgba(0,40,15,.25);
  aspect-ratio:100/150;
}
.fieldwrap svg.lines{position:absolute;inset:0;width:100%;height:100%}
/* Wedstrijdklok op het veld, rechtsboven — goed leesbaar in de zon */
/* Zelfde vormgeving als de speler-bolletjes: blauw verloop, witte rand, witte tekst */
.veldklok{position:absolute;right:3.5%;top:2%;z-index:3;display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(circle at 32% 26%, #35619f 0%, #1c3b6e 46%, #0d2144 100%);
  border:2px solid rgba(255,255,255,.95);border-radius:14px;padding:5px 11px 4px;
  box-shadow:inset 0 2px 3px rgba(255,255,255,.30), inset 0 -4px 6px rgba(0,0,0,.32),
             0 5px 8px rgba(4,14,32,.42)}
.veldklok .vk-tijd{font-size:22px;font-weight:800;letter-spacing:.5px;line-height:1.05;
  font-variant-numeric:tabular-nums;color:#ff6a52}
.veldklok .vk-sub{font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  color:rgba(255,255,255,.78);margin-top:1px}
.zwklok{position:fixed;right:14px;z-index:35;display:none;align-items:baseline;gap:8px;
  background:rgba(6,16,34,.88);border:1.5px solid rgba(255,255,255,.22);border-radius:12px;
  padding:5px 12px;box-shadow:0 6px 16px rgba(4,14,32,.45);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none}
.zwklok.toon{display:flex}
.zwklok .zw-tijd{font-size:21px;font-weight:800;letter-spacing:.5px;
  font-variant-numeric:tabular-nums;color:#ff6a52}
.zwklok .zw-sub{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  color:rgba(255,255,255,.7)}
.zwklok.pauze .zw-tijd{color:rgba(255,106,82,.72)}
body.sun .zwklok{background:#0b2148;border-color:#0b2148}
.veldklok.pauze{opacity:.82}
.veldklok.pauze .vk-tijd{color:rgba(255,106,82,.72)}
/* Spelers die even niet inzetbaar zijn: rechtsboven op het veld, aantikbaar om terug te halen */
/* Kaarten in hun eigen kleur, zoals een blessure rood is. De aftelling staat achter
   de naam zodat je vanaf de bank ziet wanneer hij weer mag meedoen. */
/* Fel genoeg om op het gras op te vallen: een gedempt groen zou wegvallen tegen
   het veld en tegen de gewone bankrijen, die ook groenig zijn. */
.brow.kaart.groen{background:rgba(38,190,92,.92);border:1.5px solid rgba(255,255,255,.85)}
.brow.kaart.groen .bball{background:linear-gradient(160deg,#0f7a35,#0a5525);border-color:rgba(255,255,255,.9)}
.brow.kaart.groen span,.brow.kaart.groen .ktel{color:#08300f}
.brow.kaart.geel{background:rgba(245,205,45,.94);border:1.5px solid rgba(255,255,255,.85)}
.brow.kaart.geel .bball{background:linear-gradient(160deg,#9a7a12,#5f4a08);border-color:rgba(255,255,255,.9)}
.brow.kaart.geel span,.brow.kaart.geel .ktel{color:#3a2c00}
/* Open plek op het veld zolang een kaart loopt: het team speelt met een man minder. */
.chip.kaartleeg .ball{background:none;border-style:dashed;border-width:2px;font-size:var(--fs-sm);font-weight:800}
.chip.kaartleeg.groen .ball{border-color:#2fae55;color:#8ff0b0}
.chip.kaartleeg.geel .ball{border-color:#f0c419;color:#ffe89a}
.chip.kaartleeg .tag{font-variant-numeric:tabular-nums}
.chip.kaartleeg.groen .tag{background:#1f7a3d;color:#fff}
.chip.kaartleeg.geel .tag{background:#9a7a12;color:#fff}
.brow.kaart{padding-left:10px}
.benchlist .brow.kaart span{font-size:var(--fs-xs)}
.brow .ktel{margin-left:auto;padding-left:8px;font-variant-numeric:tabular-nums;
  font-size:var(--fs-xs);font-weight:800;flex-shrink:0}
body.sun .brow.kaart.groen{background:#e4f6e9;border-color:#1f7a3d}
body.sun .brow.kaart.groen span,body.sun .brow.kaart.groen .ktel{color:#12572a}
body.sun .brow.kaart.geel{background:#fdf3d8;border-color:#9a7a12}
body.sun .brow.kaart.geel span,body.sun .brow.kaart.geel .ktel{color:#6b5208}
/* Kleurvlakje in het keuzevenster */
.kaartvlak{display:inline-block;width:13px;height:17px;border-radius:2px;margin-right:9px;
  vertical-align:-3px;border:1px solid rgba(0,0,0,.35)}
.kaartvlak.groen{background:#2fae55}
.kaartvlak.geel{background:#f0c419}
.brow.uit{background:rgba(150,30,20,.55);border:1px solid rgba(255,160,140,.5)}
.brow.uit .bball{background:linear-gradient(160deg,#8e2b20,#5e1a12)}
body.sun .brow.uit{background:#fdeae6;border-color:#b3241a}
body.sun .brow.uit span{color:#7a1811}
.benchlabel{position:absolute;left:3.5%;top:2%;font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.78);text-shadow:0 1px 3px rgba(0,0,0,.35);z-index:1}
/* De klok hangt rechtsboven op het veld; de bank mag daar niet onderdoor lopen.
   Op de smalle stand is dat de kleine klok, in de brede stand de grote ronde. */
/* Twee kolommen, allebei links van de klok die rechtsboven op het veld staat.
   Compacte rijen, want alle wisselspelers moeten er altijd op passen. */
.benchlist{position:absolute;left:3.5%;top:5%;right:34%;z-index:3;display:flex;align-items:flex-start;gap:6px;max-height:46%}
.benchlist .brow{padding:3px 8px 3px 3px;gap:6px}
.benchlist .brow span{font-size:var(--fs-sm)}
.benchlist .brow .bball{width:25px;height:25px;font-size:10px}
/* Naast de grote klok houdt de bank afstand, zodat namen er nooit onder verdwijnen.
   De klok beslaat 42% van de veldbreedte plus wat hij uitsteekt. */
/* Alleen de wisselspelers krijgen in de brede stand een kleinere letter en een
   compacter balletje: naast de grote klok is de ruimte smal en werden namen als
   'Boudewijn' afgekapt. De veldspelers en de klok blijven ongemoeid. */
.twocol .col-field .benchlist .brow{gap:6px;padding:3px 9px 3px 3px}
.twocol .col-field .benchlist .brow span{font-size:var(--fs-md)}
.twocol .col-field .benchlist .brow .bball{width:27px;height:27px;font-size:var(--fs-xs)}
/* Naast de grote klok is de kolom smal; de aftelling krijgt daar minder gewicht
   zodat een naam als 'Boudewijn' er nog naast past. */
.twocol .col-field .benchlist .brow .ktel{margin-left:4px;font-size:var(--fs-xs)}
.twocol .col-field .benchlist{right:38%;padding-right:4px}
.twocol .col-field .veldrij:has(.grklok.krap) .benchlist{right:24%}
/* Smallere liggende tablet (9,7 inch): daar is het veld zo'n 45 pixels smaller en
   past 'Boudewijn' pas een maatje kleiner. */
@media (orientation:landscape) and (max-width:1100px){
  .twocol .col-field .benchlist .brow span{font-size:var(--fs-sm)}
  .twocol .col-field .benchlist .brow{gap:5px;padding:3px 7px 3px 3px}
  .twocol .col-field .benchlist .brow .bball{width:24px;height:24px}
}
/* Beide kolommen even breed. Zonder dit voegde elke kolom zich naar zijn inhoud,
   waardoor de kolom met een aftelling erin breder werd dan de andere. */
.benchcol{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 0}
.brow.meer{justify-content:center;font-weight:800;color:rgba(255,255,255,.8);padding:6px 12px}
.brow{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:var(--r-pill);background:rgba(11,24,48,.58);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.brow .bball{width:32px;height:32px;border-radius:50%;background:linear-gradient(160deg,#21437e,#0e2247);border:1.5px solid rgba(255,255,255,.7);color:#fff;font-weight:800;font-size:var(--fs-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brow .bball.capt{border-color:var(--capt);box-shadow:0 0 0 1.5px rgba(242,201,76,.30)}
.brow span{font-size:var(--fs-base);font-weight:700;color:#eef4ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow.selected{outline:2.5px solid var(--accent);outline-offset:1px}
.brow:active{transform:scale(.96)}
/* Speler-token: bal en naam als één geheel — één lichtbron, één silhouet-schaduw */
.chip{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:0;z-index:2;width:92px;
  filter:drop-shadow(0 5px 8px rgba(4,14,32,.42));
  transition:filter .18s ease, transform .18s ease}
.chip .ball.keeperball{padding:0}
.chip .ball{
  width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 32% 26%, #35619f 0%, #1c3b6e 46%, #0d2144 100%);
  border:2px solid rgba(255,255,255,.95);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  box-shadow:inset 0 2px 3px rgba(255,255,255,.30), inset 0 -4px 6px rgba(0,0,0,.32);
  position:relative;z-index:2;
}
.chip .ball .bk{color:var(--num);font-weight:900;font-size:var(--fs-base);letter-spacing:.2px}
.chip .ball .bk.long{font-size:var(--fs-xs);letter-spacing:0}
.chip .ball.keeperball .bk{display:none}
.chip .tag{background:linear-gradient(180deg,#ffffff 0%,#edf1f7 100%);color:var(--ink);font-size:var(--fs-h);font-weight:600;letter-spacing:-.25px;
  margin-top:-7px;padding:8px 7px 3px;border-radius:var(--r-sm);
  border:1px solid rgba(13,33,68,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
  max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1;line-height:1.05}
.chip .tag .k{color:var(--sem-out);font-weight:900;margin-right:3px}
.chip .pos{font-size:7.5px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.5px;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.chip.selected{filter:drop-shadow(0 10px 14px rgba(4,14,32,.55));transform:translate(-50%,-50%) scale(1.06)}
/* Aanvoerder: goud randje om het token plus een klein gouden A-schildje */
.chip .ball.capt{border-color:var(--capt);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.30), inset 0 -4px 6px rgba(0,0,0,.32), 0 0 0 2px rgba(242,201,76,.28)}
.chip .ball .cbadge{position:absolute;top:-7px;right:-8px;width:15px;height:15px;border-radius:50%;
  background:linear-gradient(160deg,#ffe28c,#d6a01f);color:#2b1c00;font-size:9.5px;font-weight:900;line-height:1;
  display:flex;align-items:center;justify-content:center;border:1.5px solid #fff6dd;
  box-shadow:0 1px 2px rgba(4,14,32,.45);z-index:3}
/* Bank: zelfde teken, iets kleiner, tegen het balletje aan */
.brow .bball{position:relative}
.brow .bball .cbadge{position:absolute;top:-5px;right:-6px;width:13px;height:13px;border-radius:50%;
  background:linear-gradient(160deg,#ffe28c,#d6a01f);color:#2b1c00;font-size:8.5px;font-weight:900;line-height:1;
  display:flex;align-items:center;justify-content:center;border:1.5px solid #fff6dd;
  box-shadow:0 1px 2px rgba(4,14,32,.45)}
.captrow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
/* Linies waarin een speler mag spelen: label met de drie vakjes erachter.
   Op een smalle telefoon zakken de vakjes vanzelf naar de regel eronder.
   De aanvoerder-schuif staat daar weer onder, op zijn eigen breedte. */
.linerow{margin-top:10px}
.lnhead{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.linerow .lnlbl{font-size:var(--fs-xs);color:var(--dim);font-weight:700;flex-shrink:0;white-space:nowrap}
.lnpick{display:flex;gap:6px;flex:1 1 210px;min-width:0}
.captrow2{display:flex;align-items:center;gap:8px;margin-top:8px}
/* .editpane label heeft flex:1; de schuif mag niet meerekken */
.linerow .sw,.captrow2 .sw{flex:0 0 auto}
.lnpick label{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r-sm);
  padding:7px 4px;font-size:var(--fs-xs);font-weight:700;color:var(--dim);min-width:0}
.lnpick label.on{background:rgba(123,224,154,.16);border-color:rgba(123,224,154,.55);color:#d7ffe4}
.lnpick input{width:15px;height:15px;flex-shrink:0;accent-color:#2f9e5e}
.lnpick label span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.sun .lnpick label{background:#fff;border-color:rgba(15,32,64,.30);color:#33507e}
body.sun .lnpick label.on{background:#e3f7ea;border-color:#0a7a3c;color:#07542a}
body.sun .linerow .lnlbl{color:#33507e}
.captrow span{font-size:var(--fs-sm);color:var(--dim);font-weight:600}
.captbadge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 2px;
  border-radius:4px;background:linear-gradient(160deg,#ffe28c,#d6a01f);color:#2b1c00;font-weight:900;
  font-size:var(--fs-xs);line-height:1;vertical-align:-2px;margin-left:6px}
/* In de spelerslijst zou de algemene .pname span-regel het schildje over de volle
   breedte uitrekken; hier houden we het klein en inline achter de voornaam. */
.pname b .captbadge{display:inline-flex;width:auto;min-width:16px;height:15px;margin:0 0 0 5px;
  font-size:9.5px;vertical-align:1px;overflow:visible;white-space:nowrap}
.chip.selected .ball{outline:3px solid var(--accent);outline-offset:2px}
.chip:active .ball{transform:scale(.93)}
.kbadge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:var(--r-xs);background:linear-gradient(135deg,#e2653f,#b03e1f);color:#fff;font-weight:800;font-size:var(--fs-xs);vertical-align:-3px}
/* ---------- Beginscherm-banner ---------- */
#a2hs[hidden]{display:none !important}
#a2hs{
  position:fixed;left:12px;right:12px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:60;
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:rgba(16,34,66,.88);border:1px solid rgba(255,255,255,.2);border-radius:var(--r-lg);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:var(--shadow-lg), var(--edge-light);
}
#a2hs img{width:46px;height:46px;border-radius:var(--r-md);flex-shrink:0;border:1px solid rgba(255,255,255,.25)}
#a2hs .txt{flex:1;min-width:0;font-size:var(--fs-sm);line-height:1.45;color:var(--dim)}
#a2hs .txt b{display:block;font-size:var(--fs-base);color:var(--txt);margin-bottom:1px}
#a2hs .txt svg{width:13px;height:13px;vertical-align:-2px;margin:0 1px}
#a2hs button{flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--stroke);background:rgba(255,255,255,.10);color:var(--txt);font-size:var(--fs-base)}
/* In de demo is dit het belangrijkste bericht op het scherm: zonder de app op het
   beginscherm blijft het 'een website'. Daarom gevuld in de accentkleur in plaats
   van doorzichtig — opvallend, maar niet rood: die kleur betekent in deze app dat
   er iets mis is (opslagfout, beschadigd schema, blessure). */
#a2hs.opvallend{
  background:linear-gradient(180deg,#3d7fd8,#2b5fae);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 10px 30px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.35);
  animation:a2hsIn .45s ease-out both;
}
#a2hs.opvallend .txt{color:rgba(255,255,255,.92)}
#a2hs.opvallend .txt b{color:#fff}
#a2hs.opvallend img{border-color:rgba(255,255,255,.75)}
#a2hs.opvallend button{background:rgba(255,255,255,.20);border-color:rgba(255,255,255,.55);color:#fff}
@keyframes a2hsIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
body.sun #a2hs.opvallend{background:linear-gradient(180deg,#1b4fa8,#12408f);border-color:rgba(255,255,255,.5)}
#updBar{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:60;
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-lg);
  background:rgba(16,42,84,.97);border:1px solid var(--accent2);box-shadow:var(--shadow-lg), var(--edge-light);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#updBar .txt{flex:1;min-width:0;font-size:var(--fs-sm);line-height:1.4;color:var(--dim)}
#updBar .txt b{display:block;font-size:var(--fs-base);color:var(--txt)}
#updBar .upd{flex-shrink:0;border:none;border-radius:var(--r-pill);padding:9px 14px;font-weight:800;font-size:var(--fs-sm);
  background:linear-gradient(160deg,var(--accent2),#2c66b8);color:#fff}
#updBar .dis{flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--stroke);background:rgba(255,255,255,.10);color:var(--txt);font-size:var(--fs-base)}
body.with-a2hs main{padding-bottom:calc(230px + env(safe-area-inset-bottom))}
/* ---------- Wissels ---------- */
.wmoment{margin-bottom:4px}
.wmoment + .wmoment{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.10)}
.wtime{font-size:var(--fs-sm);font-weight:800;color:var(--accent);letter-spacing:.4px;text-transform:uppercase;margin-bottom:7px}
.wline{display:flex;align-items:baseline;gap:8px;font-size:var(--fs-base);padding:4px 0;line-height:1.32}
.wline .arr{font-weight:800;flex-shrink:0;width:16px;text-align:center}
.wline .arr.in{color:var(--sem-in)}.wline .arr.out{color:var(--sem-out)}.wline .arr.mv{color:#ffffff}
.wline .pl-in{color:var(--sem-in)}
.wline .pl-out{color:var(--sem-out)}
.wline .pl-mv{color:#ffffff;font-weight:800}
/* Positienaam onderscheidt zich op kleur, niet op grootte: met de ruimere
   letterschaal viel hij anders weg midden in dezelfde zin. */
.wline .posname{color:var(--dim);font-size:inherit}
.wbench{margin-top:7px;font-size:var(--fs-sm);color:var(--dim)}
/* Wat er tussen de geplande momenten door gebeurde: valt op zonder te schreeuwen. */
.wmoment.gebeurtenis .wtime{color:#ffb3a3}
.wgeb{display:flex;align-items:flex-start;font-size:var(--fs-base);line-height:1.32;
  color:var(--txt);background:rgba(255,120,100,.10);border-left:2.5px solid rgba(255,140,120,.6);
  border-radius:var(--r-sm);padding:8px 10px}
body.sun .wmoment.gebeurtenis .wtime{color:#a01a10}
body.sun .wgeb{background:#fdeae6;border-left-color:#b3241a;color:#5c1410}
.empty{font-size:var(--fs-md);color:var(--dim);font-style:italic}
/* ---------- Timer-tab ---------- */
#timerHost{display:none;position:fixed;left:0;right:0;z-index:5;
  top:0;padding-top:env(safe-area-inset-top);
  bottom:calc(79px + env(safe-area-inset-bottom));
  background:transparent}
body.timermode .appbar{display:none}
#timerHost.show{display:block}
#timerHost iframe{width:100%;height:100%;border:none;display:block}
/* ---------- Dialoog (bevestiging / invoer) ---------- */
/* Boven de melding: die zweeft op 99 en dekte anders de knoppen van het venster af. */
.modal-back{position:fixed;inset:0;z-index:120;background:rgba(4,10,24,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:0 14px calc(18px + env(safe-area-inset-bottom));animation:fadeIn .16s ease}
.modal-back.center{align-items:center;padding-bottom:14px}
.modal{width:100%;max-width:430px;background:rgba(20,40,74,.96);border:1px solid rgba(255,255,255,.16);border-radius:var(--r-xl);padding:18px 18px 16px;box-shadow:var(--shadow-xl), var(--edge-light);animation:slideUp .22s cubic-bezier(.2,.8,.25,1)}
.modal h3{font-size:17px;font-weight:800;margin-bottom:7px;letter-spacing:-.2px}
.modal p{font-size:var(--fs-md);color:var(--dim);line-height:1.5;margin-bottom:16px}
.modal textarea{width:100%;min-height:78px;background:rgba(255,255,255,.08);border:1px solid var(--stroke);border-radius:var(--r-md);color:var(--txt);font-size:var(--fs-base);padding:10px 12px;resize:none;margin-bottom:16px;font-family:inherit}
.modal .row{display:flex;gap:10px}
.modal .row .btn{flex:1;padding:13px 16px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(14px);opacity:.6}to{transform:translateY(0);opacity:1}}
/* ---------- Blijvende waarschuwing ---------- */
.warnbox{background:linear-gradient(135deg,rgba(255,205,110,.18),rgba(255,205,110,.08));border:1px solid rgba(255,210,122,.45);border-radius:var(--r-lg);padding:11px 13px;margin-bottom:12px;display:flex;align-items:flex-start;gap:10px;animation:fadeIn .2s ease}
.warnbox .wi{flex-shrink:0;font-size:var(--fs-h);line-height:1.4}
.warnbox .wt{flex:1;font-size:var(--fs-sm);color:#ffe7bd;line-height:1.45}
.warnbox .wx{flex-shrink:0;width:26px;height:26px;border-radius:var(--r-xs);border:1px solid rgba(255,210,122,.4);background:rgba(255,255,255,.06);color:#ffe7bd;font-size:var(--fs-md)}
/* Informatievak: legt uit wat er aan het schema is veranderd. Blijft staan tot je het sluit. */
.warnbox.info{background:linear-gradient(135deg,rgba(120,190,255,.18),rgba(120,190,255,.07));border-color:rgba(140,200,255,.45)}
.warnbox.info .wt{color:#dbeeff}
.warnbox.info .wx{border-color:rgba(140,200,255,.4);color:#dbeeff}
body.sun .warnbox.info{background:#e8f2ff;border-color:#12408f}
body.sun .warnbox.info .wt{color:#0b2a5c}
body.sun .warnbox.info .wx{border-color:#12408f;color:#0b2a5c}
/* ---------- Toast ---------- */
#toast{
  /* Vlak boven de tabbalk. Stond op 100px en dekte dan juist de inhoud af waar de
     melding over ging — bij een net gegenereerd schema viel hij over 'Wissels in Q1'. */
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);max-width:min(92vw,420px);text-align:center;
  background:rgba(15,30,60,.92);border:1px solid var(--stroke);color:var(--txt);
  padding:11px 18px;border-radius:var(--r-lg);font-size:var(--fs-md);font-weight:600;z-index:99;
  opacity:0;pointer-events:none;transition:opacity .22s ease, transform .32s cubic-bezier(.34,1.56,.64,1);max-width:88vw;text-align:center;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow-md), var(--edge-light);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- Print ---------- */
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:4mm}
  html,body{width:202mm;height:283mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff !important;color:#000;padding:0;margin:0;display:block;overflow:visible;height:auto}
  .appbar,.tabbar,main,#toast,#a2hs,#timerHost,#modalHost{display:none !important}
  body::before,body::after{display:none !important;content:none !important;background:none !important}
  #printArea{display:block;color:#000;font-family:Helvetica,Arial,sans-serif;height:283mm;overflow:hidden;page-break-after:avoid;page-break-inside:avoid}
  .phead{font-size:10pt;margin:0 0 1.5mm;text-align:center}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:137.5mm 137.5mm;gap:2.5mm;height:277.5mm}
  .pcell{border:1px solid #000;border-radius:1.5mm;padding:2mm 2.6mm;overflow:hidden;display:flex;flex-direction:column;height:137.5mm;box-sizing:border-box}
  .ph{font-size:11pt;font-weight:bold;margin-bottom:1.2mm;flex:0 0 auto}
  .ph span{font-weight:normal;font-size:8pt;color:#000}
  .pf{width:auto;max-width:58mm;max-height:66mm;height:auto;display:block;margin:0 auto 1.2mm;flex:0 0 auto}
  .pw{font-size:9pt;line-height:1.34;margin-top:0.8mm;flex:0 0 auto}
  /* 3 wisselmomenten per kwart: veld iets kleiner en tekst compacter, zodat het een A4 blijft */
  .pgrid.dense .pf{max-height:52mm}
  .pgrid.dense .pw{font-size:8.3pt;line-height:1.26;margin-top:0.6mm}
  /* 4 wisselmomenten per kwart: nog een tandje compacter */
  .pgrid.dense5 .pf{max-height:44mm}
  .pgrid.dense5 .pw{font-size:7.7pt;line-height:1.22;margin-top:0.5mm}
  .pw b{font-weight:bold}
}
/* Tabwissel: subtiele schuif in de richting van de veeg + fade */
@keyframes viewInR{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
@keyframes viewInL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
#view.slideR{animation:viewInR .22s cubic-bezier(.22,.61,.36,1)}
#view.slideL{animation:viewInL .22s cubic-bezier(.22,.61,.36,1)}
/* Speler oppakken bij selecteren: kleine veer-pop */
@keyframes tokenPop{0%{transform:translate(-50%,-50%) scale(1)}55%{transform:translate(-50%,-50%) scale(1.12)}100%{transform:translate(-50%,-50%) scale(1.06)}}
.chip.selected{animation:tokenPop .24s cubic-bezier(.34,1.56,.64,1)}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

/* Samenwerken-kaart + kijkstand */
.cloudstat{font-size:var(--fs-sm);color:var(--dim);background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:var(--r-sm);padding:9px 11px;line-height:1.5}
.clab{display:block;font-size:var(--fs-xs);color:var(--dim);font-weight:700;margin:10px 0 3px}
.cin{width:100%;background:rgba(255,255,255,.10);border:1px solid var(--stroke);border-radius:var(--r-sm);color:var(--txt);font-size:var(--fs-base);padding:9px 10px;font-family:inherit}
textarea.cin{resize:vertical}
/* Kijkstand: bewerk-knoppen dempen (server-regel dwingt het echt af) */
body.viewer #genBtn, body.viewer #replanBtn, body.viewer #addGuest, body.viewer #addRule,
body.viewer #shareState, body.viewer #importShare, body.viewer #backupImport,
body.viewer .prow .sw, body.viewer .prow .chev, body.viewer .rule .del,
body.viewer #cloudSetup{opacity:.4;pointer-events:none}
body.viewer .card .sub.readonly{color:var(--sem-out)}


/* Kijkstand-balk voor spelers */
#viewerBar{position:fixed;left:0;right:0;top:0;z-index:60;display:none;
  background:linear-gradient(180deg,#1f5a9e,#183466);color:#fff;text-align:center;
  font-size:var(--fs-sm);font-weight:700;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;
  box-shadow:0 2px 10px rgba(0,0,0,.35)}
body.viewer #viewerBar{display:block}
body.viewer #app{padding-top:34px}

</style>

const DEFAULT_FORM='4-3-3';
// Welke speelvorm geldt in kwart q (0-3)? Zonder regel is dat altijd 4-3-3.
function formOfQ(q,rules){
  const rs=rules||(typeof state!=='undefined'?state.rules:[])||[];
  const r=rs.find(x=>x.type==='form'&&(x.qs||[]).includes(q+1)&&FORMATIONS[x.form]);
  return r?r.form:DEFAULT_FORM;
}
function positionsOf(form){
  return (FORMATIONS[form]||FORMATIONS[DEFAULT_FORM]).pos.map(([id,x,y])=>({...POSMAP[id],x,y}));
}
function positionsOfQ(q,rules){return positionsOf(formOfQ(q,rules));}
// Regel 'subs': vast aantal wisselmomenten per kwart (1-4) voor de hele wedstrijd.
// Zonder regel kiest de app zelf (zie buildSchedule).
function subsRule(rules){
  const rs=rules||(typeof state!=='undefined'?state.rules:[])||[];
  const r=rs.find(x=>x.type==='subs'&&x.n>=1&&x.n<=4);
  return r?Number(r.n):null;
}

// Wanneer is deze demo voor het eerst geopend? Vanaf dat moment loopt de termijn.
function demoStart(){
  try{
    let t=Number(localStorage.getItem('demo_gestart')||0);
    if(!t){ t=Date.now(); localStorage.setItem('demo_gestart',String(t)); }
    return t;
  }catch(e){ return Date.now(); }
}
function demoDagenOver(){
  return Math.ceil((demoStart()+DEMO_DAGEN*864e5-Date.now())/864e5);
}
function demoVerlopen(){ return demoDagenOver()<=0; }
// Alles terugzetten naar de beginstand. Onmisbaar in een demo: wie de opstelling
// in de war heeft gehaald wil met één tik opnieuw kunnen beginnen.
function demoReset(){
  confirmDialog({title:'Demo opnieuw beginnen?',
    body:'De selectie, de regels en het schema gaan terug naar de beginstand. De teller van '
      +DEMO_DAGEN+' dagen loopt gewoon door.',
    okLabel:'Opnieuw beginnen', danger:true,
    onOk:()=>{
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      state=defaultState(); _undoStack=[]; klok={q:null,sec:0,loopt:false};
      save(); location.reload();
    }});
}
// Uitleg bij functies die in een demo niet werken. Beter een duidelijke melding dan
// een knop die niets doet of een foutmelding geeft.
// Uitleg op het moment dat hij van pas komt, en daarna niet meer. De app heeft al
// een hintregel onder het veld, maar die leest vrijwel niemand. In een demo waar
// iemand vijf minuten rondkijkt is het aantikken van een speler juist de kern.
function demoUitleg(sleutel,titel,tekst){
  if(!DEMO)return;
  if(document.querySelector('#modalHost .modal'))return;   // niet over een ander venster heen
  try{ if(localStorage.getItem('demo_tip_'+sleutel)==='1')return; }catch(e){}
  try{ localStorage.setItem('demo_tip_'+sleutel,'1'); }catch(e){}
  setTimeout(()=>confirmDialog({title:titel,body:tekst,okLabel:'Begrepen',cancelLabel:'',onOk:()=>{}}),450);
}
// Kijkt bij elke hertekening of er een tip past bij wat de gebruiker nu ziet.
function demoTips(){
  if(!DEMO||!state.schedule)return;
  if(!/^q[0-3]$/.test(activeTab))return;
  if(klok.loopt){
    demoUitleg('loopt','De wedstrijd loopt',
      'Tik nu een speler aan en je kunt vier dingen doen: hem spontaan wisselen met '
      +'iemand van de bank, een blessure doorgeven, hem voor de rest van de wedstrijd '
      +'afmelden, of een groene of gele kaart registreren. '
      +'Het schema past zich meteen aan en wat er gebeurde komt op de juiste minuut '
      +'in het wisseloverzicht te staan.');
  }else{
    demoUitleg('stil','Spelers ruilen',
      'De klok staat stil, dus je bent de opstelling aan het voorbereiden. '
      +'Tik twee spelers aan en ze wisselen van plek — dat mag ook met iemand van de bank. '
      +'Zodra de wedstrijd loopt, verandert wat je met een tik kunt doen.');
  }
}
// ── Gebruiksteller voor de demo ──
// Alleen optellen, niets herleidbaars: per dag hoe vaak iets gebeurde. Er wordt geen
// kenmerk per toestel bewaard en niets over de bezoeker zelf. Zo weet je of de demo
// wordt gebruikt zonder dat je gegevens van andermans coaches verzamelt.
//
// Eén uitzondering op 'alleen optellen': om een tweede bezoek te onderscheiden van
// een eerste, onthoudt het toestel lokaal welke dag het laatst geteld is. Dat blijft
// op het toestel staan en gaat nergens heen.
const TELLER_COLL='demostats';
let _tellerBezig=false;
async function demoTel(wat){
  if(!DEMO)return;
  try{
    const vandaag=new Date().toISOString().slice(0,10);
    // 'opening' hoogstens één keer per dag per toestel, anders telt herladen mee.
    if(wat==='opening'){
      if(localStorage.getItem('demo_geteld')===vandaag)return;
      localStorage.setItem('demo_geteld',vandaag);
      if(!localStorage.getItem('demo_eerste')){
        localStorage.setItem('demo_eerste',vandaag);
      }else{
        wat='terugkeer';   // niet de eerste dag: dit is iemand die terugkomt
      }
    }
    if(_tellerBezig)return;
    _tellerBezig=true;
    if(typeof firebase==='undefined'||!firebase.apps){
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    }
    if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);
    if(!firebase.auth().currentUser)await firebase.auth().signInAnonymously();
    const db=firebase.firestore();
    const veld={};
    veld[wat]=firebase.firestore.FieldValue.increment(1);
    veld.laatst=Date.now();
    await db.collection(TELLER_COLL).doc(vandaag).set(veld,{merge:true});
    _tellerBezig=false;
  }catch(e){ _tellerBezig=false; /* tellen mag nooit de app in de weg zitten */ }
}
