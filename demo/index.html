/* ============ Planning ============ */
// Kwarten waarin een speler volgens een 'noq'-regel niet speelt.
// Oudere regels (en gedeelde links van voor deze versie) hebben een enkel veld q.
function noqQs(r){
  if(Array.isArray(r.qs)&&r.qs.length)return r.qs.map(Number);
  return r.q!=null?[Number(r.q)]:[];
}
function quarterOf(b,perQ){return Math.floor(b/perQ);}        // 0..3
function halfOf(b,perQ){return quarterOf(b,perQ)<2?1:2;}      // 1|2

function eligibleVec(p,perQ,rules){
  const B=perQ*4, v=[];
  // Kwarten waarin deze speler zelf keept (vervangkeeper-regel): dan niet in het veld.
  const keepQs=new Set();
  for(const r of rules){ if(r.type==='gk'&&r.p1===p.id)(r.qs||[]).forEach(q=>keepQs.add(q)); }
  for(let b=0;b<B;b++){
    let ok=true;
    if(keepQs.has(quarterOf(b,perQ)+1)) ok=false; // keept dit kwart -> geen veldspeler
    for(const r of rules){
      if(r.p1!==p.id) continue;
      if(r.type==='half' && r.half!==halfOf(b,perQ)) ok=false;
      if(r.type==='noq'  && noqQs(r).includes(quarterOf(b,perQ)+1)) ok=false;
    }
    v.push(ok);
  }
  return v;
}

// Eerlijke doel-aantallen blokken per speler (waterfill met plafond = beschikbaarheid)
function fairTargets(ids,caps,totalSlots){
  const t={}; let rem=totalSlots; let act=[...ids];
  let guard=0;
  while(act.length && guard++<50){
    const share=rem/act.length;
    const capped=act.filter(id=>caps[id]<=share+1e-9);
    if(!capped.length){act.forEach(id=>t[id]=share);rem=0;act=[];break;}
    capped.forEach(id=>{t[id]=caps[id];rem-=caps[id];});
    act=act.filter(id=>!capped.includes(id));
  }
  act.forEach(id=>t[id]=0);
  return t;
}

function pickBlocks(fieldPlayers,perQ,rules,opts){
  opts=opts||{};
  const fromBlock=opts.fromBlock||0;           // vanaf welk blok (her)plannen; daarvoor ligt vast
  const fixedBlocks=opts.fixedBlocks||null;    // reeds gespeelde blokken (Set per index) die vaststaan
  const playedInit=opts.playedSoFar||null;     // al gespeelde blokken per speler tot fromBlock
  const B=perQ*4;
  const elig={},caps={};
  fieldPlayers.forEach(p=>{elig[p.id]=eligibleVec(p,perQ,rules);caps[p.id]=elig[p.id].filter(Boolean).length;});
  const ids=fieldPlayers.map(p=>p.id);
  // Min/max-minuten regels omrekenen naar blokken (1 blok = 17.5/perQ minuten)
  const blockMin=17.5/perQ;
  const maxBlk={},minBlk={};
  for(const r of rules){
    if(r.type!=='minutes'||!ids.includes(r.p1))continue;
    // Naar boven afronden bij een minimum, naar beneden bij een maximum. Met
    // afronden op het dichtstbijzijnde blok leverde 'minimaal 10 minuten' bij twee
    // wissels per kwart 8,75 minuut op — de coach kreeg minder dan hij instelde.
    if(r.mm==='max') maxBlk[r.p1]=Math.min(maxBlk[r.p1]??1e9, Math.floor(r.min/blockMin));
    else             minBlk[r.p1]=Math.max(minBlk[r.p1]??0,  Math.ceil(r.min/blockMin));
  }
  // maximum verlaagt de beschikbaarheid (cap), zodat de eerlijke verdeling het meeneemt
  fieldPlayers.forEach(p=>{ if(maxBlk[p.id]!=null) caps[p.id]=Math.min(caps[p.id],maxBlk[p.id]); });
  // resterende beschikbare blokken vanaf blok b (incl. b)
  const remFrom={};ids.forEach(i=>{remFrom[i]=new Array(B+1).fill(0);for(let b=B-1;b>=0;b--)remFrom[i][b]=remFrom[i][b+1]+(elig[i][b]?1:0);});
  const slots=10*B;
  const t=fairTargets(ids,caps,Math.min(slots,ids.reduce((s,i)=>s+caps[i],0)));
  const played={},bench={};ids.forEach(i=>{played[i]=playedInit&&playedInit[i]!=null?playedInit[i]:0;bench[i]=0;});
  const apart=rules.filter(r=>r.type==='apart');
  const conflictsWith=(id,set)=>{
    for(const r of apart){
      const other=r.p1===id?r.p2:(r.p2===id?r.p1:null);
      if(other&&set.has(other))return true;
    }
    return false;
  };
  const blocks=[];
  // 'Begint in de basis / op de bank' geldt alleen voor blok 0 (start Q1)
  const startBase=rules.filter(r=>r.type==='start'&&r.start==='base'&&ids.includes(r.p1)).map(r=>r.p1);
  const startBench=new Set(rules.filter(r=>r.type==='start'&&r.start==='bench'&&ids.includes(r.p1)).map(r=>r.p1));
  // 'Speelt zeker het einde': forceer deze spelers in de laatste blokken.
  // hele laatste kwart = laatste perQ blokken; laatste ~10 min = laatste round(10/blockMin) blokken.
  const endForce={}; // blokindex b -> Set van spelers die daar sowieso spelen
  for(const r of rules){
    if(r.type!=='endstrong'||!ids.includes(r.p1))continue;
    const n=r.amt==='min10'?Math.max(1,Math.round(10/blockMin)):perQ;
    for(let b=B-n;b<B;b++){ if(b<0)continue; (endForce[b]=endForce[b]||new Set()).add(r.p1); }
  }
  // 'Twee spelers wisselen elkaar af op één positie': per blok speelt er precies één
  // van het paar (om en om), die op de gedeelde positie komt te staan.
  const rotates=rules.filter(r=>r.type==='rotate'&&ids.includes(r.p1)&&ids.includes(r.p2));
  // 'Start Q3 gelijk aan start Q1': het startblok van Q3 krijgt dezelfde spelers als blok 0,
  // voor zover die dan beschikbaar zijn (wie in Q3 keept, valt hier vanzelf af).
  const q3like=rules.some(r=>r.type==='q3likeq1');
  const q3Block=perQ*2;
  const rotateBlocked=new Set(); // spelers die in dit blok juist NIET ingezet worden (de 'rust'-helft van het paar)
  for(let b=0;b<B;b++){
    // Reeds gespeelde blokken (vóór het herplan-moment) liggen vast
    if(b<fromBlock && fixedBlocks && fixedBlocks[b]){
      const fixed=new Set(fixedBlocks[b]);
      blocks.push(fixed);
      ids.forEach(i=>{ if(fixed.has(i)){/* played is al meegeteld via playedSoFar */} else if(elig[i][b])bench[i]++; });
      continue;
    }
    const cands=fieldPlayers.filter(p=>elig[p.id][b]).map(p=>p.id);
    cands.sort((a,c)=>{
      const ua=(t[a]-played[a])/Math.max(1,remFrom[a][b]);
      const uc=(t[c]-played[c])/Math.max(1,remFrom[c][b]);
      if(Math.abs(ua-uc)>1e-9)return uc-ua;
      if(bench[c]!==bench[a])return bench[c]-bench[a];
      if(b===perQ*2&&blocks[0]){ // spiegel Q1-start als gelijkspel
        const ia=blocks[0].has(a)?1:0,ic=blocks[0].has(c)?1:0;
        if(ia!==ic)return ic-ia;
      }
      return ids.indexOf(a)-ids.indexOf(c);
    });
    const sel=new Set(),skipped=[];
    // rotate-paren: kies per blok wie van het paar speelt (afwisselend p1/p2)
    rotateBlocked.clear();
    for(let ri=0;ri<rotates.length;ri++){
      const r=rotates[ri];
      const aOk=elig[r.p1]&&elig[r.p1][b], bOk=elig[r.p2]&&elig[r.p2][b];
      let pick=null,other=null;
      if(aOk&&bOk){ pick=(b%2===0)?r.p1:r.p2; other=(pick===r.p1)?r.p2:r.p1; }
      else if(aOk){ pick=r.p1; other=r.p2; }
      else if(bOk){ pick=r.p2; other=r.p1; }
      if(pick&&sel.size<10&&!(maxBlk[pick]!=null&&played[pick]>=maxBlk[pick])){sel.add(pick);}
      if(other)rotateBlocked.add(other);
    }
    // blok 0: eerst de 'begint in de basis'-spelers plaatsen
    if(b===0){ for(const id of startBase){ if(sel.size>=10)break; if(rotateBlocked.has(id))continue; if(elig[id]&&elig[id][0]&&!(maxBlk[id]!=null&&played[id]>=maxBlk[id]))sel.add(id); } }
    // start Q3 gelijk aan start Q1: eerst dezelfde spelers overnemen
    if(q3like && b===q3Block && blocks[0]){
      for(const id of blocks[0]){
        if(sel.size>=10)break;
        if(rotateBlocked.has(id))continue;
        if(!elig[id]||!elig[id][b])continue;              // keept dit kwart of anderszins niet inzetbaar
        if(maxBlk[id]!=null&&played[id]>=maxBlk[id])continue;
        sel.add(id);
      }
    }
    // eind-blokken: 'speelt zeker het einde'-spelers geforceerd plaatsen
    if(endForce[b]){ for(const id of endForce[b]){ if(sel.size>=10)break; if(rotateBlocked.has(id))continue; if(elig[id]&&elig[id][b])sel.add(id); } }
    for(const id of cands){
      if(sel.size>=10)break;
      if(sel.has(id))continue;
      if(rotateBlocked.has(id))continue; // dit blok de 'rust'-helft van een rotate-paar
      if(b===0 && startBench.has(id))continue; // begint op de bank: niet in blok 0
      if(maxBlk[id]!=null && played[id]>=maxBlk[id])continue; // max-minuten bereikt: niet meer inzetten
      if(conflictsWith(id,sel)){
        // 'liever niet samen' is zacht: alleen overtreden als de speler
        // anders zijn eerlijke aandeel niet meer kan halen
        const mustPlay=(t[id]-played[id])>=remFrom[id][b]-1e-9;
        if(!mustPlay){skipped.push(id);continue;}
      }
      sel.add(id);
    }
    for(const id of skipped){if(sel.size>=10)break;if(maxBlk[id]!=null&&played[id]>=maxBlk[id])continue;sel.add(id);}
    blocks.push(sel);
    ids.forEach(i=>{ if(sel.has(i)){played[i]++;bench[i]=0;} else if(elig[i][b])bench[i]++; });
  }
  // Verbeterronde: minuten gladstrijken
  const rotateIds=new Set(rotates.flatMap(r=>[r.p1,r.p2]));
  for(let it=0;it<400;it++){
    const sorted=[...ids].sort((a,c)=>(played[c]-t[c])-(played[a]-t[a]));
    let swapped=false;
    outer:
    for(let hiI=0;hiI<sorted.length&&!swapped;hiI++){
      const hi=sorted[hiI];
      for(let loI=sorted.length-1;loI>hiI;loI--){
        const lo=sorted[loI];
        if((played[hi]-t[hi])-(played[lo]-t[lo])<=1.0001)break outer;
        for(let b=0;b<B;b++){
          if(b<fromBlock)continue; // reeds gespeelde blokken liggen vast
          if(q3like&&b===q3Block)continue; // start Q3 moet gelijk blijven aan start Q1
          if(!blocks[b].has(hi)||blocks[b].has(lo)||!elig[lo][b])continue;
          if(rotateIds.has(hi)||rotateIds.has(lo))continue; // rotate-paren niet verstoren
          if(endForce[b]&&endForce[b].has(hi))continue; // geforceerde eindspeler niet uit eindblok halen
          if(maxBlk[lo]!=null&&played[lo]>=maxBlk[lo])continue; // lo niet boven zijn max tillen
          const tmp=new Set(blocks[b]);tmp.delete(hi);
          const conf=conflictsWith(lo,tmp);
          const allowConf=(t[lo]-played[lo])>1.0; // ver onder doel: regel mag wijken
          if(conf&&!allowConf)continue;
          blocks[b].delete(hi);blocks[b].add(lo);played[hi]--;played[lo]++;swapped=true;break;
        }
        if(swapped)break;
      }
    }
    if(!swapped)break;
  }
  // Minimum-minuten garanderen: spelers onder hun ondergrens erbij plaatsen
  for(const id of ids){
    if(minBlk[id]==null)continue;
    let guard=0;
    while(played[id]<Math.min(minBlk[id],caps[id]) && guard++<B){
      // zoek een blok waar id beschikbaar is maar niet speelt, en ruil een speler
      // met de meeste overtollige minuten eruit (die geen eigen minimum schendt)
      let done=false;
      for(let b=0;b<B&&!done;b++){
        if(b<fromBlock)continue;   // reeds gespeelde blokken liggen vast
        if(blocks[b].has(id)||!elig[id][b])continue;
        const cand=[...blocks[b]].filter(x=>x!==id
          && (minBlk[x]==null || played[x]>Math.min(minBlk[x],caps[x]))
          && !(maxBlk[id]!=null && played[id]>=maxBlk[id]))
          .sort((a,c)=>(played[c]-t[c])-(played[a]-t[a]))[0];
        if(cand!=null){ blocks[b].delete(cand);blocks[b].add(id);played[cand]--;played[id]++;done=true; }
      }
      if(!done)break;
    }
  }
  // Ontvlechtronde: 'liever niet samen' verder terugdringen zonder minuten te wijzigen
  for(const r of apart){
    for(let pass=0;pass<3;pass++){
      for(let b1=0;b1<B;b1++){
        if(b1<fromBlock)continue;   // reeds gespeelde blokken liggen vast
        if(q3like&&b1===q3Block)continue; // start Q3 blijft gelijk aan start Q1
        if(!(blocks[b1].has(r.p1)&&blocks[b1].has(r.p2)))continue;
        // Een vastgezet blok kan een speler bevatten die niet meer inzetbaar is;
        // die staat dan niet in elig en mag hier niet verschoven worden.
        if(!elig[r.p1]||!elig[r.p2])continue;
        let fixed=false;
        for(const mv of [r.p1,r.p2]){
          for(let b2=0;b2<B&&!fixed;b2++){
            if(b2<fromBlock)continue;   // reeds gespeelde blokken liggen vast
            if(b2===b1||blocks[b2].has(mv)||!elig[mv][b2])continue;
            if(q3like&&b2===q3Block)continue;
            const other=mv===r.p1?r.p2:r.p1;
            if(blocks[b2].has(other))continue;
            for(const x of blocks[b2]){
              if(x===r.p1||x===r.p2||blocks[b1].has(x)||!elig[x]||!elig[x][b1])continue;
              const tmp1=new Set(blocks[b1]);tmp1.delete(mv);
              if(conflictsWith(x,tmp1))continue;
              const tmp2=new Set(blocks[b2]);tmp2.delete(x);
              if(conflictsWith(mv,tmp2))continue;
              blocks[b1].delete(mv);blocks[b1].add(x);
              blocks[b2].delete(x);blocks[b2].add(mv);
              fixed=true;break;
            }
          }
          if(fixed)break;
        }
      }
    }
  }
  const dev=ids.reduce((s,i)=>s+Math.abs(played[i]-t[i]),0);
  return {blocks,played,t,dev,elig};
}

// vast: {vanaf, assignments} — blokken vóór 'vanaf' worden letterlijk overgenomen.
// Zonder dit werden ook al gespeelde blokken opnieuw over de posities verdeeld: de
// spelers bleven dezelfde, maar wie waar stond veranderde met terugwerkende kracht,
// waardoor de wisseltekst van een gespeeld kwart achteraf niet meer klopte.
function assignAll(blockSets,perQ,rules,byId,vast){
  const B=perQ*4, out=[];
  const q3like=rules.some(r=>r.type==='q3likeq1');
  let prev=null,q1a=null;
  for(let b=0;b<B;b++){
    if(vast&&b<vast.vanaf&&vast.assignments&&vast.assignments[b]){
      const kopie=Object.assign({},vast.assignments[b]);
      out.push(kopie); prev=kopie;
      if(b===0)q1a=kopie;
      continue;
    }
    const ids=[...blockSets[b]];
    const on=new Set(ids);
    const POS=positionsOfQ(Math.floor(b/perQ),rules);   // speelvorm van dit kwart
    const locks={};
    for(const r of rules){
      if(r.type==='pos'    && on.has(r.p1)) locks[r.p1]=r.pos;
      if(r.type==='condpos'&& on.has(r.p1) && !on.has(r.p2)) locks[r.p1]=r.pos;
      if(r.type==='rotate' && on.has(r.p1)) locks[r.p1]=r.pos;
      if(r.type==='rotate' && on.has(r.p2)) locks[r.p2]=r.pos;
    }
    // Vaste positie die in deze speelvorm niet bestaat: pak de dichtstbijzijnde verwante plek.
    for(const pid in locks){
      if(POS.some(p=>p.id===locks[pid]))continue;
      const alt=POS.find(p=>(p.eq||[]).includes(locks[pid]));
      if(alt)locks[pid]=alt.id; else delete locks[pid];
    }
    const short=ids.length<10;
    const score=(pid,pos)=>{
      const p=byId[pid];let s=0;
      // bij minder dan 10 spelers: laat een gat liefst voorin vallen
      s+=pos.line==='achter'?(short?60:6):(pos.line==='midden'?(short?30:3):0);
      if(locks[pid]) s+=(pos.id===locks[pid])?10000:-10000;
      if(!magInLinie(p,pos.line)) s-=10000;   // speler mag niet in deze linie
      const prefs=p.prefs||[];
      const i=prefs.indexOf(pos.id);
      if(i===0)s+=100;else if(i===1)s+=80;else if(i===2)s+=60;
      else{
        // verwante positie: voorkeur 'spits' past ook op 'spits links'
        const eq=pos.eq||[];
        const j=prefs.findIndex(x=>x&&eq.includes(x));
        if(j===0)s+=85;else if(j===1)s+=68;else if(j===2)s+=51;
        else if(prefs.some(x=>POSMAP[x]&&POSMAP[x].line===pos.line))s+=30;
      }
      if(prev){
        if(prev[pos.id]===pid)s+=35;
        else{const pe=Object.entries(prev).find(e=>e[1]===pid);if(pe&&POSMAP[pe[0]].line===pos.line)s+=12;}
      }
      if(b===perQ*2&&q1a&&q1a[pos.id]===pid)s+=q3like?4000:45;
      return s;
    };
    const pairs=[];
    for(const pid of ids)for(const pos of POS)pairs.push([score(pid,pos),pid,pos.id]);
    pairs.sort((a,c)=>c[0]-a[0]);
    const asg={},used=new Set();
    for(const [,pid,posId] of pairs){
      if(asg[posId]!==undefined||used.has(pid))continue;
      asg[posId]=pid;used.add(pid);
      if(used.size===ids.length)break;
    }
    const posIds=Object.keys(asg);
    let improved=true,guard=0;
    while(improved&&guard++<80){
      improved=false;
      for(let i=0;i<posIds.length;i++)for(let j=i+1;j<posIds.length;j++){
        const a=posIds[i],c=posIds[j],pa=asg[a],pc=asg[c];
        const PA=POS.find(p=>p.id===a),PC=POS.find(p=>p.id===c);
        const cur=score(pa,PA)+score(pc,PC);
        const alt=score(pa,PC)+score(pc,PA);
        if(alt>cur+1e-9){asg[a]=pc;asg[c]=pa;improved=true;}
      }
    }
    out.push(asg);prev=asg;if(b===0)q1a=asg;
  }
  return out;
}

function buildSchedule(state,opts){
  opts=opts||{};
  const present=state.players.filter(p=>p.present && !p.uit);   // p.uit = tijdelijk niet inzetbaar
  const keeper=present.find(p=>p.id===state.keeperId)||null;
  // Vervangkeepers per kwart (regels 'gk'), gebruikt als er geen vaste keeper is
  const gkRules=(state.rules||[]).filter(r=>r.type==='gk');
  const gkByQ={}; gkRules.forEach(r=>(r.qs||[]).forEach(q=>{if(!gkByQ[q])gkByQ[q]=r.p1;}));
  // Spelers die in ÉÉN of meer kwarten keepen (en dus daar niet in het veld staan)
  const gkIds=new Set(Object.values(gkByQ));
  // Veldspelers: iedereen behalve de vaste keeper; vervangkeepers blijven meedoen
  // in hun niet-keeper-kwarten, dus die houden we in de pool en halen we per kwart weg.
  const fieldPlayers=present.filter(p=>!keeper||p.id!==keeper.id);
  const byId=Object.fromEntries(state.players.map(p=>[p.id,p]));
  // Vervangkeepers blijven in de pool: ze spelen gewoon mee in hun niet-keeper-kwarten.
  // In hun keeper-kwarten worden ze via eligibleVec (per blok) buiten het veld gehouden.
  const pool=fieldPlayers;
  let perQ,res;
  if(opts.forcePerQ){                 // herplannen: perQ ligt vast op de bestaande indeling
    perQ=opts.forcePerQ;
    res=pickBlocks(pool,perQ,state.rules,{fromBlock:opts.fromBlock,fixedBlocks:opts.fixedBlocks,playedSoFar:opts.playedSoFar});
  }else if(subsRule(state.rules)){    // coach heeft het aantal wisselmomenten zelf vastgelegd
    perQ=subsRule(state.rules)+1;
    res=pickBlocks(pool,perQ,state.rules);
  }else{
    // Drie indelingen doorrekenen: 2, 3 of 4 blokken per kwart (= 1, 2 of 3 wisselmomenten).
    const cands=[2,3,4].map(n=>{const r=pickBlocks(pool,n,state.rules);return {n,r,dev:r.dev*(17.5/n)};});
    // Hoeveel wisselspelers zijn er gemiddeld per blok? Een speler die dat kwart keept,
    // telt daar niet als wisselspeler mee.
    const e2=cands[0].r.elig; let seats=0;
    for(let b=0;b<8;b++){ let n=0; for(const id in e2){ if(e2[id][b])n++; } seats+=Math.max(0,n-10); }
    const bankPlekken=seats/8;
    // Krappe bank (1 a 2 wisselspelers): dan duurt een rustbeurt anders een heel blok van
    // ruim 8 minuten en komt niet iedereen aan de beurt. Liever vaker en korter wisselen,
    // zodat de rustbeurt rond de 5 minuten blijft. Bij een ruimere bank weegt rust in het veld zwaarder.
    const krappeBank=bankPlekken>0 && bankPlekken<2.5;
    let keuze;
    if(krappeBank){
      keuze=cands[2];                       // 4 blokken = 3 wisselmomenten van ~4,4 min
    }else{
      // Ruimere bank: zoals voorheen kiezen tussen 1 en 2 wisselmomenten,
      // en bij gelijke eerlijkheid de rustigste indeling.
      keuze=(cands[1].dev<cands[0].dev-0.01)?cands[1]:cands[0];
    }
    perQ=keuze.n; res=keuze.r;
  }
  const assignments=assignAll(res.blocks,perQ,state.rules,byId,
    opts.fromBlock?{vanaf:opts.fromBlock,assignments:opts.vastAssignments}:null);
  // Regel 'q3likeq1' wordt in pickBlocks (zelfde spelers) en assignAll (zelfde posities)
  // afgedwongen, zodat minuten, wissels en keeper consistent blijven.
  // Keeper per kwart bepalen: vaste keeper voor alle kwarten, anders de gk-regel.
  const keeperByQ=[0,1,2,3].map(q=>keeper?keeper.id:(gkByQ[q+1]||null));
  return {perQ,assignments,keeperId:keeper?keeper.id:null,keeperByQ,
          fieldIds:pool.map(p=>p.id),
          minutes:Object.fromEntries(pool.map(p=>[p.id,(res.played[p.id]||0)*(17.5/perQ)]))};
}

function diffAsg(prevA,newA){
  const pb={},nb={};
  for(const [pos,pid] of Object.entries(prevA))pb[pid]=pos;
  for(const [pos,pid] of Object.entries(newA))nb[pid]=pos;
  const ins=[],outs=[],moves=[];
  for(const pid in nb){if(!(pid in pb))ins.push(pid);else if(pb[pid]!==nb[pid])moves.push({pid,from:pb[pid],to:nb[pid]});}
  for(const pid in pb){if(!(pid in nb))outs.push(pid);}
  const left=[...outs],pairs=[];
  for(const pid of ins){
    let idx=left.findIndex(o=>pb[o]===nb[pid]);
    if(idx<0)idx=0;
    const out=left.length?left.splice(idx,1)[0]:null;
    pairs.push({inP:pid,outP:out,pos:nb[pid]});
  }
  left.forEach(o=>pairs.push({inP:null,outP:o,pos:pb[o]}));
  return {pairs,moves};
}

// ── Eén bron voor de wisselmomenten van een kwart ──
// Scherm, print en deel-afbeelding rekenden alle drie zelf uit welke blokken bij
// een kwart horen. Dat liep uit elkaar toen de veldweergave met de klok mee ging
// lopen: het scherm pakte het lopende blok, print en afbeelding het begin van het
// kwart. Sindsdien komt die berekening uit deze ene functie.
function kwartMomenten(q,sch){
  sch=sch||state.schedule;
  if(!sch)return [];
  const perQ=sch.perQ, qStart=q*perQ, blockLen=17.5/perQ, uit=[];
  for(let m=1;m<perQ;m++){
    uit.push({
      m,
      minuut:Math.round(m*blockLen),
      blok:qStart+m,
      wissels:wisselChains(sch.assignments[qStart+m-1],sch.assignments[qStart+m]),
      bankNa:benchOfBlock(sch,qStart+m)
    });
  }
  return uit;
}
// Wissels als ketens: 'X erin voor Y — positie; daarmee schuift Z van A naar B'
function wisselChains(prevA,newA){
  const pb={},nb={};
  for(const [pos,pid] of Object.entries(prevA))pb[pid]=pos;
  for(const [pos,pid] of Object.entries(newA))nb[pid]=pos;
  const ins=[],outs=[],moves=[];
  for(const pid in nb){if(!(pid in pb))ins.push(pid);else if(pb[pid]!==nb[pid])moves.push({pid,from:pb[pid],to:nb[pid]});}
  for(const pid in pb){if(!(pid in nb))outs.push(pid);}
  const usedM=new Set(),usedO=new Set(),chains=[];
  for(const inP of ins){
    const pos=nb[inP],cm=[];let outP=null,cur=pos,guard=0;
    while(guard++<14){
      const occ=prevA[cur];           // wie stond hier in het vorige blok
      if(!occ)break;
      if(outs.includes(occ)&&!usedO.has(occ)){outP=occ;usedO.add(occ);break;}
      const m=moves.find(x=>x.pid===occ&&!usedM.has(x));
      if(!m)break;
      usedM.add(m);cm.push(m);cur=m.to;
    }
    chains.push({inP,pos,outP,moves:cm});
  }
  return {chains,
    looseOuts:outs.filter(o=>!usedO.has(o)).map(o=>({pid:o,pos:pb[o]})),
    looseMoves:moves.filter(m=>!usedM.has(m))};
}
function chainsEmpty(d){return !d.chains.length&&!d.looseOuts.length&&!d.looseMoves.length;}

// Vingerafdruk van alles wat de planning bepaalt. Verandert die, dan is het
// bestaande schema verouderd.
//
// Wél erin: wie er meedoet, hun voorkeursposities, in welke linies ze mogen spelen,
// de keeper en de coachregels. De linies ontbraken: verander je iemand van 'alleen
// achter' naar 'achter en midden', dan bleef het oude schema doorgaan voor actueel.
// Andersom erger — een speler die nog op het middenveld stond terwijl dat net was
// verboden, viel evenmin op.
//
// Níét erin: naam en rugnummer, want die veranderen de opstelling niet en maakten
// het schema onnodig verouderd. Ook 'uit' en 'kaart' blijven erbuiten: dat zijn
// tijdelijke toestanden tijdens de wedstrijd, die juist niet tot hergenereren
// moeten leiden.
// Kleine foutenlijst voor als een coach belt met 'hij doet het niet'. Blijft in het
// geheugen; te zien onderaan het spelerstabblad.
//
// Staat hier bovenaan en niet bij de diagnosekaart: de stand wordt al vroeg geladen
// en gecontroleerd, en een lijst die dan nog niet bestaat slikt die eerste meldingen
// stil op — precies de meldingen die je het hardst nodig hebt.
const _fouten=[];

// try/catch verdween, en viel de app stil terug op een leeg team. De coach was dan
// zijn hele selectie kwijt zonder dat iets vertelde waarom.
//
// Elke naam wordt lui opgevraagd: een const of let die nog niet is uitgevoerd werpt
// een fout bij het aanraken, ook binnen typeof. Zo vinden we precies dát geval.
// Moet vóór de controle én vóór loadState() staan: loadState zet dit veld bij een
// codefout, en de controle hieronder kijkt of het bestaat.
let opslagFout=null;
function _bestaat(fn){ try{ fn(); return true; }catch(e){ return false; } }
const NODIG_BIJ_START=[
  ['POSITIONS',   ()=>POSITIONS],
  ['POSMAP',      ()=>POSMAP],
  ['FORMATIONS',  ()=>FORMATIONS],
  ['LINE_IDS',    ()=>LINE_IDS],

  ['opslagFout',  ()=>opslagFout]
];
function controleerStartvolgorde(){
  return NODIG_BIJ_START.filter(([,fn])=>!_bestaat(fn)).map(([naam])=>naam);
}
const _startFout=controleerStartvolgorde();
if(_startFout.length){
  // Niet stil doorgaan: dit is een programmeerfout, geen beschadigde stand.
  try{ onthoudFout('startvolgorde',new Error('nog niet klaar bij het laden: '+_startFout.join(', '))); }catch(e){}

// De oude regel 'speelt alleen een helft' is vervangen door 'niet in bepaalde kwarten':
// eerste helft = niet in Q3 + Q4, tweede helft = niet in Q1 + Q2.
// Oude regels (uit opslag, back-ups, deel-links of van een co-coach met een oudere versie)
// worden hier automatisch omgezet, zodat ze zichtbaar en bewerkbaar blijven.
// Zet de oude coachregels 'altijd/nooit in een linie' om naar p.lines bij de speler.
// 'altijd voor'  -> alleen voor aangevinkt
// 'nooit voor'   -> de andere twee aangevinkt
function migrateLines(players,rules){
  if(!Array.isArray(players)||!Array.isArray(rules))return rules;
  const heeft=rules.some(r=>r&&(r.type==='line'||r.type==='noline'));
  if(!heeft)return rules;
  players.forEach(p=>{
    if(Array.isArray(p.lines)&&p.lines.length)return;   // al ingesteld: niet overschrijven
    const altijd=rules.filter(r=>r&&r.type==='line'&&r.p1===p.id).map(r=>r.line).filter(l=>LINE_IDS.includes(l));
    const nooit =rules.filter(r=>r&&r.type==='noline'&&r.p1===p.id).map(r=>r.line).filter(l=>LINE_IDS.includes(l));
    if(!altijd.length&&!nooit.length)return;
    let toegestaan = altijd.length ? altijd.slice() : LINE_IDS.slice();
    toegestaan = toegestaan.filter(l=>!nooit.includes(l));
    p.lines = toegestaan.length ? toegestaan : LINE_IDS.slice();
  });
  return rules.filter(r=>!(r&&(r.type==='line'||r.type==='noline')));
}
// ── Versie van de opgeslagen gegevens ──
// Tot nu toe leidden de migraties uit de vórm van de gegevens af of ze nodig waren.
// Dat werkt tot twee migraties elkaar in de weg zitten. Met een nummer weet de app
// precies welke stappen nog moeten draaien.
//   1 = oorspronkelijk    2 = 'half'-regels omgezet naar 'noq'
//   3 = linie-regels verhuisd naar de speler (p.lines)
// (STATE_V staat bovenaan, want defaultState() gebruikt hem al bij het opstarten.)
function migrateState(s){
  if(!s||!Array.isArray(s.players)||!Array.isArray(s.rules))return s;
  let v=Number(s.v||0);
  if(v>=STATE_V){s.v=STATE_V;return s;}
  if(v<2){ s.rules=migrateRules(s.rules); }
  if(v<3){ s.rules=migrateLines(s.players,s.rules); }
  if(v<4){
    // De vingerafdruk wordt anders berekend. Was het schema onder de oude formule
    // nog actueel, dan is het dat nog steeds — herbereken de vingerafdruk zodat er
    // geen valse melding 'spelers of regels zijn gewijzigd' verschijnt. Was het al
    // verouderd, dan blijft dat zo.
    if(s.schedule && s.genHash && s.genHash===inputHashV3(s))s.genHash=inputHash(s);
  }
  s.v=STATE_V;
  return s;
}
function migrateRules(rules){
  if(!Array.isArray(rules))return rules;
  return rules.map(r=>{
    if(r&&r.type==='half'){
      const qs=Number(r.half)===1?[3,4]:[1,2];
      return {id:r.id||('r'+Date.now()+Math.random().toString(36).slice(2,6)),type:'noq',p1:r.p1,qs};
    }
    return r;
  });
}
function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){
      const s=JSON.parse(raw);
      if(s&&Array.isArray(s.players)&&Array.isArray(s.rules)){
        // Eerst migreren, dan controleren: de migratie brengt oude gegevens in het
        // huidige formaat, de controle vangt op wat daarna nog niet klopt.
        migrateState(s);
        if(neemStandOver(s,'uit de opslag'))return s;
      }
    }
  }catch(e){
    // Onderscheid maken tussen beschadigde gegevens en een fout in de app zelf.
    // Het eerste is te verwachten en vangen we op; het tweede kost de coach zijn
    // selectie en moet dus zichtbaar zijn.
    const codefout = (e instanceof ReferenceError) || (e instanceof TypeError);
    try{ onthoudFout(codefout?'stand laden (codefout)':'stand laden',e); }catch(x){}
    if(codefout){
      try{ console.error('opstelling & wissels — laden mislukt door een codefout:',e); }catch(x){}
      opslagFout='codefout';
    }
  }
  return defaultState();
}
function cleanupGkRules(){
  // Vervangkeeper-regels ('speler wordt keeper') hebben alleen zin als er GEEN aanwezige keeper is.
  // Zodra er weer een keeper is (vaste keeper aangevinkt of een aanwezige gastkeeper), vervallen ze automatisch.
  if(!state.rules||!state.rules.some(r=>r.type==='gk'))return false;
  const keeperAanwezig=state.players.some(p=>p.present&&p.prefs&&p.prefs[0]==='keeper');
  if(keeperAanwezig){
    state.rules=state.rules.filter(r=>r.type!=='gk');
    return true;
  }
  return false;
}
// Opslagfout mag nooit stil blijven: dan denkt de coach dat zijn team bewaard is
// terwijl het bij de volgende start weg is. Safari blokkeert opslag in privémodus,
// en iOS ruimt gegevens van zelden gebruikte websites op.
//
// De declaratie staat hierboven, vóór het laden van de stand: loadState() zet dit
// veld bij een codefout, en stond hij hier dan wierp juist die foutafhandeling zelf
// een nieuwe fout — de app viel dan helemaal om, precies in de situatie waarin hij
// de selectie moest beschermen.
function save(){
  // Kon de opgeslagen stand niet worden gelezen door een fout in de app, dan draait
  // de app op de standaardselectie. Die dan wegschrijven zou het echte team van de
  // coach overschrijven — en juist dat wilden we voorkomen. Niets doen dus, tot de
  // fout verholpen is; het team staat dan nog gewoon in de opslag.
  if(opslagFout==='codefout')return;
  cleanupGkRules();
  try{
    localStorage.setItem(LS_KEY,JSON.stringify(state));
    // 'codefout' hoort hier niet gewist te worden — die verdwijnt pas na een
    // herstart met werkende code.
    if(opslagFout&&opslagFout!=='codefout'){opslagFout=null;render();}
  }catch(e){
    const nieuw=(e&&e.name==='QuotaExceededError')?'vol':'geblokkeerd';
    if(opslagFout!==nieuw){opslagFout=nieuw;setTimeout(render,0);}
  }
  cloudPush();
}

  try{

      // Nieuw team: wie het aanmaakt is eigenaar.
      await CLOUD.ref.set({owner:CLOUD.uid,editors:[CLOUD.uid],rev:0},{merge:true});
      CLOUD.rol='eigenaar'; noteerCoach('aangemaakt'); return;

    if(!d.owner){
      // Bestaand team van vóór deze beveiliging: de eerste die hem opent, claimt hem.
      await CLOUD.ref.set({owner:CLOUD.uid,editors:[CLOUD.uid]},{merge:true});

    if(Number(d.koppelTot||0)>Date.now()){

// Loopt van 'grof' naar 'fijn': de eerste treffer wint, zodat de melding kort blijft.
function beschrijfWijziging(vorigJSON,nu){
  try{
    if(!vorigJSON)return '';
    const o=JSON.parse(vorigJSON), n=nu;
    const op=id=>(o.players||[]).find(x=>x.id===id);
    // aanwezigheid
    const aanw=[];
    (n.players||[]).forEach(p=>{const q=op(p.id); if(q&&!!q.present!==!!p.present)aanw.push(p.name+(p.present?' erbij':' afwezig'));});
    if(aanw.length)return (aanw.length>2?aanw.length+' spelers aan/afgemeld':'Aanwezigheid: '+aanw.join(', '));
    // spelers erbij of weg
    const oid=new Set((o.players||[]).map(p=>p.id)), nid=new Set((n.players||[]).map(p=>p.id));
    const bij=(n.players||[]).filter(p=>!oid.has(p.id)), weg=(o.players||[]).filter(p=>!nid.has(p.id));
    if(bij.length)return 'Speler toegevoegd: '+bij.map(p=>p.name||'naamloos').join(', ');
    if(weg.length)return 'Speler verwijderd: '+weg.map(p=>p.name||'naamloos').join(', ');
    // regels
    const orid=new Set((o.rules||[]).map(r=>r.id)), nrid=new Set((n.rules||[]).map(r=>r.id));
    const rBij=(n.rules||[]).filter(r=>!orid.has(r.id)), rWeg=(o.rules||[]).filter(r=>!nrid.has(r.id));
    if(rBij.length)return 'Regel erbij: '+ruleSentence(rBij[0]);
    if(rWeg.length)return 'Regel weg: '+ruleSentence(rWeg[0]);
    if(JSON.stringify(o.rules||[])!==JSON.stringify(n.rules||[]))return 'Coachregel aangepast';
    // aanvoerder
    const oc=(o.players||[]).find(p=>p.captain), nc=(n.players||[]).find(p=>p.captain);
    if((oc?oc.id:null)!==(nc?nc.id:null))return nc?('Aanvoerder: '+nc.name):'Aanvoerder verwijderd';
    // schema
    const oS=o.schedule, nS=n.schedule;
    if(!oS&&nS)return 'Opstelling gegenereerd';
    if(oS&&!nS)return 'Schema gewist';
    if(oS&&nS){
      if(oS.perQ!==nS.perQ)return 'Schema opnieuw gepland';
      let anders=[],eerste=-1;
      for(let b=0;b<nS.assignments.length;b++){
        if(JSON.stringify(oS.assignments[b])!==JSON.stringify(nS.assignments[b])){anders.push(b);if(eerste<0)eerste=b;}
      }
      if(anders.length){
        if(anders.length>nS.perQ)return 'Schema opnieuw gepland';
        const q=Math.floor(eerste/nS.perQ)+1;
        return 'Opstelling Q'+q+' aangepast';
      }
      if(o.genHash!==n.genHash)return 'Schema opnieuw gegenereerd';
    }
    // naam, nummer, voorkeuren
    for(const p of (n.players||[])){
      const q=op(p.id); if(!q)continue;
      if(q.name!==p.name)return 'Naam gewijzigd: '+q.name+' \u2192 '+p.name;
      if(String(q.num)!==String(p.num))return 'Rugnummer '+p.name+': '+p.num;
      if(JSON.stringify(q.prefs||[])!==JSON.stringify(p.prefs||[]))return 'Voorkeuren van '+p.name+' aangepast';
    }
    return JSON.stringify(o)===JSON.stringify(n)?'':'Gegevens bijgewerkt';
  }catch(e){return '';}
}
function cloudListen(){
  if(CLOUD.unsub){try{CLOUD.unsub();}catch(e){}}
  CLOUD.unsub=CLOUD.ref.onSnapshot(snap=>{
    if(!snap.exists){ if(CLOUD.role==='editor')cloudPush(true); return; }
    const d=snap.data(); if(!d)return;
    CLOUD.koppelTot=Number(d.koppelTot||0);
    // Sta je te wachten en zet de eigenaar het venster open, dan koppel je meteen.
    // Zonder dit moest de mede-coach de app afsluiten en opnieuw openen, want de
    // controle draaide alleen bij het verbinden.
    if(CLOUD.rol==='wacht' && CLOUD.koppelTot>Date.now() && !CLOUD._koppelBezig){
      CLOUD._koppelBezig=true;
      cloudClaimOfKoppel().then(()=>{CLOUD._koppelBezig=false;cloudUpdateCard();render();});
    }
    // Gedeelde klok: alleen toepassen als een ánder toestel hem bedient.
    if(d.klok){
      CLOUD.klok=d.klok;
      CLOUD.klokBaas=d.klok.baas||null;
      const vanAnder=!d.klok.baas||d.klok.baas.id!==DEVICE_ID;
      klokNaarTimer(vanAnder?d.klok:null);
      if(vanAnder)volgKlokVanAnder();
    }else{
      // Nog niemand heeft de klok geclaimd: de timer moet tóch horen dat samenwerken
      // aanstaat, anders stuurt hij nooit iets en claimt niemand ooit de klok.
      CLOUD.klokBaas=null;
      klokNaarTimer(null);
    }
    if(!d.state)return;
    // Botsing herkennen: een stand van een ander toestel met een volgnummer dat niet
    // op het onze volgt, betekent dat onze wijziging is overschreven (of andersom).
    const binnenRev=Number(d.rev||0);
    const vanAnderToestel=d.updatedById && d.updatedById!==DEVICE_ID;
    if(vanAnderToestel && CLOUD.eigenRev && binnenRev<=CLOUD.eigenRev){
      botsing={wie:d.updatedBy||'de andere coach'};
    }
    if(!vanAnderToestel && binnenRev>=CLOUD.eigenRev)CLOUD.eigenRev=0;   // onze schrijfactie is geland
    CLOUD.rev=Math.max(binnenRev,CLOUD.rev||0);
    const zelfdeStand=(d.state===CLOUD.vorig);
    CLOUD.lastBy=d.updatedBy||''; CLOUD.lastAt=d.updatedAt||0; CLOUD.lastWhat=d.updatedWhat||'';
    CLOUD.coaches=d.coaches||null;
    CLOUD.vorig=d.state;   // vergelijk je eigen volgende wijziging hiermee
    if(zelfdeStand){cloudUpdateCard();return;}   // alleen de klok wijzigde: niet hertekenen
    try{
      const incoming=JSON.parse(d.state);
      if(!incoming||!Array.isArray(incoming.players))return;
      migrateState(incoming);
      if(!neemStandOver(incoming,'uit de cloud'))return;
      CLOUD.applying=true;
      state=incoming;
      try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}
      CLOUD.applying=false;
      render();
    }catch(e){CLOUD.applying=false;}
  }, err=>{ CLOUD.status='fout'; toast('Sync-fout: '+(err.message||err)); cloudUpdateCard(); });
}
function cloudPush(force){
  if(opslagFout==='codefout')return;         // draait op de standaardselectie: niets delen
  if(CLOUD.on&&CLOUD.rol==='wacht')return;   // nog niet gekoppeld: niets wegschrijven
  if(!CLOUD.on||CLOUD.applying||!CLOUD.ref)return;
  if(CLOUD.role!=='editor')return;              // kijkers schrijven nooit
  clearTimeout(CLOUD.writeT);
  CLOUD.writeT=setTimeout(()=>{
    const nu=JSON.stringify(serializeState());
    if(!force&&CLOUD.vorig===nu)return;        // niets veranderd: geen schrijfactie
    const wat=beschrijfWijziging(CLOUD.vorig,state)||'Gegevens bijgewerkt';
    CLOUD.vorig=nu; CLOUD.lastWhat=wat;
    // Volgnummer: we schrijven op basis van de laatste stand die we zagen. Komt er
    // straks een stand terug die niet de onze is en ook niet op de onze volgt, dan
    // heeft iemand tegelijk geschreven en is er iets overschreven.
    const rev=(CLOUD.rev||0)+1;
    CLOUD.rev=rev; CLOUD.eigenRev=rev;
    // merge is essentieel: zonder merge wist elke gewone wijziging het klokveld
    CLOUD.ref.set({state:nu,rev,updatedBy:CLOUD.name||'coach',updatedById:DEVICE_ID,updatedAt:Date.now(),updatedWhat:wat},{merge:true})
      .catch(e=>toast('Opslaan in cloud mislukt: '+(e.message||e)));
  }, force?0:600);
}

/* ============ Ongedaan maken (één stap terug) ============ */
// Stapel van tien momentopnamen. Eén stap was genoeg toen er alleen een knop was,
// maar schudden is een gebaar dat je een paar keer achter elkaar doet; dan wil je
// ook een paar stappen terug kunnen.
const UNDO_MAX=10;
let _undoStack=[];
// Een volledige momentopname van alles wat een actie kan wijzigen. Eerder werd
// alleen het schema bewaard, maar een kaart of blessure zit op de speler zelf
// (p.kaart, p.uit, p.present) en een gebeurtenis in state.gebeurtenissen. Na een
// kaart draaide 'Ongedaan maken' daardoor alleen het schema terug en bleef de
// kaart staan. Door de hele stand te bewaren werkt undo ook voor alles wat er
// later nog bij komt.
function snapshot(label){
  try{
    _undoStack.push({
      stand:JSON.stringify({
        players:state.players,
        schedule:state.schedule,
        rules:state.rules,
        keeperId:state.keeperId,
        genHash:state.genHash,
        gebeurtenissen:state.gebeurtenissen||[]
      }),
      label:label||''
    });
    if(_undoStack.length>UNDO_MAX)_undoStack.shift();
  }catch(e){ onthoudFout('momentopname maken',e); }
}
function canUndo(){return _undoStack.length>0;}
function undoLabel(){return _undoStack.length?_undoStack[_undoStack.length-1].label:'';}
function doUndo(){
  if(cloudViewerBlocked())return;
  if(!_undoStack.length){toast('Niets om ongedaan te maken');return;}
  const stap=_undoStack.pop();
  try{
    const oud=JSON.parse(stap.stand);
    state.players       = oud.players;
    state.schedule      = oud.schedule;
    state.rules         = oud.rules;
    state.keeperId      = oud.keeperId;
    state.genHash       = oud.genHash;
    state.gebeurtenissen= oud.gebeurtenissen||[];
  }catch(e){ onthoudFout('ongedaan maken',e); toast('Terugdraaien lukt niet'); return; }
  selChip=null;save();render();sendSwapTimesToTimer();
  toast('Ongedaan gemaakt'+(_undoStack.length?' \u2014 nog '+_undoStack.length+' stap'+(_undoStack.length>1?'pen':'')+' terug mogelijk':''));
}

function b64uEnc(u8){let s='';for(let i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64uDec(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const bin=atob(str);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function ghcDeflate(u8){
  if(typeof CompressionStream==='undefined')return null;
  try{
    const cs=new CompressionStream('deflate-raw');
    const out=new Response(cs.readable).arrayBuffer(); // eerst lezen starten, anders blokkeert schrijven
    const w=cs.writable.getWriter();
    w.write(u8);w.close();
    return new Uint8Array(await out);
  }catch(e){return null;}
}
async function ghcInflate(u8){
  const ds=new DecompressionStream('deflate-raw');
  const out=new Response(ds.readable).arrayBuffer();
  const w=ds.writable.getWriter();
  w.write(u8);w.close();
  return new Uint8Array(await out);
}
// Eén definitie van "een volledige stand", gebruikt door delen, back-up en de cloud.
// Delen en back-up schreven hier los van elkaar hun eigen lijstje velden, met twee
// gevolgen: ze zetten er 'v:1' bij terwijl het formaat inmiddels op 4 staat, en het
// gebeurtenissenlog (blessures, kaarten) ontbrak. Een back-up terugzetten wiste dus
// alles wat er tijdens de wedstrijd was gebeurd.
// Controleert een stand die van buiten komt: uit de opslag, een deel-link, een
// back-up of de cloud. Bewust beperkt tot wat tot een crash of een onzichtbare fout
// leidt — een te strenge controle zou iemand buiten zijn eigen team sluiten, en dat
// is erger dan de kwaal.
//
// Wat er niet klopt wordt zo veel mogelijk gerepareerd in plaats van geweigerd:
// een onbruikbaar schema gooien we weg (dat maak je opnieuw met één tik), een
// onbekende regel of voorkeur laten we vallen. Regels worden per soort gecontroleerd:
// een onbekend type verdwijnt, en waarden binnen een bekende regel (positie,
// speelvorm, kwart, aantal minuten) moeten kloppen. Alleen als de spelerslijst zelf
// onbruikbaar is, geven we op.
function valideerStand(s){
  const klachten=[];
  if(!s||!Array.isArray(s.players)||!s.players.length)return {ok:false,klachten:['geen spelerslijst']};
  if(!Array.isArray(s.rules))s.rules=[];
  // Bovengrenzen: een stand die hier niet in past komt niet van een echte selectie.
  if(s.players.length>MAX_SPELERS)return {ok:false,klachten:['te veel spelers ('+s.players.length+')']};
  if(s.rules.length>MAX_REGELS){klachten.push('te veel regels — de rest is weggelaten');s.rules=s.rules.slice(0,MAX_REGELS);}
  if(Array.isArray(s.gebeurtenissen)&&s.gebeurtenissen.length>MAX_GEBEURTENISSEN){
    klachten.push('te veel gebeurtenissen — de oudste zijn weggelaten');
    s.gebeurtenissen=s.gebeurtenissen.slice(-MAX_GEBEURTENISSEN);
  }

  const posIds=POSITIONS.map(p=>p.id);
  const gezien=new Set();
  s.players=s.players.filter(p=>{
    // Kenmerken belanden in data-attributen in de HTML. Alleen letters, cijfers,
    // liggend streepje en koppelteken toestaan, zodat een gemanipuleerde deel-link
    // daar niets in kan smokkelen.
    if(!p||typeof p.id!=='string'||!/^[A-Za-z0-9_-]{1,40}$/.test(p.id)){
      klachten.push('speler met een onbruikbaar kenmerk');return false;}
    if(gezien.has(p.id)){klachten.push('dubbel spelerkenmerk '+p.id);return false;}
    gezien.add(p.id);
    if(typeof p.name!=='string')p.name=String(p.name||'');
    p.present=!!p.present;
    // Voorkeuren: altijd drie plekken, alleen bekende posities (of 'keeper' vooraan).
    if(!Array.isArray(p.prefs))  { klachten.push(p.name+': voorkeuren onbruikbaar'); p.prefs=['','','']; }
    p.prefs=[0,1,2].map(i=>{
      const v=p.prefs[i];
      if(v==='keeper'&&i===0)return v;
      return posIds.includes(v)?v:'';
    });
    if(p.lines!=null){
      if(!Array.isArray(p.lines)){klachten.push(p.name+': linies onbruikbaar');delete p.lines;}
      else{
        const geldig=p.lines.filter(x=>LINE_IDS.includes(x));
        if(geldig.length!==p.lines.length)klachten.push(p.name+': onbekende linie');
        p.lines=geldig;
      }
    }
    if(p.kaart && !(p.kaart&&KAARTEN[p.kaart.soort]&&typeof p.kaart.terug==='number')){
      klachten.push(p.name+': kaartgegevens onbruikbaar'); delete p.kaart;
    }
    return true;
  });
  if(!s.players.length)return {ok:false,klachten:['spelerslijst leeg na controle']};

  // Regels: per soort controleren wat hij nodig heeft. Een regel met een onbekend
  // type of een onbruikbare waarde wordt weggegooid — hij zou toch niets doen, maar
  // hij hoort niet in een gecontroleerde stand thuis en kan bij een volgende
  // uitbreiding onverwacht gedrag geven.
  const ids=new Set(s.players.map(p=>p.id));
  const kwarten=v=>Array.isArray(v)?[...new Set(v.map(Number).filter(q=>q>=1&&q<=4))]:[];
  s.rules=s.rules.filter(r=>{
    if(!r||typeof r.type!=='string'){klachten.push('regel zonder soort');return false;}
    if(r.id!=null && !/^[A-Za-z0-9_-]{1,40}$/.test(String(r.id))){
      klachten.push('regel met een onbruikbaar kenmerk');return false;}
    const weg=reden=>{klachten.push('regel \''+r.type+'\': '+reden);return false;};
    // Spelers waar de regel naar wijst moeten bestaan.
    if(r.p1!=null && !ids.has(r.p1))return weg('onbekende speler');
    if(r.p2!=null && !ids.has(r.p2))return weg('onbekende speler');
    switch(r.type){
      case 'noq':        // niet spelen in bepaalde kwarten
      case 'gk': {       // vervangkeeper in bepaalde kwarten
        if(!r.p1)return weg('geen speler');
        r.qs=kwarten(r.qs);
        if(!r.qs.length)return weg('geen geldig kwart');
        return true;
      }
      case 'form': {     // speelvorm per kwart
        if(!FORMATIONS[r.form])return weg('onbekende speelvorm');
        r.qs=kwarten(r.qs);
        if(!r.qs.length)return weg('geen geldig kwart');
        return true;
      }
      case 'pos':        // vaste positie
      case 'condpos':    // positie als een andere speler er niet staat
      case 'rotate': {   // wisselen van positie met een ander
        if(!r.p1)return weg('geen speler');
        if(!POSMAP[r.pos])return weg('onbekende positie');
        if((r.type==='condpos'||r.type==='rotate') && !r.p2)return weg('tweede speler ontbreekt');
        return true;
      }
      case 'apart': {    // twee spelers liever niet samen
        if(!r.p1||!r.p2||r.p1===r.p2)return weg('twee verschillende spelers nodig');
        return true;
      }
      case 'minutes': {  // minimum of maximum aantal minuten
        if(!r.p1)return weg('geen speler');
        if(r.mm!=='min'&&r.mm!=='max')return weg('geen minimum of maximum');
        r.min=Number(r.min);
        if(!isFinite(r.min)||r.min<0||r.min>70)return weg('aantal minuten onbruikbaar');
        return true;
      }
      case 'start': {    // begint in de basis of op de bank
        if(!r.p1)return weg('geen speler');
        if(r.start!=='base'&&r.start!=='bench')return weg('onbekende startkeuze');
        return true;
      }
      case 'endstrong': {// speelt zeker het einde
        if(!r.p1)return weg('geen speler');
        if(r.amt!=='min10'&&r.amt!=='q4')r.amt='q4';
        return true;
      }
      case 'subs': {     // aantal wisselmomenten per kwart
        r.n=Number(r.n);
        if(!(r.n>=1&&r.n<=4))return weg('aantal wissels onbruikbaar');
        return true;
      }
      case 'q3likeq1':   // Q3 begint als Q1
        return true;
      // Oude soorten die de migratie omzet; die mogen blijven tot dat gebeurd is.
      case 'line': case 'noline': case 'half':
        return true;
      default:
        return weg('onbekende soort');
    }
  });

  if(s.keeperId && !ids.has(s.keeperId)){ klachten.push('keeper bestaat niet meer'); s.keeperId=null; }
  if(!Array.isArray(s.gebeurtenissen))s.gebeurtenissen=[];

  // Schema in twee stappen.
  //
  // Eerst de bouw: klopt het aantal wisselmomenten en het aantal blokken niet, dan
  // valt er niets mee te tekenen en gooien we het weg.
  //
  // Daarna de inhoud, met dezelfde controle die de app ook na elke hertekening doet:
  // dubbele spelers, onbekende spelers, te weinig plekken. Zo'n schema wordt wél
  // bewaard. Het is namelijk nog steeds tekenbaar, en weggooien zou midden in een
  // wedstrijd de hele wedstrijdplanning wissen — inclusief de al gespeelde kwarten,
  // waar geen ongedaan-maken meer tegen helpt. De coach ziet de rode balk met de
  // reden erin en beslist zelf of hij opnieuw genereert.
  if(s.schedule){
    const perQ=Number(s.schedule.perQ);
    const blokkenGoed = Array.isArray(s.schedule.assignments)
      && s.schedule.assignments.length===perQ*4
      && s.schedule.assignments.every(a=>a&&typeof a==='object');
    if(!(perQ>=2&&perQ<=5) || !blokkenGoed){
      klachten.push('wisselschema onbruikbaar van bouw — opnieuw genereren');
      s.schedule=null; s.genHash=null;
    }else{
      let inhoud=null;
      try{ inhoud=schemaKlopt(s.schedule,s); }catch(e){ inhoud='schema kon niet worden gecontroleerd'; }
      if(inhoud)klachten.push('wisselschema: '+inhoud);
    }
  }
  return {ok:true,klachten};
}

function neemStandOver(s,herkomst){
  const r=valideerStand(s);
  if(!r.ok){ onthoudFout('stand '+herkomst,new Error(r.klachten.join('; '))); return false; }
  if(r.klachten.length){
    onthoudFout('stand '+herkomst,new Error(r.klachten.slice(0,4).join('; ')));
    setTimeout(()=>toast('Enkele gegevens waren onbruikbaar en zijn hersteld'),300);
  }
  return true;
}

async function importShared(txt){
  const m=(txt||'').match(/#([sr])=([A-Za-z0-9_\-]+)/);
  if(!m){toast('Geen geldige deel-link gevonden');return;}
  if(m[2].length>MAX_CODE){toast('Deze gegevens zijn te groot om te verwerken');return;}
  try{
    let u8=b64uDec(m[2]);
    if(m[1]==='s'){
      if(typeof DecompressionStream==='undefined'){toast('Deze link vereist een nieuwere iOS-versie');return;}
      u8=await ghcInflate(u8);
    }
    if(u8.length>MAX_UITGEPAKT){toast('Deze gegevens zijn te groot om te verwerken');return;}
    const inc=JSON.parse(new TextDecoder().decode(u8));
    if(!inc||!Array.isArray(inc.players))throw 0;
    const present=inc.players.filter(p=>p.present).length;
    const nRules=Array.isArray(inc.rules)?inc.rules.length:0;
    confirmDialog({
      title:'Gedeelde stand overnemen?',
      body:present+' spelers aanwezig, '+nRules+' regel'+(nRules===1?'':'s')+(inc.schedule?', inclusief wisselschema':'')+'. De huidige stand op dit toestel wordt vervangen.',
      okLabel:'Overnemen',cancelLabel:'Annuleren',
      onOk:()=>{
        const nieuw={v:Number(inc.v||0),players:inc.players,keeperId:inc.keeperId||'mauk',
          rules:Array.isArray(inc.rules)?inc.rules:[],schedule:inc.schedule||null,
          genHash:inc.genHash||null,gebeurtenissen:Array.isArray(inc.gebeurtenissen)?inc.gebeurtenissen:[]};
        migrateState(nieuw);
        if(!neemStandOver(nieuw,'uit de deel-link')){toast('Deze gegevens zijn onbruikbaar');return;}
        state=nieuw;
        save();selChip=null;activeTab='spelers';render();document.getElementById('view').scrollTop=0;
        toast('Gedeelde stand overgenomen');
      }
    });
  }catch(e){toast('Deel-link kon niet worden gelezen');}
}

function byId(id){return state.players.find(p=>p.id===id);}
// Wie staat er in kwart q op doel? (vaste keeper, of de vervanger uit de 'gk'-regels)
// Wie is de aanvoerder? (maximaal een; niet-aanwezig telt gewoon niet mee op het veld)
function captainId(){const c=state.players.find(p=>p.captain);return c?c.id:null;}
function keeperOfQ(sch,q){ if(!sch)return null; return (sch.keeperByQ&&sch.keeperByQ[q])||sch.keeperId||null; }
// Bank bij blok b: alle aanwezige veldspelers die niet in het veld staan EN niet keepen in dat kwart.
function benchOfBlock(sch,b){
  if(!sch)return [];
  const q=Math.floor(b/sch.perQ);
  const kid=keeperOfQ(sch,q);
  const on=new Set(Object.values(sch.assignments[b]||{}));
  return (sch.fieldIds||[]).filter(id=>id!==kid&&!on.has(id)&&byId(id)&&byId(id).present);
}
function pName(id){const p=byId(id);return p?p.name:'?';}
// Korte naam voor op het veld en de bank. Coaches vullen soms de volledige naam in,
// en die plaatjes staan dicht op elkaar — 'Bob Munnichs' liep dan over de speler
// ernaast heen. Alleen de voornaam dus.
//
// Komt een voornaam meer dan eens voor in de selectie, dan zou je niet meer weten
// wie wie is; die krijgen er de eerste letter van hun achternaam bij: Bram J en
// Bram P. Alleen de spelers die het betreft, de rest blijft gewoon de voornaam.
let _kortCache=null, _kortBron='';
function bouwKorteNamen(){
  const bron=state.players.map(p=>p.id+':'+p.name).join('|');
  if(_kortCache&&_kortBron===bron)return _kortCache;
  const tel={};
  state.players.forEach(p=>{
    const v=String(p.name||'').trim().split(/\s+/)[0]||'';
    tel[v.toLowerCase()]=(tel[v.toLowerCase()]||0)+1;
  });
  const uit={};
  state.players.forEach(p=>{
    const delen=String(p.name||'').trim().split(/\s+/).filter(Boolean);
    const voor=delen[0]||'';
    if(tel[voor.toLowerCase()]>1 && delen.length>1){
      // Eerste letter van het laatste naamdeel; tussenvoegsels als 'van der' slaan
      // we over, want die zijn zelden onderscheidend.
      const achter=delen[delen.length-1];
      uit[p.id]=voor+' '+achter.charAt(0).toUpperCase();
    }else{
      uit[p.id]=voor||String(p.name||'');
    }
  });
  _kortCache=uit; _kortBron=bron;
  return uit;
}
function pKort(id){
  const k=bouwKorteNamen()[id];
  if(k)return k;
  const p=byId(id);
  return p?(String(p.name||'').trim().split(/\s+/)[0]||p.name):'?';
}
function pNum(id){const p=byId(id);return p&&p.num!==''&&p.num!=null?p.num:'·';}
function fmtMin(x){return (Math.round(x*100)/100).toString().replace('.',',');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  t.textContent=msg;t.classList.add('show');

}

/* ============ Blijvende ruil-waarschuwingen ============ */
let swapWarnings=[];
let planInfo=[];        // uitleg over wat er in het schema is veranderd
// Versie van timer.html als die niet gelijkloopt met de app. Blijft staan tot het
// klopt: dit is een uploadfout, geen melding die je even wegtikt.
let timerMismatch=null;
// Twee coaches wijzigden vrijwel tegelijk; er is er dan één overschreven.
// Beter een zichtbare melding dan stil verlies.
let botsing=null;
// Meldingen die op elk tabblad horen te staan en niet weg te tikken zijn:
// het gaat om verlies van gegevens, niet om een tip.
// Is dit schema intern consistent? Een schema kan beschadigd binnenkomen via een
// deel-link van een andere versie, een half afgebroken synchronisatie of een oude
// back-up. Zonder deze controle tekent de app gewoon door: een onbekende speler
// verdwijnt stil van het veld en een dubbel opgestelde speler valt niemand op.
function schemaKlopt(sch,st){
  st=st||state;
  if(!sch||!Array.isArray(sch.assignments))return 'geen geldig schema';
  const perQ=sch.perQ, B=perQ*4;
  if(!perQ||sch.assignments.length!==B)return 'aantal blokken klopt niet';
  const bekend=new Set(st.players.map(p=>p.id));
  for(let b=0;b<B;b++){
    const a=sch.assignments[b];
    if(!a||typeof a!=='object')return 'blok '+(b+1)+' ontbreekt';
    const q=Math.floor(b/perQ);
    const nodig=positionsOfQ(q,st.rules).length;
    const ids=Object.values(a);
    if(Object.keys(a).length!==nodig)return 'in Q'+(q+1)+' staan '+Object.keys(a).length+' spelers in plaats van '+nodig;
    if(new Set(ids).size!==ids.length){
      const dubbel=ids.find((x,i)=>ids.indexOf(x)!==i);
      const p=st.players.find(y=>y.id===dubbel);
      return (p?p.name:'een speler')+' staat twee keer tegelijk op het veld in Q'+(q+1);
    }
    for(const id of ids) if(!bekend.has(id))return 'onbekende speler in Q'+(q+1);
  }
  return null;   // in orde
}
let schemaFout=null;
function controleerSchema(){
  schemaFout = state.schedule ? schemaKlopt(state.schedule) : null;
  return schemaFout;
}
// Voor iedereen zichtbaar, maar ingeklapt: hij staat er als je hem nodig hebt en
// zit verder niet in de weg. Is er wél iets aan de hand, dan klapt hij vanzelf open.
function diagnoseProbleem(){
  return _fouten.length>0 || !!opslagFout || !!schemaFout || timerMismatch!==null;
}

  const r=[];
  r.push('app '+VERSIE_LABEL+(timerMismatch!==null?' / timer LOOPT ACHTER (intern '+timerMismatch+' tegen '+APP_VERSION+')':' / timer gelijk'));

  r.push('samenwerken: '+(CLOUD.on?(CLOUD.status+' · '+(CLOUD.rol||CLOUD.role)+' · team '+(CLOUD.team||'?')):'uit'));
  r.push('opslag: '+(opslagFout?('PROBLEEM ('+opslagFout+')'):'in orde')+' · schema: '+(schemaFout||'in orde'));
  r.push('spelers '+state.players.filter(p=>p.present).length+' aanwezig · '+(state.schedule?('schema '+state.schedule.perQ*4+' blokken'):'geen schema'));
  r.push(_fouten.length?('laatste fouten:'):'geen fouten geregistreerd');

}

/* ============ Regels: zinnen ============ */
function ruleSentence(r){
  const n=id=>pName(id);
  switch(r.type){
    case 'half':   return `${n(r.p1)} speelt alleen de ${r.half===1?'eerste':'tweede'} helft`;
    case 'apart':  return `${n(r.p1)} en ${n(r.p2)} liever niet samen op het veld`;
    case 'line':   return `${n(r.p1)} speelt altijd in de ${LINES[r.line]}`;
    case 'pos':    return `${n(r.p1)} speelt altijd ${POSMAP[r.pos].name.toLowerCase()}`;
    case 'condpos':return `${n(r.p1)} speelt ${POSMAP[r.pos].name.toLowerCase()} als ${n(r.p2)} niet meespeelt`;
    case 'noq':    {const qs=noqQs(r);return `${n(r.p1)} speelt niet in ${qs.map(q=>'Q'+q).join(' + ')}`;}
    case 'minutes':return `${n(r.p1)} speelt ${r.mm==='max'?'maximaal':'minimaal'} ${r.min} minuten`;
    case 'start':  return `${n(r.p1)} begint ${r.start==='base'?'in de basis':'op de bank'}`;
    case 'endstrong': return `${n(r.p1)} speelt zeker ${r.amt==='min10'?'de laatste ~10 minuten':'het hele laatste kwart'}`;
    case 'noline': return `${n(r.p1)} speelt nooit in de ${LINES[r.line]}`;
    case 'rotate': return `${n(r.p1)} en ${n(r.p2)} wisselen elkaar af op ${POSMAP[r.pos]?POSMAP[r.pos].name.toLowerCase():r.pos}`;
    case 'q3likeq1': return `Start Q3 gelijk aan start Q1`;
    case 'gk': return `${n(r.p1)} keept ${(r.qs||[]).length===4?'de hele wedstrijd':(r.qs||[]).map(q=>'Q'+q).join(' + ')}`;
    case 'subs': return `${r.n}${r.n===1?' wisselmoment':' wisselmomenten'} in elk kwart`;
    case 'form': return `Speelvorm ${r.form} in ${(r.qs||[]).length===4?'de hele wedstrijd':(r.qs||[]).map(q=>'Q'+q).join(' + ')}`;
  }
  return '';
}

const isQTab=t=>t==='wedstrijd';

// in zijn eigen venster. Langs de lijn kijk je juist naar de opstelling, dus doen
// we het hier ook: zolang een kwart-tabblad of de timer in beeld is.
let _wakeLock=null;
async function wakeLockAan(){
  try{
    if(!('wakeLock' in navigator)||_wakeLock)return;
    _wakeLock=await navigator.wakeLock.request('screen');
    _wakeLock.addEventListener('release',()=>{_wakeLock=null;});
  }catch(e){_wakeLock=null;}
}
async function wakeLockUit(){
  try{ if(_wakeLock){await _wakeLock.release(); _wakeLock=null;} }catch(e){}
}
function wakeLockBijwerken(){
  if(document.visibilityState!=='visible'){return;}
  if(isQTab(activeTab)||activeTab==='timer')wakeLockAan(); else wakeLockUit();
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible')wakeLockBijwerken(); else _wakeLock=null;

// Brede stand: tablet in liggende stand (zelfde voorwaarden als de media-query).
const WIDE_MQ='(orientation:landscape) and (min-width:820px) and (min-height:600px) and (pointer:coarse)';
const isWide=()=>window.matchMedia&&window.matchMedia(WIDE_MQ).matches;
let pendingQTab=null; // kwart dat de timer doorgaf terwijl de coach elders keek
// Stand van de wedstrijdklok, doorgegeven door de timer. Hiermee loopt de
// veldweergave mee met de wedstrijd: na een wisselmoment zie je de nieuwe opstelling.
let klok={q:null,sec:0,loopt:false};
// Welk kwart en blok er werkelijk getekend is. Hiermee kan de app zichzelf herstellen
// als hij het moment van een blokwissel gemist heeft (bijvoorbeeld omdat de timer
// verborgen stond en zijn tijdmeldingen even stillagen).
let _getoond={q:null,blok:null};
// Welk blok van kwart q is nu bezig? null = geen klok voor dit kwart, dan tonen we de start.
// Wedstrijdtijd zoals de timer hem toont: Q2 en Q4 tellen door vanaf 17:30.
function klokTekst(){
  const q=klok.q==null?1:klok.q, sec=klok.q==null?0:klok.sec, loopt=klok.q==null?false:klok.loopt;
  const tot=sec+((q===2||q===4)?17.5*60:0);
  const m=Math.floor(tot/60), s=Math.floor(tot%60);
  return {tijd:String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'),
          kwart:'Q'+q, loopt:loopt};
}
// Grote ronde klok naast het veld, alleen in de liggende tabletstand. Bedoeld om
// vanaf de bank leesbaar te zijn: spelers moeten kunnen zien hoeveel er gespeeld is.
const KLOK_R=86, KLOK_OMTREK=2*Math.PI*KLOK_R;
// Totale speeltijd van de wedstrijd tot nu toe — dat is wat spelers langs de lijn
// willen weten, niet alleen de tijd binnen dit kwart.
function gespeeldTotaal(){
  if(klok.q==null)return '0:00';
  const tot=(klok.q-1)*17.5*60+klok.sec;
  const m=Math.floor(tot/60), s2=Math.floor(tot%60);
  return m+':'+String(s2).padStart(2,'0');
}
function groteKlokHTML(bankAantal){
  const k=klokTekst(); if(!k)return '';
  // Twee kolommen bank passen naast de klok tot en met zes spelers; daarboven komt
  // er een rij bij die tegen de klok aan zou lopen.
  const krap=(bankAantal||0)>5;
  const QLEN=17.5*60;
  const sec=klok.q==null?0:Math.min(klok.sec,QLEN);
  const deel=sec/QLEN;
  const laatst=sec>QLEN-120;                       // laatste twee minuten van het kwart
  return `<div class="grklok${krap?' krap':''}" id="grklok">
    <svg viewBox="0 0 200 200" width="100%" height="100%">
      <circle cx="100" cy="100" r="${KLOK_R+7}" class="gk-schijf"/>
      <circle cx="100" cy="100" r="${KLOK_R}" class="gk-baan"/>
      <circle cx="100" cy="100" r="${KLOK_R}" class="gk-boog${laatst?' laat':''}" id="gkBoog"
        stroke-dasharray="${KLOK_OMTREK.toFixed(1)}"
        stroke-dashoffset="${(KLOK_OMTREK*(1-deel)).toFixed(1)}"
        transform="rotate(-90 100 100)"/>
      <text x="100" y="94" class="gk-tijd" id="gkTijd">${k.tijd}</text>
      <text x="100" y="120" class="gk-sub" id="gkSub">${k.kwart}${k.loopt?'':' \u00b7 pauze'}</text>
      <text x="100" y="145" class="gk-tot" id="gkTot">${gespeeldTotaal()} gespeeld</text>
    </svg>
  </div>`;
}
// Digitale klok rechtsboven op de veldtekening; toont dezelfde tijd als de timer.
function veldKlokHTML(){
  const k=klokTekst(); if(!k)return '';
  return `<div class="veldklok${k.loopt?'':' pauze'}" id="veldklok">

// Klopt de getoonde opstelling nog met de klok? Zo niet: opnieuw tekenen.
function beeldBijwerken(){
  if(!isQTab(activeTab)||!state.schedule)return;
  const q=huidigQ();
  const lb=levendBlok(q), moet=lb==null?0:lb;
  if(_getoond.q===q && _getoond.blok===moet)return;
  const v=document.getElementById('view'), y=v?v.scrollTop:0;
  render();
  if(v)document.getElementById('view').scrollTop=y;
}
// Werkt alleen het klokje op de veldtekening bij, zonder de rest te hertekenen.
// Toont de zwevende klok zodra die op het veld uit beeld scrollt. Alleen op smalle
// schermen: op een liggende tablet staat het veld sowieso stil bovenaan.
function zwevendeKlokBijwerken(){
  const zw=document.getElementById('zwevendeKlok'); if(!zw)return;
  const veldk=document.getElementById('veldklok');
  const bar=document.querySelector('.appbar');
  // De kwartbolletjes plakken onder de titelbalk. Zonder die erbij te tellen hing de
  // klok er precies overheen en waren de bolletjes niet meer te bedienen.
  const qbar=document.querySelector('.qbar');
  const onderBar=bar?bar.getBoundingClientRect().bottom:0;
  const onder=Math.max(onderBar, qbar?qbar.getBoundingClientRect().bottom:0);
  const toon = !isWide() && isQTab(activeTab) && !!veldk
    && veldk.getBoundingClientRect().bottom < onder + 4;

  const t=document.getElementById('zwTijd'); if(t)t.textContent=k.tijd;
  const sub=document.getElementById('zwSub'); if(sub)sub.textContent=k.kwart+(k.loopt?'':' · pauze');
  zw.classList.toggle('pauze',!k.loopt);
}
// Telt de kaarten af terwijl de klok loopt en geeft één keer een seintje zodra
// iemand weer mag meedoen. De coach haalt hem zelf terug; automatisch terugzetten
// zou de opstelling laten verspringen op een moment dat hij er niet naar kijkt.
let _kaartGemeld={};
function kaartenBijwerken(){
  kaartLijst().forEach(p=>{
    const el=document.getElementById('kt-'+p.id);
    const rest=kaartResterend(p);
    if(el){
      el.textContent = rest===0 ? 'nu terug' : kaartTijd(rest);
      el.classList.toggle('klaar',rest===0);
    }
    if(rest===0 && !_kaartGemeld[p.id]){
      _kaartGemeld[p.id]=true;
      toast(p.name+' mag weer meedoen — tik hem aan');
      if('vibrate' in navigator)navigator.vibrate([60,50,60]);
    }
    if(rest>0)_kaartGemeld[p.id]=false;
  });
}
function veldKlokBijwerken(){
  const k=klokTekst(); if(!k)return;
  // grote klok (liggende tablet)
  const gt=document.getElementById('gkTijd');
  if(gt){
    gt.textContent=k.tijd;
    const gs=document.getElementById('gkSub');
    if(gs)gs.textContent=k.kwart+(k.loopt?'':' \u00b7 pauze');
    const gtot=document.getElementById('gkTot');
    if(gtot)gtot.textContent=gespeeldTotaal()+' gespeeld';
    const boog=document.getElementById('gkBoog');
    if(boog){
      const QLEN=17.5*60, sec=klok.q==null?0:Math.min(klok.sec,QLEN);
      boog.setAttribute('stroke-dashoffset',(KLOK_OMTREK*(1-sec/QLEN)).toFixed(1));
      boog.classList.toggle('laat',sec>QLEN-120);
    }
  }
  zwevendeKlokBijwerken();
  kaartenBijwerken();
  const vt=document.getElementById('vkTijd');
  if(vt){
    vt.textContent=k.tijd;
    const vs=document.getElementById('vkSub');
    if(vs)vs.innerHTML=k.kwart+(k.loopt?'':' &middot; pauze');
    const vk=document.getElementById('veldklok'); if(vk)vk.classList.toggle('pauze',!k.loopt);
  }
}
// Spelers die tijdens de wedstrijd even niet inzetbaar zijn (blessure).
// Tijdelijke toestand: bij een volledig nieuw schema vervalt hij vanzelf.
function uitLijst(){return state.players.filter(p=>p.present&&p.uit);}
// Een kaart haalt de speler wél van het veld maar niet uit het schema: het team
// speelt zolang met een man minder, en daarna staat hij weer op zijn eigen plek.
// Daarom géén p.uit — dan zou de planner hem voor de rest van de wedstrijd overslaan.
function kaartLijst(){return state.players.filter(p=>p.present&&p.kaart);}
function heeftKaart(pid){const p=byId(pid);return !!(p&&p.kaart);}
function wisUitStatus(){state.players.forEach(p=>{if(p.uit)delete p.uit;if(p.kaart)delete p.kaart;});}
// ── Kaarten ──
// Een groene kaart is twee minuten, een gele vijf. Dezelfde machinerie als een
// blessure — speler eruit, schema herplannen — maar met een aftelling erbij, want
// bij een kaart weet je van tevoren wanneer hij weer mag meedoen.
function totaalSec(){ return klok.q==null?0:((klok.q-1)*17.5*60+klok.sec); }
function kaartResterend(p){
  if(!p||!p.kaart)return null;
  return Math.max(0,Math.round(p.kaart.terug-totaalSec()));
}
function kaartTijd(sec){
  const m=Math.floor(sec/60), s2=sec%60;
  return m+':'+String(s2).padStart(2,'0');
}
// Het blok dat nú bezig is in kwart q (of het startblok als de klok stilstaat).
// De wedstrijd is bezig zodra de klok loopt of gepauzeerd op een tijd staat.
function wedstrijdBezig(){return klok.q!=null && (klok.loopt || klok.sec>0);}
function huidigBlok(q){const lb=levendBlok(q);return lb==null?0:lb;}
function levendBlok(q){
  if(!state.schedule)return null;
  if(klok.q!==q+1)return null;
  if(!klok.loopt&&klok.sec===0)return null;      // klok staat op nul: gewoon de startopstelling
  const perQ=state.schedule.perQ, blokSec=17.5*60/perQ;
  return Math.max(0,Math.min(perQ-1,Math.floor(klok.sec/blokSec)));
}

// is een aparte keuze geworden. Standaard volgt hij de wedstrijdklok; kiest de coach
// zelf een kwart, dan gaat die keuze voor tot de klok naar een ander kwart springt.
let toonQ=null;   // null = volg de klok
function huidigQ(){
  if(toonQ!=null)return toonQ;
  return klok.q?klok.q-1:0;   // klok stil of niet gestart: Q1
}
