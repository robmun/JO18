# Houdt de demomap gelijk aan de hoofdmap.
#
# Waarom: de demo draait op exact dezelfde bestanden als productie — de app kijkt
# alleen of '/demo/' in het adres staat. Ze moesten dus met de hand twee keer worden
# geüpload, en dat ging mis: de demo stond 37 versies achter zonder dat iemand het zag.
#
# Wat dit doet: zodra index.html, timer.html of version.json in de hoofdmap verandert,
# kopieert GitHub ze naar demo/ en legt dat vast als een eigen commit. Jij uploadt dus
# nog maar op één plek.
#
# Daarvoor controleert hij of de vier versienummers gelijklopen. Lopen ze uiteen, dan
# stopt de run met een foutmelding en wordt er niets gekopieerd — beter een rode melding
# in GitHub dan een demo die stilletjes de verkeerde versie serveert.

name: Demo gelijktrekken

on:
  push:
    branches: [main, master]
    paths:
      - index.html
      - timer.html
      - version.json
  workflow_dispatch:        # ook met de hand te starten via het tabblad Actions

permissions:
  contents: write           # nodig om de kopie terug te mogen schrijven

concurrency:                # twee uploads vlak na elkaar niet door elkaar laten lopen
  group: demo-gelijktrekken
  cancel-in-progress: false

jobs:
  gelijktrekken:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Versienummers controleren
        run: |
          app=$(grep -o "const APP_VERSION=[0-9]\+" index.html | head -1 | grep -o "[0-9]\+")
          tim=$(grep -o "var TIMER_VERSION = [0-9]\+" timer.html | head -1 | grep -o "[0-9]\+")
          jsn=$(grep -o '"version"[[:space:]]*:[[:space:]]*[0-9]\+' version.json | grep -o "[0-9]\+")
          lab=$(grep -o "const VERSIE_LABEL='[^']*'" index.html | head -1 | cut -d"'" -f2)
          echo "index.html   APP_VERSION   = $app"
          echo "timer.html   TIMER_VERSION = $tim"
          echo "version.json version       = $jsn"
          echo "etiket                     = $lab"
          if [ -z "$app" ] || [ -z "$tim" ] || [ -z "$jsn" ]; then
            echo "::error::Een van de versienummers is niet gevonden."
            exit 1
          fi
          if [ "$app" != "$tim" ] || [ "$app" != "$jsn" ]; then
            echo "::error::De versienummers lopen uiteen ($app / $tim / $jsn). Upload de drie bestanden uit dezelfde build."
            exit 1
          fi
          echo "VERSIE=$lab" >> "$GITHUB_ENV"

      - name: Kopieren naar demo/
        run: |
          mkdir -p demo
          cp index.html timer.html version.json demo/

      - name: Vastleggen als er iets veranderd is
        run: |
          if git diff --quiet -- demo; then
            echo "demo stond al gelijk — niets te doen"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo
          git commit -m "demo gelijkgetrokken met $VERSIE"
          git push
