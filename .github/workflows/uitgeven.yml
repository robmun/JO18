# Testen en pas daarna uitgeven.
#
# Deze workflow doet bij elke upload naar main vier dingen, in deze volgorde:
#   1. demo/ en 404.html gelijktrekken met de hoofdmap (en dat vastleggen)
#   2. de vijf tests uit de map test/ draaien
#   3. alleen als die groen zijn: de site publiceren
#   4. bij rood: de schermafdrukken van de mislukte test bewaren
#
# Punt 3 is waarom GitHub Pages op "GitHub Actions" moet staan in plaats van op
# "Deploy from a branch". Staat het op een branch, dan publiceert GitHub zelf bij
# elke upload en kan geen enkele test dat nog tegenhouden.
#
# Deze workflow vervangt sync-demo.yml; laat ze niet allebei staan.

name: Testen en uitgeven

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # om demo/ en 404.html bij te werken
  pages: write      # om de site te publiceren
  id-token: write

# Nooit twee uitgaves tegelijk, en een lopende niet afbreken.
concurrency:
  group: uitgeven
  cancel-in-progress: false

jobs:
  uitgeven:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publiceren.outputs.page_url }}
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Kopieën gelijktrekken
        run: |
          set -e
          mkdir -p demo
          cp index.html 404.html
          cp index.html timer.html version.json demo/

      - name: Gelijkgetrokken kopieën vastleggen
        run: |
          set -e
          if [ -z "$(git status --porcelain)" ]; then
            echo "demo/ en 404.html liepen al gelijk — niets vast te leggen"
            exit 0
          fi
          LABEL=$(grep -o "VERSIE_LABEL='[^']*'" index.html | head -1 | cut -d"'" -f2)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "demo/ en 404.html gelijkgetrokken met ${LABEL:-de hoofdmap}"
          git push

      - name: Node klaarzetten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testgereedschap installeren
        working-directory: test
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Gaat hier iets mis, dan stopt de workflow en wordt er niets gepubliceerd.
      - name: Tests draaien
        run: node test/run.js

      - name: Schermafdrukken bewaren als er iets mis was
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-uitvoer
          path: test/uitvoer/
          if-no-files-found: ignore

      # De map test/ hoort niet op de website; node_modules al helemaal niet.
      - name: Site klaarzetten
        run: |
          set -e
          mkdir -p _site
          tar --exclude=./test --exclude=./.git --exclude=./.github --exclude=./_site -cf - . | tar -xf - -C _site
          ls -la _site

      - name: Pages instellen
        uses: actions/configure-pages@v5

      - name: Site inpakken
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publiceren
        id: publiceren
        uses: actions/deploy-pages@v4
