# Testen en pas daarna uitgeven.
#
# Twee momenten waarop dit draait:
#
#   • bij een pull request — dan worden alléén de tests gedraaid. Je ziet op het
#     voorstel een groen of rood vinkje voordat je op Merge drukt, en er wordt niets
#     gepubliceerd en niets vastgelegd.
#
#   • bij een upload naar main — dan worden de tests gedraaid én, als die groen zijn,
#     demo/ en 404.html gelijkgetrokken en de site gepubliceerd.
#
# Dat publiceren kan alleen als GitHub Pages bij Settings → Pages op 'GitHub Actions'
# staat. Staat het op 'Deploy from a branch', dan publiceert GitHub zelf bij elke
# upload en kan geen enkele test dat nog tegenhouden.

name: Testen en uitgeven

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testen:
    name: Tests
    runs-on: ubuntu-latest
    # Upload je drie keer kort na elkaar — eerst de tests, dan de app, dan nog een
    # correctie — dan stonden die drie runs vroeger achter elkaar in de rij van ruim
    # vier minuten elk. Alleen de laatste zegt iets: die draait tegen de repository
    # zoals hij ná alle uploads is. Daarom worden de oudere hier afgebroken zodra er
    # een nieuwere begint. Zo'n afgebroken run komt grijs in de lijst te staan; dat
    # betekent 'ingehaald', niet 'stuk'.
    concurrency:
      group: tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      # Ook hier gelijktrekken, maar zonder iets vast te leggen: zo toetsen de tests
      # precies wat er gepubliceerd zou worden. Zonder deze stap zou test 01 klagen
      # over een demo-map die de uitgave zelf pas bijwerkt.
      - name: Kopieën gelijktrekken (alleen in deze draai)
        run: |
          set -e
          mkdir -p demo
          cp index.html 404.html
          cp index.html timer.html version.json demo/

      - name: Node klaarzetten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Een runner begint elke keer met een lege machine, dus werden de pakketten en
      # de testbrowser (ruim 100 MB) bij iedere upload opnieuw opgehaald. Dat kostte
      # het grootste deel van de wachttijd. Ze worden nu bewaard en teruggezet.
      # De sleutel hangt aan test/package.json: verandert daar de versie van Playwright,
      # dan haalt hij vanzelf een nieuwe browser op in plaats van de oude te hergebruiken.
      - name: Pakketten en testbrowser terugzetten
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: test-${{ runner.os }}-${{ hashFiles('test/package.json') }}
          restore-keys: |
            test-${{ runner.os }}-

      - name: Testgereedschap installeren
        working-directory: test
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Tests draaien
        run: node test/run.js

      - name: Schermafdrukken bewaren als er iets mis was
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-uitvoer
          path: test/uitvoer/
          if-no-files-found: ignore

  uitgeven:
    name: Publiceren
    needs: testen
    # Alleen bij een upload naar main of met de hand gestart — nooit bij een pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Hier juist níet afbreken. Een publicatie die halverwege wordt afgekapt kan bij
    # GitHub Pages blijven hangen en de volgende tegenhouden. Ze wachten dus netjes
    # op elkaar — dat kan, want ze duren onder de minuut. Het afbreken gebeurt een
    # stap eerder, bij de tests, dus een ingehaalde upload komt hier toch nooit aan.
    concurrency:
      group: pages-uitgave
      cancel-in-progress: false
    permissions:
      contents: write   # om demo/ en 404.html bij te werken
      pages: write      # om de site te publiceren
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publiceren.outputs.page_url }}
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Kopieën gelijktrekken
        run: |
          set -e
          mkdir -p demo
          cp index.html 404.html
          cp index.html timer.html version.json demo/

      - name: Gelijkgetrokken kopieën vastleggen
        run: |
          set -e
          if [ -z "$(git status --porcelain)" ]; then
            echo "demo/ en 404.html liepen al gelijk — niets vast te leggen"
            exit 0
          fi
          LABEL=$(grep -o "VERSIE_LABEL='[^']*'" index.html | head -1 | cut -d"'" -f2)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "demo/ en 404.html gelijkgetrokken met ${LABEL:-de hoofdmap}"
          # Wachten er twee uitgaven achter elkaar, dan heeft de eerste al een commit
          # geplaatst en loopt deze een stap achter. Eén keer bijtrekken en opnieuw.
          git push || { git pull --rebase; git push; }

      # De map test/ hoort niet op de website; node_modules al helemaal niet.
      - name: Site klaarzetten
        run: |
          set -e
          mkdir -p _site
          tar --exclude=./test --exclude=./.git --exclude=./.github --exclude=./_site -cf - . | tar -xf - -C _site
          ls -la _site

      - name: Pages instellen
        uses: actions/configure-pages@v5

      - name: Site inpakken
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publiceren
        id: publiceren
        uses: actions/deploy-pages@v4
